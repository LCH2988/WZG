<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多活動類別報名系統</title>
  <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
          font-family: 'Microsoft JhengHei', Arial, sans-serif;
          background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
          min-height: 100vh;
          padding: 20px;
      }
      .container {
          max-width: 1200px;
          margin: 0 auto;
          background: white;
          border-radius: 15px;
          box-shadow: 0 10px 30px rgba(0,0,0,0.3);
          overflow: hidden;
      }
      .header {
          background: linear-gradient(135deg, #667eea, #764ba2);
          color: white;
          padding: 30px;
          text-align: center;
      }
      .header h1 { font-size: 2.5em; margin-bottom: 10px; }
      .header p { font-size: 1.2em; opacity: 0.9; }
      
      .nav-tabs {
          display: flex;
          background: #f8f9fa;
          border-bottom: 2px solid #dee2e6;
      }
      .nav-tab {
          flex: 1;
          padding: 15px;
          text-align: center;
          cursor: pointer;
          border: none;
          background: transparent;
          font-size: 16px;
          font-weight: bold;
          transition: all 0.3s;
      }
      .nav-tab.active {
          background: white;
          color: #667eea;
          border-bottom: 3px solid #667eea;
      }
      .nav-tab:hover:not(.active) {
          background: #e9ecef;
      }
      
      .tab-content {
          display: none;
          padding: 30px;
      }
      .tab-content.active { display: block; }
      
      /* 活動卡片樣式 */
      .event-grid {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
          gap: 20px;
          margin-bottom: 30px;
      }
      .event-card {
          border: 2px solid #e9ecef;
          border-radius: 12px;
          overflow: hidden;
          transition: all 0.3s;
          background: white;
      }
      .event-card:hover {
          transform: translateY(-5px);
          box-shadow: 0 8px 25px rgba(0,0,0,0.15);
      }
      .event-card.mountain { border-color: #4CAF50; }
      .event-card.cycling { border-color: #2196F3; }
      .event-card.running { border-color: #FF9800; }
      .event-card.water { border-color: #00BCD4; }
      
      .card-header {
          padding: 20px;
          color: white;
          text-align: center;
      }
      .card-header.mountain { background: linear-gradient(135deg, #4CAF50, #45a049); }
      .card-header.cycling { background: linear-gradient(135deg, #2196F3, #1976D2); }
      .card-header.running { background: linear-gradient(135deg, #FF9800, #F57C00); }
      .card-header.water { background: linear-gradient(135deg, #00BCD4, #0097A7); }
      
      .card-header h3 {
          font-size: 1.5em;
          margin-bottom: 5px;
      }
      .card-body {
          padding: 20px;
      }
      .card-body h4 {
          color: #333;
          margin-bottom: 10px;
      }
      .card-body p {
          color: #666;
          margin-bottom: 15px;
          line-height: 1.5;
      }
      .stats-grid {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 10px;
          margin-bottom: 15px;
      }
      .stat-item {
          text-align: center;
          padding: 10px;
          background: #f8f9fa;
          border-radius: 8px;
      }
      .stat-number {
          font-size: 1.5em;
          font-weight: bold;
          color: #333;
      }
      .stat-label {
          font-size: 0.9em;
          color: #666;
      }
      .register-btn {
          width: 100%;
          padding: 12px;
          border: none;
          border-radius: 8px;
          font-size: 1.1em;
          font-weight: bold;
          color: white;
          cursor: pointer;
          transition: all 0.3s;
      }
      .register-btn.mountain { background: #4CAF50; }
      .register-btn.cycling { background: #2196F3; }
      .register-btn.running { background: #FF9800; }
      .register-btn.water { background: #00BCD4; }
      .register-btn:hover { transform: translateY(-2px); }
      
      /* 管理員介面樣式 */
      .admin-section {
          background: #f8f9fa;
          padding: 20px;
          border-radius: 10px;
          margin-bottom: 20px;
      }
      .admin-section h3 {
          color: #333;
          margin-bottom: 15px;
          padding-bottom: 10px;
          border-bottom: 2px solid #dee2e6;
      }
      .form-group {
          margin-bottom: 15px;
      }
      .form-group label {
          display: block;
          margin-bottom: 5px;
          font-weight: bold;
          color: #333;
      }
      .form-group input,
      .form-group textarea,
      .form-group select {
          width: 100%;
          padding: 10px;
          border: 2px solid #dee2e6;
          border-radius: 6px;
          font-size: 14px;
      }
      .form-group input:focus,
      .form-group textarea:focus,
      .form-group select:focus {
          outline: none;
          border-color: #667eea;
      }
      .btn {
          padding: 10px 20px;
          border: none;
          border-radius: 6px;
          cursor: pointer;
          font-size: 14px;
          font-weight: bold;
          transition: all 0.3s;
      }
      .btn-primary {
          background: #667eea;
          color: white;
      }
      .btn-primary:hover {
          background: #5a6fd8;
      }
      .btn-success {
          background: #28a745;
          color: white;
      }
      .btn-success:hover {
          background: #218838;
      }
      .btn-danger {
          background: #dc3545;
          color: white;
      }
      .btn-danger:hover {
          background: #c82333;
      }
      
      /* 表單設定樣式 */
      .field-list {
          border: 2px solid #dee2e6;
          border-radius: 8px;
          max-height: 300px;
          overflow-y: auto;
      }
      .field-item {
          display: flex;
          align-items: center;
          padding: 10px;
          border-bottom: 1px solid #dee2e6;
          background: white;
      }
      .field-item:last-child {
          border-bottom: none;
      }
      .field-info {
          flex: 1;
          margin-right: 10px;
      }
      .field-name {
          font-weight: bold;
          color: #333;
      }
      .field-details {
          font-size: 0.9em;
          color: #666;
      }
      .field-actions {
          display: flex;
          gap: 5px;
      }
      
      /* 統計表格樣式 */
      .stats-table {
          width: 100%;
          border-collapse: collapse;
          margin-top: 15px;
      }
      .stats-table th,
      .stats-table td {
          padding: 12px;
          text-align: left;
          border-bottom: 1px solid #dee2e6;
      }
      .stats-table th {
          background: #f8f9fa;
          font-weight: bold;
          color: #333;
      }
      .stats-table tr:hover {
          background: #f8f9fa;
      }
      
      /* 響應式設計 */
      @media (max-width: 768px) {
          .event-grid {
              grid-template-columns: 1fr;
          }
          .nav-tabs {
              flex-direction: column;
          }
          .stats-grid {
              grid-template-columns: 1fr;
          }
      }
      
      /* 載入動畫 */
      .loading {
          display: inline-block;
          width: 20px;
          height: 20px;
          border: 3px solid rgba(102, 126, 234, .3);
          border-radius: 50%;
          border-top-color: #667eea;
          animation: spin 1s ease-in-out infinite;
      }
      @keyframes spin {
          to { transform: rotate(360deg); }
      }
      
      /* 狀態指示器 */
      .status-indicator {
          display: inline-block;
          width: 10px;
          height: 10px;
          border-radius: 50%;
          margin-right: 5px;
      }
      .status-active { background: #28a745; }
      .status-inactive { background: #dc3545; }
      .status-full { background: #ffc107; }
  </style>
</head>
<body>
  <div class="container">
      <div class="header">
          <h1>🎯 多活動類別報名系統</h1>
          <p>登山 • 單車 • 跑步 • 水上運動</p>
      </div>
      
      <div class="nav-tabs">
          <button class="nav-tab active" onclick="switchTab('events')">🎪 活動總覽</button>
          <button class="nav-tab" onclick="switchTab('admin')">⚙️ 活動管理</button>
          <button class="nav-tab" onclick="switchTab('forms')">📝 表單設定</button>
          <button class="nav-tab" onclick="switchTab('stats')">📊 統計分析</button>
      </div>
      
      <!-- 活動總覽頁面 -->
      <div id="events" class="tab-content active">
          <h2>🎪 活動總覽</h2>
          <div id="eventGrid" class="event-grid">
              <!-- 活動卡片將由 JavaScript 動態生成 -->
          </div>
      </div>
      
      <!-- 活動管理頁面 -->
      <div id="admin" class="tab-content">
          <h2>⚙️ 活動管理</h2>
          <div id="adminSections">
              <!-- 管理介面將由 JavaScript 動態生成 -->
          </div>
      </div>
      
      <!-- 表單設定頁面 -->
      <div id="forms" class="tab-content">
          <h2>📝 表單設定</h2>
          <div class="admin-section">
              <label for="formCategory">選擇活動類別：</label>
              <select id="formCategory" onchange="loadFormConfig()">
                  <option value="">請選擇活動類別</option>
                  <option value="mountain">🏔️ 登山組</option>
                  <option value="cycling">🚴‍♂️ 單車組</option>
                  <option value="running">🏃‍♂️ 跑步組</option>
                  <option value="water">🏊‍♂️ 水上組</option>
              </select>
          </div>
          
          <div id="formConfigSection" style="display: none;">
              <div class="admin-section">
                  <h3>📋 目前表單欄位</h3>
                  <div id="fieldList" class="field-list">
                      <!-- 欄位列表將由 JavaScript 動態生成 -->
                  </div>
              </div>
              
              <div class="admin-section">
                  <h3>➕ 新增表單欄位</h3>
                  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                      <div class="form-group">
                          <label>欄位ID：</label>
                          <input type="text" id="newFieldId" placeholder="例如：phone">
                      </div>
                      <div class="form-group">
                          <label>欄位標籤：</label>
                          <input type="text" id="newFieldLabel" placeholder="例如：手機號碼">
                      </div>
                      <div class="form-group">
                          <label>欄位類型：</label>
                          <select id="newFieldType">
                              <option value="text">文字輸入</option>
                              <option value="email">Email</option>
                              <option value="tel">電話號碼</option>
                              <option value="date">日期</option>
                              <option value="select">下拉選單</option>
                              <option value="textarea">多行文字</option>
                          </select>
                      </div>
                      <div class="form-group">
                          <label>是否必填：</label>
                          <select id="newFieldRequired">
                              <option value="false">否</option>
                              <option value="true">是</option>
                          </select>
                      </div>
                  </div>
                  <div class="form-group">
                      <label>選項設定（下拉選單用，以逗號分隔）：</label>
                      <input type="text" id="newFieldOptions" placeholder="例如：選項1,選項2,選項3">
                  </div>
                  <button class="btn btn-primary" onclick="addFormField()">➕ 新增欄位</button>
                  <button class="btn btn-success" onclick="saveFormConfig()">💾 儲存設定</button>
              </div>
          </div>
      </div>
      
      <!-- 統計分析頁面 -->
      <div id="stats" class="tab-content">
          <h2>📊 統計分析</h2>
          <div class="admin-section">
              <label for="statsCategory">選擇活動類別：</label>
              <select id="statsCategory" onchange="loadStats()">
                  <option value="">請選擇活動類別</option>
                  <option value="mountain">🏔️ 登山組</option>
                  <option value="cycling">🚴‍♂️ 單車組</option>
                  <option value="running">🏃‍♂️ 跑步組</option>
                  <option value="water">🏊‍♂️ 水上組</option>
              </select>
          </div>
          
          <div id="statsContent">
              <!-- 統計內容將由 JavaScript 動態生成 -->
          </div>
      </div>
  </div>

  <script>
      // 全域變數
      let eventCategories = {
          mountain: { name: "登山組", icon: "🏔️", color: "#4CAF50" },
          cycling: { name: "單車組", icon: "🚴‍♂️", color: "#2196F3" },
          running: { name: "跑步組", icon: "🏃‍♂️", color: "#FF9800" },
          water: { name: "水上組", icon: "🏊‍♂️", color: "#00BCD4" }
      };
      
      let currentFormFields = [];
      let currentCategory = '';
      
      const GAS_URL = 'https://script.google.com/macros/s/AKfycbzD2KyR1jM5n6_z-C7IjolBe7kIP9iHhooq-44YTm0B99vbthPMy6Yt7MLk2TZGWIOr/exec';
      
      // 頁面載入時初始化
      document.addEventListener('DOMContentLoaded', function() {
          loadEventOverview();
          loadAdminSections();
      });
      
      // 切換分頁
      function switchTab(tabName) {
          // 隱藏所有分頁內容
          document.querySelectorAll('.tab-content').forEach(content => {
              content.classList.remove('active');
          });
          
          // 移除所有分頁按鈕的 active 狀態
          document.querySelectorAll('.nav-tab').forEach(tab => {
              tab.classList.remove('active');
          });
          
          // 顯示選中的分頁內容
          document.getElementById(tabName).classList.add('active');
          
          // 添加選中分頁按鈕的 active 狀態
          event.target.classList.add('active');
          
          // 根據分頁載入對應內容
          switch(tabName) {
              case 'events':
                  loadEventOverview();
                  break;
              case 'admin':
                  loadAdminSections();
                  break;
              case 'forms':
                  // 表單設定頁面不需要額外載入
                  break;
              case 'stats':
                  // 統計分析頁面不需要額外載入
                  break;
          }
      }
      
      // 載入活動總覽
      async function loadEventOverview() {
          try {
              const response = await fetch(GAS_URL);
              const data = await response.json();
              
              if (data.success && data.categories) {
                  renderEventCards(data.categories);
              } else {
                  // 如果 API 不可用，顯示示例數據
                  renderEventCards(createSampleData());
              }
          } catch (error) {
              console.error('載入活動總覽失敗:', error);
              renderEventCards(createSampleData());
          }
      }
      
      // 創建示例數據
      function createSampleData() {
          const sampleData = {};
          for (let category in eventCategories) {
              sampleData[category] = {
                  info: eventCategories[category],
                  config: {
                      title: `${eventCategories[category].name}精彩活動`,
                      description: "歡迎參加我們精心規劃的活動，體驗不一樣的樂趣！",
                      maxParticipants: 50,
                      isActive: true
                  },
                  stats: {
                      confirmed: Math.floor(Math.random() * 40) + 5,
                      waitlist: Math.floor(Math.random() * 10)
                  }
              };
          }
          return sampleData;
      }
      
      // 渲染活動卡片
      function renderEventCards(categories) {
          const eventGrid = document.getElementById('eventGrid');
          eventGrid.innerHTML = '';
          
          for (let category in categories) {
              const categoryData = categories[category];
              const info = categoryData.info;
              const config = categoryData.config;
              const stats = categoryData.stats;
              
              const availableSpots = Math.max(0, config.maxParticipants - stats.confirmed);
              const isActive = config.isActive;
              const isFull = availableSpots === 0;
              
              const cardHtml = `
                  <div class="event-card ${category}">
                      <div class="card-header ${category}">
                          <h3>${info.icon} ${info.name}</h3>
                          <div class="status-indicator ${isActive ? (isFull ? 'status-full' : 'status-active') : 'status-inactive'}"></div>
                          ${isActive ? (isFull ? '已額滿' : '開放報名') : '暫停報名'}
                      </div>
                      <div class="card-body">
                          <h4>${config.title}</h4>
                          <p>${config.description}</p>
                          <div class="stats-grid">
                              <div class="stat-item">
                                  <div class="stat-number">${stats.confirmed}</div>
                                  <div class="stat-label">已報名</div>
                              </div>
                              <div class="stat-item">
                                  <div class="stat-number">${availableSpots}</div>
                                  <div class="stat-label">剩餘名額</div>
                              </div>
                              <div class="stat-item">
                                  <div class="stat-number">${stats.waitlist}</div>
                                  <div class="stat-label">候補人數</div>
                              </div>
                              <div class="stat-item">
                                  <div class="stat-number">${config.maxParticipants}</div>
                                  <div class="stat-label">總名額</div>
                              </div>
                          </div>
                          <button class="register-btn ${category}" 
                                  onclick="openRegistration('${category}')"
                                  ${!isActive ? 'disabled' : ''}>
                              ${isActive ? '🎯 立即報名' : '⏸️ 暫停報名'}
                          </button>
                      </div>
                  </div>
              `;
              
              eventGrid.innerHTML += cardHtml;
          }
      }

      // 開啟報名頁面
      function openRegistration(category) {
          const liffUrl = `https://liff.line.me/2007905012-o1yDNa92?category=${category}`;
          window.open(liffUrl, '_blank');
      }
      
      // 載入管理員設定區塊
      function loadAdminSections() {
          const adminSections = document.getElementById('adminSections');
          adminSections.innerHTML = '';
          
          for (let category in eventCategories) {
              const info = eventCategories[category];
              const sectionHtml = `
                  <div class="admin-section">
                      <h3>${info.icon} ${info.name} 設定</h3>
                      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                          <div class="form-group">
                              <label>活動標題：</label>
                              <input type="text" id="${category}_title" placeholder="輸入活動標題">
                          </div>
                          <div class="form-group">
                              <label>報名上限：</label>
                              <input type="number" id="${category}_max" placeholder="50" min="1">
                          </div>
                      </div>
                      <div class="form-group">
                          <label>活動說明：</label>
                          <textarea id="${category}_description" rows="3" placeholder="輸入活動說明"></textarea>
                      </div>
                      <div class="form-group">
                          <label>
                              <input type="checkbox" id="${category}_active"> 啟用此活動
                          </label>
                      </div>
                      <button class="btn btn-primary" onclick="updateEventConfig('${category}')">
                          💾 更新設定
                      </button>
                      <button class="btn btn-success" onclick="viewRegistrationList('${category}')">
                          📋 查看報名名單
                      </button>
                  </div>
              `;
              adminSections.innerHTML += sectionHtml;
          }
          
          // 載入現有設定
          loadCurrentEventConfig();
      }
      
      // 載入目前活動設定
      async function loadCurrentEventConfig() {
          try {
              const response = await fetch(GAS_URL, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ action: 'getEventConfig' })
              });
              const data = await response.json();
              
              if (data.success && data.config) {
                  for (let category in data.config) {
                      const config = data.config[category];
                      document.getElementById(`${category}_title`).value = config.title || '';
                      document.getElementById(`${category}_description`).value = config.description || '';
                      document.getElementById(`${category}_max`).value = config.maxParticipants || 50;
                      document.getElementById(`${category}_active`).checked = config.isActive || false;
                  }
              }
          } catch (error) {
              console.error('載入活動設定失敗:', error);
          }
      }
      
      // 更新活動設定
      async function updateEventConfig(category) {
          const config = {
              title: document.getElementById(`${category}_title`).value,
              description: document.getElementById(`${category}_description`).value,
              maxParticipants: parseInt(document.getElementById(`${category}_max`).value) || 50,
              isActive: document.getElementById(`${category}_active`).checked
          };
          
          try {
              const response = await fetch(GAS_URL, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                      action: 'updateEventConfig',
                      category: category,
                      config: config
                  })
              });
              const data = await response.json();
              
              if (data.success) {
                  alert('✅ 設定更新成功！');
                  loadEventOverview(); // 重新載入活動總覽
              } else {
                  alert('❌ 設定更新失敗：' + data.message);
              }
          } catch (error) {
              console.error('更新活動設定失敗:', error);
              alert('❌ 更新失敗，請稍後再試');
          }
      }
      
      // 載入表單設定
      async function loadFormConfig() {
          const category = document.getElementById('formCategory').value;
          if (!category) {
              document.getElementById('formConfigSection').style.display = 'none';
              return;
          }
          
          currentCategory = category;
          document.getElementById('formConfigSection').style.display = 'block';
          
          try {
              const response = await fetch(GAS_URL, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                      action: 'getFormConfig',
                      category: category
                  })
              });
              const data = await response.json();
              
              if (data.success) {
                  currentFormFields = data.fields || [];
                  renderFormFields();
              } else {
                  // 如果沒有設定，使用預設欄位
                  currentFormFields = [
                      { id: 'name', label: '姓名', type: 'text', required: true, options: [] }
                  ];
                  renderFormFields();
              }
          } catch (error) {
              console.error('載入表單設定失敗:', error);
              currentFormFields = [
                  { id: 'name', label: '姓名', type: 'text', required: true, options: [] }
              ];
              renderFormFields();
          }
      }
      
      // 渲染表單欄位列表
      function renderFormFields() {
          const fieldList = document.getElementById('fieldList');
          fieldList.innerHTML = '';
          
          currentFormFields.forEach((field, index) => {
              const fieldHtml = `
                  <div class="field-item">
                      <div class="field-info">
                          <div class="field-name">${field.label} (${field.id})</div>
                          <div class="field-details">
                              類型: ${getFieldTypeLabel(field.type)} | 
                              必填: ${field.required ? '是' : '否'}
                              ${field.options.length > 0 ? ` | 選項: ${field.options.join(', ')}` : ''}
                          </div>
                      </div>
                      <div class="field-actions">
                          ${field.id !== 'name' ? `<button class="btn btn-danger" onclick="removeFormField(${index})">🗑️ 刪除</button>` : ''}
                      </div>
                  </div>
              `;
              fieldList.innerHTML += fieldHtml;
          });
      }
      
      // 取得欄位類型標籤
      function getFieldTypeLabel(type) {
          const labels = {
              text: '文字輸入',
              email: 'Email',
              tel: '電話號碼',
              date: '日期',
              select: '下拉選單',
              textarea: '多行文字'
          };
          return labels[type] || type;
      }
      
      // 新增表單欄位
      function addFormField() {
          const id = document.getElementById('newFieldId').value.trim();
          const label = document.getElementById('newFieldLabel').value.trim();
          const type = document.getElementById('newFieldType').value;
          const required = document.getElementById('newFieldRequired').value === 'true';
          const options = document.getElementById('newFieldOptions').value.split(',').map(s => s.trim()).filter(s => s);
          
          if (!id || !label) {
              alert('請填寫欄位ID和標籤');
              return;
          }
          
          // 檢查ID是否重複
          if (currentFormFields.some(field => field.id === id)) {
              alert('欄位ID已存在，請使用不同的ID');
              return;
          }
          
          currentFormFields.push({
              id: id,
              label: label,
              type: type,
              required: required,
              options: options
          });
          
          // 清空表單
          document.getElementById('newFieldId').value = '';
          document.getElementById('newFieldLabel').value = '';
          document.getElementById('newFieldType').value = 'text';
          document.getElementById('newFieldRequired').value = 'false';
          document.getElementById('newFieldOptions').value = '';
          
          renderFormFields();
      }
      
      // 移除表單欄位
      function removeFormField(index) {
          if (confirm('確定要刪除這個欄位嗎？')) {
              currentFormFields.splice(index, 1);
              renderFormFields();
          }
      }
      
      // 儲存表單設定
      async function saveFormConfig() {
          if (!currentCategory) {
              alert('請先選擇活動類別');
              return;
          }
          
          try {
              const response = await fetch(GAS_URL, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                      action: 'updateFormConfig',
                      category: currentCategory,
                      fields: currentFormFields
                  })
              });
              const data = await response.json();
              
              if (data.success) {
                  alert('✅ 表單設定儲存成功！');
              } else {
                  alert('❌ 儲存失敗：' + data.message);
              }
          } catch (error) {
              console.error('儲存表單設定失敗:', error);
              alert('❌ 儲存失敗，請稍後再試');
          }
      }
      
      // 載入統計資料
      async function loadStats() {
          const category = document.getElementById('statsCategory').value;
          if (!category) {
              document.getElementById('statsContent').innerHTML = '';
              return;
          }
          
          try {
              const [statsResponse, listResponse] = await Promise.all([
                  fetch(GAS_URL, {
                      method: 'POST',
                      headers: { 'Content-Type': 'application/json' },
                      body: JSON.stringify({
                          action: 'getRegistrationStats',
                          category: category
                      })
                  }),
                  fetch(GAS_URL, {
                      method: 'POST',
                      headers: { 'Content-Type': 'application/json' },
                      body: JSON.stringify({
                          action: 'getRegistrationList',
                          category: category
                      })
                  })
              ]);
              
              const statsData = await statsResponse.json();
              const listData = await listResponse.json();
              
              if (statsData.success && listData.success) {
                  renderStats(category, statsData.stats, listData.lists);
              } else {
                  renderSampleStats(category);
              }
          } catch (error) {
              console.error('載入統計資料失敗:', error);
              renderSampleStats(category);
          }
      }
      
      // 渲染統計資料
      function renderStats(category, stats, lists) {
          const categoryInfo = eventCategories[category];
          const statsContent = document.getElementById('statsContent');
          
          const statsHtml = `
              <div class="admin-section">
                  <h3>${categoryInfo.icon} ${categoryInfo.name} 統計總覽</h3>
                  <div class="stats-grid">
                      <div class="stat-item">
                          <div class="stat-number">${stats.confirmed}</div>
                          <div class="stat-label">正取人數</div>
                      </div>
                      <div class="stat-item">
                          <div class="stat-number">${stats.waitlist}</div>
                          <div class="stat-label">候補人數</div>
                      </div>
                      <div class="stat-item">
                          <div class="stat-number">${stats.available}</div>
                          <div class="stat-label">剩餘名額</div>
                      </div>
                      <div class="stat-item">
                          <div class="stat-number">${stats.maxParticipants}</div>
                          <div class="stat-label">總名額</div>
                      </div>
                  </div>
              </div>
              
              <div class="admin-section">
                  <h3>📋 正取名單 (${lists.confirmed.length} 人)</h3>
                  <table class="stats-table">
                      <thead>
                          <tr>
                              <th>順位</th>
                              <th>姓名</th>
                              <th>報名時間</th>
                              <th>來源</th>
                          </tr>
                      </thead>
                      <tbody>
                          ${lists.confirmed.map((item, index) => `
                              <tr>
                                  <td>${index + 1}</td>
                                  <td>${item.name}</td>
                                  <td>${item.timestamp}</td>
                                  <td>${item.source}</td>
                              </tr>
                          `).join('')}
                      </tbody>
                  </table>
              </div>
              
              <div class="admin-section">
                  <h3>⏳ 候補名單 (${lists.waitlist.length} 人)</h3>
                  <table class="stats-table">
                      <thead>
                          <tr>
                              <th>候補順位</th>
                              <th>姓名</th>
                              <th>報名時間</th>
                              <th>來源</th>
                          </tr>
                      </thead>
                      <tbody>
                          ${lists.waitlist.map((item, index) => `
                              <tr>
                                  <td>${index + 1}</td>
                                  <td>${item.name}</td>
                                  <td>${item.timestamp}</td>
                                  <td>${item.source}</td>
                              </tr>
                          `).join('')}
                      </tbody>
                  </table>
              </div>
          `;
          
          statsContent.innerHTML = statsHtml;
      }
      
      // 渲染示例統計資料
      function renderSampleStats(category) {
          const categoryInfo = eventCategories[category];
          const sampleStats = {
              confirmed: Math.floor(Math.random() * 40) + 5,
              waitlist: Math.floor(Math.random() * 10),
              maxParticipants: 50
          };
          sampleStats.available = sampleStats.maxParticipants - sampleStats.confirmed;
          
          const sampleLists = {
              confirmed: Array.from({length: sampleStats.confirmed}, (_, i) => ({
                  name: `報名者${i + 1}`,
                  timestamp: new Date(Date.now() - Math.random() * 7 * 24 * 60 * 60 * 1000).toLocaleString('zh-TW'),
                  source: 'LIFF表單'
              })),
              waitlist: Array.from({length: sampleStats.waitlist}, (_, i) => ({
                  name: `候補者${i + 1}`,
                  timestamp: new Date(Date.now() - Math.random() * 7 * 24 * 60 * 60 * 1000).toLocaleString('zh-TW'),
                  source: 'LIFF表單'
              }))
          };
          
          renderStats(category, sampleStats, sampleLists);
      }
      
      // 查看報名名單
      function viewRegistrationList(category) {
          document.getElementById('statsCategory').value = category;
          loadStats();
          switchTab('stats');
          // 模擬點擊統計分析分頁
          document.querySelectorAll('.nav-tab')[3].click();
      }
  </script>
</body>
</html>
