<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>三鐵活動報名系統</title>
<meta name="description" content="三鐵活動多分類報名系統 - 登山組、單車組、慢跑組、水上組">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏃‍♂️</text></svg>">
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root {
    --primary-color:#1565c0;--secondary-color:#42a5f5;--success-color:#4caf50;--warning-color:#ff9800;--error-color:#f44336;--info-color:#2196f3;
    --text-color:#333;--bg-color:#f5f7fa;--card-shadow:0 2px 8px rgba(0,0,0,.1);--border-radius:8px;--transition:.3s ease;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Noto Sans TC',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg-color);color:var(--text-color);line-height:1.6;min-height:100vh;display:flex;flex-direction:column}
  header{background:#fff;box-shadow:var(--card-shadow);position:sticky;top:0;z-index:100}
  .header-content{max-width:1200px;margin:0 auto;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
  header h1{font-size:24px;font-weight:600;color:var(--primary-color)}
  .liff-status{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:500;border:2px solid}
  .liff-status.connecting{background:#fff3e0;color:#ef6c00;border-color:#ff9800}
  .liff-status.connected{background:#e8f5e8;color:#2e7d32;border-color:#4caf50}
  .liff-status.disconnected,.liff-status.error{background:#ffebee;color:#c62828;border-color:#f44336}
  .user-info{display:flex;align-items:center;gap:12px;padding:8px 16px;background:#f8f9fa;border-radius:var(--border-radius);border:2px solid #e0e0e0}
  .user-info.logged-in{background:#e8f5e8;border-color:#4caf50}
  .user-avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid #fff;box-shadow:0 2px 4px rgba(0,0,0,.1)}
  .user-details{display:flex;flex-direction:column;gap:2px}
  .user-name{font-weight:600;font-size:14px}
  .user-id{font-size:11px;color:#666;font-family:monospace}
  .login-btn{padding:6px 12px;font-size:12px;min-width:80px;background:#06c755;color:#fff;border:none;border-radius:4px;cursor:pointer;font-weight:500}
  .login-btn:hover{background:#05b04a}
  .logout-btn{background:#666;font-size:11px;padding:4px 8px;min-width:60px;color:#fff;border:none;border-radius:4px;cursor:pointer}
  nav{background:var(--primary-color);padding:0 20px}
  nav a{display:inline-block;padding:12px 20px;color:#fff;text-decoration:none;transition:var(--transition);border-radius:4px 4px 0 0;margin-right:4px}
  nav a:hover,nav a.nav-active{background:rgba(255,255,255,.2)}
  .container{max-width:1200px;margin:0 auto;padding:20px;flex:1}
  footer{background:#333;color:#fff;text-align:center;padding:20px;margin-top:auto}
  .btn,button{background:var(--primary-color);color:#fff;border:none;padding:12px 24px;border-radius:var(--border-radius);cursor:pointer;font-size:14px;font-weight:500;transition:var(--transition);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:100px}
  .btn:hover,button:hover{background:#0d47a1;transform:translateY(-1px)}
  .btn.secondary,button.secondary{background:#6c757d}
  .btn.success,button.success{background:var(--success-color)}
  .btn.warning,button.warning{background:var(--warning-color)}
  .btn.danger,button.danger{background:var(--error-color)}
  .btn:disabled,button:disabled{opacity:.6;cursor:not-allowed;transform:none}
  .btn.loading,button.loading{position:relative;color:transparent}
  .btn.loading::after,button.loading::after{content:"";position:absolute;width:16px;height:16px;border:2px solid #fff;border-top:2px solid transparent;border-radius:50%;animation:spin 1s linear infinite}
  @keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
  .form-group{margin-bottom:20px}
  .form-row{display:grid;gap:16px;grid-template-columns:1fr 1fr}
  label{display:block;margin-bottom:6px;font-weight:500}
  input,select,textarea{width:100%;padding:12px;border:2px solid #e0e0e0;border-radius:var(--border-radius);font-size:14px;font-family:inherit;transition:var(--transition)}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary-color);box-shadow:0 0 0 3px rgba(21,101,192,.1)}
  input.auto-filled{background:linear-gradient(135deg,#e8f5e8,#f1f8e9);border-color:var(--success-color);font-weight:500}
  .auto-fill-indicator{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12px;color:var(--success-color);font-weight:500}
  small{display:block;margin-top:4px;font-size:12px;color:#666}
  .form-actions{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap}
  .card{background:#fff;border-radius:var(--border-radius);box-shadow:var(--card-shadow);padding:20px;transition:var(--transition);border:1px solid #e0e0e0}
  .card:hover{transform:translateY(-2px);box-shadow:0 4px 20px rgba(0,0,0,.15)}
  .grid{display:grid;gap:20px}
  .cols-3{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
  .badge{display:inline-block;padding:4px 12px;border-radius:16px;font-size:12px;font-weight:500;text-align:center}
  .badge.登山組{background:#e8f5e8;color:#2e7d32}
  .badge.單車組{background:#e3f2fd;color:#1565c0}
  .badge.慢跑組{background:#fff3e0;color:#ef6c00}
  .badge.水上組{background:#e0f2f1;color:#00695c}
  .status-indicator{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
  .status-indicator.active{background:var(--success-color)}
  .status-indicator.inactive{background:var(--error-color)}
  .filter-bar{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
  .chip{padding:8px 16px;background:#fff;border:2px solid #e0e0e0;border-radius:20px;cursor:pointer;transition:var(--transition);font-size:14px;font-weight:500;white-space:nowrap}
  .chip:hover,.chip.active{background:var(--primary-color);color:#fff;border-color:var(--primary-color)}
  .msg{padding:12px 16px;border-radius:var(--border-radius);margin:16px 0;border-left:4px solid}
  .msg.success{background:#e8f5e8;color:#2e7d32;border-color:var(--success-color)}
  .msg.error{background:#ffebee;color:#c62828;border-color:var(--error-color)}
  .msg.warning{background:#fff3e0;color:#ef6c00;border-color:var(--warning-color)}
  .msg.info{background:#e3f2fd;color:#1565c0;border-color:var(--info-color)}
  .notification{position:fixed;top:20px;right:20px;padding:16px 20px;border-radius:var(--border-radius);box-shadow:0 4px 20px rgba(0,0,0,.15);z-index:1000;transform:translateX(400px);transition:.4s ease;max-width:350px;display:flex;align-items:center;gap:12px}
  .notification.show{transform:translateX(0)}
  .notification.success{background:var(--success-color);color:#fff}
  .notification.error{background:var(--error-color);color:#fff}
  .notification.warning{background:var(--warning-color);color:#fff}
  .notification.info{background:var(--info-color);color:#fff}
  .modal-backdrop{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}
  .modal-backdrop.show{display:flex}
  .modal{background:#fff;border-radius:var(--border-radius);max-width:600px;width:100%;max-height:90vh;overflow-y:auto;position:relative;animation:modalSlideIn .3s ease}
  @keyframes modalSlideIn{from{opacity:0;transform:scale(.9) translateY(-20px)}to{opacity:1;transform:scale(1) translateY(0)}}
  .modal h2{background:var(--primary-color);color:#fff;padding:20px;margin:0;border-radius:var(--border-radius) var(--border-radius) 0 0}
  .modal-content{padding:20px}
  .close-btn{position:absolute;top:15px;right:20px;background:none;border:none;color:#fff;font-size:24px;cursor:pointer;padding:0;min-width:auto;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center}
  .close-btn:hover{background:rgba(255,255,255,.2)}
  .loading-container{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;color:#666}
  .spinner{width:40px;height:40px;border:4px solid #e0e0e0;border-top:4px solid var(--primary-color);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:16px}
  .empty-state{text-align:center;padding:60px 20px;color:#666}
  .empty-state .small{font-size:14px;color:#999}
  .event-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
  .event-title h3{margin:0 0 8px;color:#333;font-size:18px;line-height:1.3}
  .event-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .event-id{font-family:Courier New,monospace;font-size:12px;color:#666;background:#f0f0f0;padding:2px 6px;border-radius:4px}
  .quota-info{margin:16px 0}
  .quota-bar{background:#e0e0e0;height:8px;border-radius:4px;overflow:hidden;margin:8px 0}
  .quota-fill{height:100%;background:linear-gradient(90deg,var(--success-color),var(--warning-color));transition:width .3s ease}
  .quota-text{font-size:14px;color:#666;display:flex;justify-content:space-between}
  .remain{font-weight:600}
  .remain.ok{color:var(--success-color)}
  .remain.low{color:var(--warning-color)}
  .remain.full{color:var(--error-color)}
  .event-actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
  .event-actions button{flex:1;min-width:100px;font-size:13px;padding:10px 16px}
  .page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:16px}
  .title-section h2{margin:0;font-size:24px}
  .event-count{font-size:14px;color:#666;margin-top:4px}
  .toolbar{display:flex;gap:12px;align-items:center}
  .search-box{position:relative;min-width:250px}
  .search-box input{width:100%;padding:10px 16px;border:2px solid #e0e0e0;border-radius:25px;font-size:14px}
  .refresh-btn{white-space:nowrap;min-width:120px}
  .batch-info{background:#f8f9fa;padding:16px;border-radius:var(--border-radius);margin-bottom:20px}
  .info-grid{display:grid;gap:8px;margin-bottom:16px}
  .batch-tips{border-top:1px solid #e0e0e0;padding-top:12px}
  .batch-tips ul{margin:8px 0 0 20px;font-size:14px;color:#555}
  .counter{font-size:12px;color:#666;float:right}
  .batch-preview{background:#f8f9fa;padding:16px;border-radius:var(--border-radius);margin:16px 0}
  .preview-list{max-height:200px;overflow-y:auto;display:grid;gap:4px}
  .preview-item{padding:4px 8px;background:#fff;border-radius:4px;font-size:14px}
  .stats-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:20px 0}
  .stat-card{background:#f8f9fa;padding:20px;border-radius:var(--border-radius);text-align:center;border-left:4px solid var(--info-color)}
  .stat-card.success{border-color:var(--success-color)}
  .stat-card.warning{border-color:var(--warning-color)}
  .stat-card.error{border-color:var(--error-color)}
  .stat-number{font-size:32px;font-weight:700;margin-bottom:4px}
  .stat-label{font-size:14px;color:#666}
  .admin-menu{margin-bottom:40px}
  .menu-grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
  .menu-card{background:#fff;padding:24px;border-radius:var(--border-radius);box-shadow:var(--card-shadow);text-align:center;cursor:pointer;transition:var(--transition);border:2px solid transparent}
  .menu-card:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(0,0,0,.15);border-color:var(--primary-color)}
  .menu-icon{font-size:48px;margin-bottom:16px}
  .admin-section{background:#fff;border-radius:var(--border-radius);box-shadow:var(--card-shadow);margin-bottom:24px;overflow:hidden;display:none}
  .section-header{background:#f8f9fa;padding:20px 24px;border-bottom:1px solid #e0e0e0;display:flex;justify-content:space-between;align-items:center}
  .admin-form{padding:24px}
  @media (max-width:768px){
    .header-content{flex-direction:column;align-items:stretch}
    .container{padding:16px}
    .form-row{grid-template-columns:1fr}
    .page-header{flex-direction:column;align-items:stretch}
    .toolbar{flex-direction:column;gap:12px}
    .search-box{min-width:auto}
    .event-actions{flex-direction:column}
    .event-actions button{flex:none}
    nav a{display:block;margin:0;border-radius:0}
    .stats-grid{grid-template-columns:repeat(2,1fr)}
    .menu-grid{grid-template-columns:1fr}
  }
  @media (max-width:480px){
    .header-content{padding:12px 16px}
    header h1{font-size:20px}
    .stats-grid{grid-template-columns:1fr}
    .form-actions{flex-direction:column}
    .notification{left:16px;right:16px;max-width:none;transform:translateY(-100px)}
    .notification.show{transform:translateY(0)}
  }
  .fade-in{animation:fadeIn .5s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
  <header>
    <div class="header-content">
      <h1 id="pageTitle">🏃‍♂️ 三鐵活動報名</h1>
      <div id="liffStatus" class="liff-status disconnected">
        <span id="liffStatusIcon">❌</span><span id="liffStatusText">LIFF 未連接</span>
      </div>
      <div id="userInfo" class="user-info" style="display:none;">
        <img id="userAvatar" class="user-avatar" src="" alt="使用者頭像" style="display:none;">
        <div class="user-details">
          <div id="userName" class="user-name">未登入</div>
          <div id="userId" class="user-id"></div>
        </div>
        <button id="authBtn" class="login-btn" onclick="handleAuth()">LINE 登入</button>
      </div>
    </div>
    <nav id="mainNav">
      <a href="#" onclick="showPage('home')" class="nav-active">🏠 活動列表</a>
      <a href="#" onclick="showPage('batch')">📝 批次報名</a>
      <a href="#" onclick="showPage('admin')">⚙️ 管理後台</a>
    </nav>
  </header>
  <div class="container">
    <div id="mainContent"></div>
  </div>
  <div id="modalBackdrop" class="modal-backdrop"><div class="modal" id="modalContent"></div></div>
  <footer><p>© 2025 三鐵活動報名系統 v2.0 - LIFF 整合版 (JSONP 模式)</p></footer>

<script>
// ===================== 基本設定 =====================
const CONFIG = {
  // 若使用 JSONP：填入 GAS /exec URL
  // 若使用 Proxy：填入 Proxy URL (Cloudflare Worker 等) 並把 API_MODE 改 'proxy'
  API_BASE_URL: "https://script.google.com/macros/s/AKfycbx-wE-tLGX-Csx1S-K5Rot6IHDhFYz-j0pGw9_JEGuNkO0hzUOdB86T3PP1mkxOXxpv/exec",
  API_MODE: "jsonp", // jsonp | proxy
  PROXY_BASE_URL: "", // 當 API_MODE = 'proxy' 時使用
  LIFF_ID: "2007905012-o1yDNa92",
  VERSION: "2.1.0-jsonp"
};

let gProfile = { isLoggedIn:false,userId:null,displayName:null,pictureUrl:null,statusMessage:null };
let gSystemInfo = { categories:["登山組","單車組","慢跑組","水上組"], lastRefresh:0 };
let currentPage = 'home';
let allEvents = [];
let filteredEvents = [];
let liffInitialized = false;

// ===================== LIFF =====================
async function initializeLiff() {
  updateLiffStatus('connecting','連接中...');
  try {
    if (typeof liff === 'undefined') throw new Error('LIFF SDK 未載入');
    if (!CONFIG.LIFF_ID) throw new Error('LIFF_ID 未設定');
    await liff.init({ liffId: CONFIG.LIFF_ID, withLoginOnExternalBrowser:true });
    liffInitialized = true;
    if (liff.isLoggedIn()) {
      await loadUserProfile();
      updateLiffStatus('connected','已連接並登入');
    } else {
      updateLiffStatus('connected','已連接但未登入');
      showUserInfo(false);
    }
  } catch(err){
    console.error(err);
    liffInitialized=false;
    updateLiffStatus('error','初始化失敗: '+err.message);
    showUserInfo(false);
  }
}

async function loadUserProfile(){
  try{
    const profile = await liff.getProfile();
    gProfile = {
      isLoggedIn:true,
      userId:profile.userId,
      displayName:profile.displayName,
      pictureUrl:profile.pictureUrl,
      statusMessage:profile.statusMessage||null
    };
    showUserInfo(true);
  }catch(err){
    showNotification('取得使用者資料失敗: '+err.message,'error');
    throw err;
  }
}

function updateLiffStatus(status,msg){
  const e=document.getElementById('liffStatus');
  const i=document.getElementById('liffStatusIcon');
  const t=document.getElementById('liffStatusText');
  if(!e||!i||!t)return;
  switch(status){
    case 'connecting': i.textContent='🔄'; e.className='liff-status connecting'; break;
    case 'connected': i.textContent='✅'; e.className='liff-status connected'; break;
    case 'disconnected': i.textContent='❌'; e.className='liff-status disconnected'; break;
    case 'error': i.textContent='⚠️'; e.className='liff-status error'; break;
  }
  t.textContent=msg;
}

function showUserInfo(isLoggedIn){
  const u=document.getElementById('userInfo'), a=document.getElementById('userAvatar'),
        n=document.getElementById('userName'), id=document.getElementById('userId'),
        btn=document.getElementById('authBtn');
  if(!u)return;
  u.style.display='flex';
  if(isLoggedIn&&gProfile.isLoggedIn){
    u.className='user-info logged-in';
    if(gProfile.pictureUrl){ a.src=gProfile.pictureUrl; a.style.display='block'; } else a.style.display='none';
    n.textContent=gProfile.displayName||'未知使用者';
    id.textContent = gProfile.userId ? 'ID: '+gProfile.userId.substring(0,8)+'...' : '';
    btn.textContent='登出'; btn.className='logout-btn';
  } else {
    u.className='user-info';
    a.style.display='none';
    n.textContent='未登入';
    id.textContent='';
    btn.textContent='LINE 登入'; btn.className='login-btn';
  }
}

async function handleAuth(){
  if(!liffInitialized){ showNotification('LIFF 尚未初始化，重新嘗試','warning'); await initializeLiff(); return;}
  try{
    if(gProfile.isLoggedIn){
      liff.logout();
      gProfile={isLoggedIn:false,userId:null,displayName:null,pictureUrl:null,statusMessage:null};
      showUserInfo(false);
      updateLiffStatus('connected','已連接但未登入');
      showNotification('已登出','info');
    }else{
      if(liff.isInClient()) liff.login(); else liff.login({ redirectUri:window.location.href });
    }
  }catch(err){
    showNotification('操作失敗: '+err.message,'error');
  }
}

function autoFillUserName(input){
  if(!gProfile.isLoggedIn||!gProfile.displayName) return false;
  input.value=gProfile.displayName;
  input.classList.add('auto-filled');
  let ind=input.parentNode.querySelector('.auto-fill-indicator');
  if(!ind){ ind=document.createElement('div'); ind.className='auto-fill-indicator'; ind.textContent='✅ 已從 LINE 自動填入'; input.parentNode.appendChild(ind);}
  ind.style.display='flex';
  return true;
}

// ===================== 通用工具 =====================
function htmlEscape(s){ if(!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function formatDateTime(str){ if(!str)return '-'; try{ const d=new Date(str); return d.toLocaleString('zh-TW',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});}catch{ return str; } }
function truncateText(t,m){ if(!t||t.length<=m) return t; return t.substring(0,m)+'...';}
function debounce(fn,wait){ let tm; return (...a)=>{clearTimeout(tm); tm=setTimeout(()=>fn(...a),wait);} }
function saveToLocalStorage(k,v){ try{ localStorage.setItem('triathlon_'+k,JSON.stringify(v)); }catch(e){} }
function loadFromLocalStorage(k,d=null){ try{ const it=localStorage.getItem('triathlon_'+k);return it?JSON.parse(it):d;}catch(e){ return d; } }

function showNotification(msg,type='info',dur=3000){
  const n=document.createElement('div');
  n.className='notification '+type;
  n.innerHTML=`<span>${htmlEscape(msg)}</span><button onclick="this.parentElement.remove()" style="background:none;border:none;color:inherit;font-size:18px;cursor:pointer;padding:0;margin-left:auto;">✕</button>`;
  document.body.appendChild(n);
  setTimeout(()=>n.classList.add('show'),50);
  setTimeout(()=>{ n.classList.remove('show'); setTimeout(()=>n.remove(),300); },dur);
}
function showMessage(container,msg,type='info'){ container.innerHTML=`<div class="msg ${type}">${htmlEscape(msg)}</div>`; }
function showLoading(container,msg='載入中...'){ container.innerHTML=`<div class="loading-container"><div class="spinner"></div><span>${htmlEscape(msg)}</span></div>`; }
function setButtonLoading(btn,flag){ if(!btn)return; if(flag){btn.classList.add('loading');btn.disabled=true;} else {btn.classList.remove('loading');btn.disabled=false;} }

function openModal(content){
  const b=document.getElementById('modalBackdrop'), m=document.getElementById('modalContent');
  m.innerHTML=content; b.classList.add('show');
  const c=m.querySelector('.close-btn'); if(c) c.onclick=closeModal;
  b.onclick=e=>{ if(e.target===b) closeModal(); };
  const nameInput=m.querySelector('input[name="name"], input[name="userName"]');

// ===================== JSONP / Proxy API 核心 =====================
// 警示：JSONP 會把所有請求轉成 GET，如批次資料過長請改用 Proxy。
function buildQueryString(params){
  const usp=new URLSearchParams();
  Object.keys(params).forEach(k=>{
    let v=params[k];
    if(v===undefined || v===null) return;
    if(typeof v === 'object') v = JSON.stringify(v);
    usp.append(k,v);
  });
  return usp.toString();
}

function jsonpRequest(baseUrl, params, timeoutMs=15000){
  return new Promise((resolve,reject)=>{
    const cbName='jsonp_cb_'+Date.now()+'_'+Math.floor(Math.random()*100000);
    params.callback = cbName;
    const qs = buildQueryString(params);
    const fullUrl = baseUrl + '?' + qs;

    // URL 長度檢查
    if(fullUrl.length > 1900){
      reject(new Error('請求字串過長，請改用 Proxy 模式或縮短輸入內容(目前長度:'+fullUrl.length+')'));
      return;
    }

    const script=document.createElement('script');
    let timeoutId=setTimeout(()=>{
      cleanup();
      reject(new Error('JSONP 請求逾時'));
    },timeoutMs);

    function cleanup(){
      if(window[cbName]) delete window[cbName];
      if(script.parentNode) script.parentNode.removeChild(script);
      if(timeoutId){ clearTimeout(timeoutId); timeoutId=null; }
    }

    window[cbName]=data=>{
      cleanup();
      resolve(data);
    };
    script.onerror=()=>{
      cleanup();
      reject(new Error('JSONP 載入失敗'));
    };
    script.src=fullUrl;
    document.head.appendChild(script);
  });
}

async function proxyFetch(action, params){
  // 以 fetch Form-UrlEncoded 送出 (Proxy 必須補 CORS 標頭)
  const url = CONFIG.PROXY_BASE_URL || CONFIG.API_BASE_URL;
  const form = new URLSearchParams();
  form.append('action', action);
  Object.keys(params||{}).forEach(k=>{
    let v = params[k];
    if(typeof v === 'object') v = JSON.stringify(v);
    form.append(k,v);
  });
  const resp = await fetch(url, {
    method: 'POST',
    headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body: form.toString()
  });
  if(!resp.ok) throw new Error('HTTP '+resp.status);
  return await resp.json();
}

async function apiAction(action, params={}){
  try{
    if(CONFIG.API_MODE === 'jsonp'){
      const data = await jsonpRequest(CONFIG.API_BASE_URL, { action, ...params });
      if(!data || data.success === false){
        throw new Error(data && data.message ? data.message : 'API 回傳失敗');
      }
      return data;
    } else {
      const data = await proxyFetch(action, params);
      if(!data || data.success === false){
        throw new Error(data && data.message ? data.message : 'API 回傳失敗');
      }
      return data;
    }
  }catch(err){
    console.error('API 錯誤:', action, err);
    throw err;
  }
}

const searchEvents = debounce(q=>{
  const term=q.toLowerCase().trim();
  filteredEvents = term? allEvents.filter(e =>
    (e.name&&e.name.toLowerCase().includes(term)) ||
    e.eventId.toLowerCase().includes(term) ||
    e.category.includes(term) ||
    (e.description && e.description.toLowerCase().includes(term))
  ) : [...allEvents];
  renderEventList();
  const countEl=document.querySelector('.event-count');
  if(countEl) countEl.textContent=`顯示 ${filteredEvents.length} / ${allEvents.length} 個活動`;
},300);

function filterByCategory(cat){
  document.querySelectorAll('#categoryFilter .chip').forEach(c=>c.classList.remove('active'));
  const sel = document.querySelector(`#categoryFilter .chip[data-category="${cat||''}"]`);
  if(sel) sel.classList.add('active');

  renderEventList();
  const countEl=document.querySelector('.event-count');
  if(countEl) countEl.textContent=`顯示 ${filteredEvents.length} / ${allEvents.length} 個活動`;
}

async function handleRegisterSubmit(e){
  e.preventDefault();
  const form=e.target;
  const btn=form.querySelector('button[type="submit"]');
  const msgDiv=document.getElementById('registerMsg');
  setButtonLoading(btn,true);
  msgDiv.innerHTML='';
  try{
    const fd=new FormData(form);
    const payload={
      eventId: fd.get('eventId'),
      name: fd.get('name').trim(),
      phone: fd.get('phone').trim(),
      note: fd.get('note').trim(),
      userId: gProfile.userId || 'anonymous',
      source: 'web_liff'
    };
    if(!payload.name) throw new Error('請輸入姓名');
    const result = await apiAction('registerEvent', payload);
    showMessage(msgDiv, `✅ 報名成功！狀態：${result.status==='confirmed'?'正選':'候補'}`,'success');
    setTimeout(()=>{ closeModal(); refreshEvents(); showNotification('報名成功','success'); },1500);
  }catch(err){
    showMessage(msgDiv,'報名失敗：'+err.message,'error');
  }finally{
    setButtonLoading(btn,false);
  }
}

function setupBatchForm(){
  const textarea=document.getElementById('batchNameList');
  const counter=document.getElementById('nameCounter');
  const form=document.getElementById('batchRegisterForm');
  if(textarea){
    textarea.addEventListener('input',function(){
      const names=parseNameList(this.value);
      counter.textContent=names.length+' 人';
      if(names.length){
        showBatchPreview(names);
      }else{
        document.getElementById('batchPreview').style.display='none';
      }
    });
  }
  if(form) form.addEventListener('submit',handleBatchSubmit);
}

function parseNameList(text){
  if(!text.trim()) return [];
  let names = text.includes(',')? text.split(','): text.split('\n');
  names = names.map(n=>n.trim()).filter(n=>n);
  return [...new Set(names)];
}

function showBatchPreview(names){
  const box=document.getElementById('batchPreview');
  const list=document.getElementById('batchPreviewList');
  list.innerHTML = names.map((n,i)=>`<div class="preview-item">${i+1}. ${htmlEscape(n)}</div>`).join('');
  box.style.display='block';
}

async function handleBatchSubmit(e){
  e.preventDefault();
  const form=e.target;
  const btn=document.getElementById('batchSubmitBtn');
  const msgDiv=document.getElementById('batchMsg');
  setButtonLoading(btn,true);
  msgDiv.innerHTML='';
  try{
    const fd=new FormData(form);
    const names=parseNameList(fd.get('nameList'));
    if(!names.length) throw new Error('請輸入至少一個姓名');
    if(CONFIG.API_MODE==='jsonp' && names.join(',').length>1500){
      throw new Error('名單過長，JSONP URL 可能超限，請分批或改用 Proxy 模式');
    }
    const data={
      eventId: fd.get('eventId'),
      names: names,
      contactPhone: fd.get('contactPhone').trim(),
      note: fd.get('batchNote').trim(),
      userId: gProfile.userId || 'anonymous',
      source: 'web_liff_batch'
    };
    const result = await apiAction('batchRegister', data);
    showMessage(msgDiv, `✅ 批次完成！成功：${result.successful||0} 人，候補：${result.waiting||0} 人`,'success');
    setTimeout(()=>{
      resetBatchForm();
      showPage('home');
      showNotification(`批次報名完成，共 ${names.length} 人`,'success');
    },2500);
  }catch(err){
    showMessage(msgDiv,'批次報名失敗：'+err.message,'error');
  }finally{
    setButtonLoading(btn,false);
  }
}

function resetBatchForm(){
  const f=document.getElementById('batchRegisterForm');
  if(f) f.reset();
  document.getElementById('batchFormContainer').style.display='none';
  document.getElementById('batchPreview').style.display='none';
  document.getElementById('nameCounter').textContent='0 人';
  document.getElementById('batchMsg').innerHTML='';
}

async function exportRegistrations(){
  try{
    const result = await apiAction('exportRegistrations',{});
    if(result.success && result.data){
      const blob=new Blob([result.data],{type:'text/csv;charset=utf-8;'});
      const link=document.createElement('a');
      link.href=URL.createObjectURL(blob);
      link.download='registrations_'+new Date().toISOString().split('T')[0]+'.csv';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      showNotification('匯出成功','success');
    }else{
      showNotification('匯出失敗：'+(result.message||'未知'),'error');
    }
  }catch(err){
    showNotification('匯出失敗：'+err.message,'error');
  }
}

  }
}

// ===================== 初始化 =====================
document.addEventListener('DOMContentLoaded', async ()=>{
  try{
    const saved = loadFromLocalStorage('settings');
    if(saved){
      if(saved.liffId && saved.liffId !== CONFIG.LIFF_ID) CONFIG.LIFF_ID = saved.liffId;
      if(saved.apiEndpoint && saved.apiEndpoint !== CONFIG.API_BASE_URL) CONFIG.API_BASE_URL = saved.apiEndpoint;
    }
    await initializeLiff();
    showPage('home');
  }catch(err){
    showNotification('初始化失敗：'+err.message,'error');
    showPage('home');
  }
});

window.addEventListener('error', e=>{
  console.error('全域錯誤:', e.error);
  showNotification('系統發生錯誤','error');
});
window.addEventListener('unhandledrejection', e=>{
  console.error('未處理 Promise:', e.reason);
  showNotification('操作失敗，請稍後再試','error');
});

console.log('🎯 三鐵活動報名系統 v'+CONFIG.VERSION+' 已載入 (模式:'+CONFIG.API_MODE+')');
</script>
</body>
</html>
