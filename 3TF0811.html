
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>多活動報名</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body { font-family:'Microsoft JhengHei', Arial; background:#eef3f7; margin:0; padding:20px;}
  .wrap { max-width:920px; margin:0 auto; background:#fff; padding:34px 38px 70px; border-radius:22px; box-shadow:0 12px 34px rgba(0,0,0,.12);}
  h1 { margin:0 0 10px; font-size:1.9rem; color:#0d47a1; letter-spacing:.05em;}
  .status-bar { padding:12px 16px; background:#e3f2fd; border-left:6px solid #1976d2; border-radius:10px; font-size:.92rem;}
  .row { margin-top:24px;}
  label { font-weight:bold; display:block; margin-bottom:8px; font-size:.95rem;}
  select, input, textarea {
    width:100%; padding:15px 15px; border:2px solid #cfd8dc; border-radius:12px;
    font-size:1rem; background:#fafafa; transition:.25s;
  }
  select:focus, input:focus, textarea:focus { outline:none; border-color:#1976d2; background:#fff; box-shadow:0 0 0 3px rgba(25,118,210,.18);}
  .groups { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:16px; margin-top:10px;}
  .gcard {
    background:#f7f9fa; border:2px solid #d0d7dd; border-radius:14px; padding:18px 14px;
    cursor:pointer; text-align:center; position:relative; min-height:110px; display:flex; flex-direction:column; justify-content:center;
    transition:.3s;
  }
  .gcard.disabled { opacity:.35; cursor:not-allowed; }
  .gcard.active { border-color:#1976d2; background:#1976d2; color:#fff; box-shadow:0 6px 18px rgba(25,118,210,.45);}
  .gcard strong { font-size:1.05rem; }
  .gcard .remain { margin-top:6px; font-size:.78rem; opacity:.85;}
  .gcard .badge { position:absolute; top:8px; right:8px; background:#0d47a1; color:#fff; padding:2px 8px; border-radius:20px; font-size:.65rem;}
  .toggle-batch { margin-top:22px; display:flex; align-items:center; gap:10px; font-size:.92rem;}
  .submit-btn {
    margin-top:46px; width:100%; padding:21px 10px; font-size:1.35rem; font-weight:bold;
    background:linear-gradient(90deg,#1976d2,#26a69a); color:#fff; border:none; border-radius:18px;
    cursor:pointer; letter-spacing:.08em; box-shadow:0 10px 26px rgba(0,0,0,.22); transition:.35s;
  }
  .submit-btn:hover { transform:translateY(-4px); box-shadow:0 16px 34px rgba(0,0,0,.30); }
  .hint { font-size:.75rem; color:#607d8b; margin-top:6px; line-height:1.4; }
  .note { margin-top:34px; background:#fffde7; padding:14px 18px; border-left:6px solid #fbc02d; border-radius:10px; font-size:.82rem; line-height:1.5; }
  .result { margin-top:34px; padding:18px 20px; background:#f1f8e9; border:2px solid #c5e1a5; color:#33691e; border-radius:14px; display:none; white-space:pre-wrap; font-size:.85rem;}
  .danger { color:#d32f2f; font-weight:bold;}
  textarea { min-height:160px; resize:vertical; }
  @media (max-width:760px){
    .wrap { padding:28px 24px 60px; }
    h1 { font-size:1.55rem; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>多活動報名</h1>
    <div id="status" class="status-bar">初始化中...</div>

    <div class="row">
      <label>選擇活動 *</label>
      <select id="eventSelect" onchange="onSelectEvent()">
        <option value="">載入中...</option>
      </select>
      <div class="hint" id="eventInfo"></div>
    </div>

    <div class="row">
      <label>選擇組別 *</label>
      <div class="groups" id="groupWrap"></div>
      <input type="hidden" id="group">
      <div class="hint" id="quotaHint"></div>
    </div>

    <div class="toggle-batch">
      <input type="checkbox" id="batchMode" onchange="toggleBatch()"> 啟用批次報名（每行 1 人）
    </div>

    <div id="singleArea" class="row">
      <label>姓名 *</label>
      <input type="text" id="name" placeholder="輸入姓名">
    </div>

    <div id="batchArea" style="display:none;">
      <div class="row">
        <label>批次姓名清單 *</label>
        <textarea id="namesBatch" placeholder="每行 1 人，不支援 *2 標記&#10;王小明&#10;李小華&#10;張三" oninput="updateQuotaHint()"></textarea>
      </div>
    </div>

    <div class="row">
      <label>備註</label>
      <textarea id="remarks" placeholder="可填寫隊名 / 特殊需求..."></textarea>
    </div>

    <button class="submit-btn" onclick="submitForm()">送出報名</button>

    <div class="note">
      說明：<br>
      1. 每筆報名即 1 人；批次模式下每行一人。<br>
      2. 若該組剩餘不足，整筆（或整批）列為候補。<br>
      3. 名單狀態以後端實際判定為準。<br>
      4. 活動若未顯示，可能未啟用或尚未建立。<br>
    </div>

    <div id="resultBox" class="result"></div>
  </div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
const liffId = "2007905012-o1yDNa92";
const API_BASE = "https://script.google.com/macros/s/AKfycbx1jWQPkh1DrR-q3bgKkII-9GycfHxC6URYMPBvVX90X33vum1zhmH3fykcopYhYbcB/exec";

let events = [];
let currentEvent = null;
let userProfile = null;
const GROUPS = ["登山組","單車組","慢跑組","水上組"];

document.addEventListener("DOMContentLoaded", init);

async function init(){
  updateStatus("初始化 LIFF...");
  try{
    await liff.init({liffId});
    if(!liff.isLoggedIn()){ liff.login(); return; }
    userProfile = await liff.getProfile();
    updateStatus("歡迎，" + userProfile.displayName);
  }catch(e){
    updateStatus("LIFF 初始化失敗：" + e.message, true);
  }
  await loadEvents();
  renderGroups(); // 初次渲染空框
}

function updateStatus(msg, err=false){
  const s = document.getElementById('status');
  s.textContent = msg;
  s.style.background = err ? "#ffebee" : "#e3f2fd";
  s.style.borderLeftColor = err ? "#c62828" : "#1976d2";
}

async function loadEvents(){
  try{
    const res = await fetch(API_BASE + "?action=getEvents");
    const data = await res.json();
    events = data.events || [];
    const sel = document.getElementById('eventSelect');
    sel.innerHTML = '<option value="">請選擇活動</option>';
    events.forEach(ev=>{
      const opt = document.createElement('option');
      opt.value = ev.eventId;
      opt.textContent = `${ev.name} ${ev.date? '('+ev.date+')':''}`;
      sel.appendChild(opt);
    });
    if(events.length===0){
      updateStatus("尚無啟用活動");
    }
  }catch(e){
    updateStatus("載入活動失敗：" + e.message, true);
  }
}

function onSelectEvent(){
  const id = document.getElementById('eventSelect').value;
  currentEvent = events.find(e=>e.eventId===id);
  const info = document.getElementById('eventInfo');
  if(!currentEvent){
    info.textContent = "";
  }else{
    info.textContent = (currentEvent.description || "") + 
      (currentEvent.location ? " 地點："+currentEvent.location : "");
  }
  renderGroups();
  document.getElementById('group').value = "";
  document.getElementById('quotaHint').textContent = "";
}

function renderGroups(){
  const wrap = document.getElementById('groupWrap');
  wrap.innerHTML = "";
  GROUPS.forEach(g=>{
    const div = document.createElement('div');
    div.className = 'gcard';
    div.dataset.group = g;
    let remain = currentEvent ? currentEvent.remain[g] : "-";
    let cap = currentEvent ? currentEvent.capacity[g] : "-";
    if(currentEvent && (parseInt(cap)||0) <=0){
      div.classList.add('disabled');
      div.innerHTML = `<strong>${g}</strong><div class="badge">未開放</div>`;
    }else{
      div.innerHTML = `<strong>${g}</strong><div class="remain">剩餘：${remain}</div>`;
      div.onclick = ()=> selectGroup(g, div);
    }
    wrap.appendChild(div);
  });
}

function selectGroup(g, el){
  if(el.classList.contains('disabled')) return;
  document.querySelectorAll('.gcard').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('group').value = g;
  updateQuotaHint();
}

function toggleBatch(){
  const batch = document.getElementById('batchMode').checked;
  document.getElementById('singleArea').style.display = batch ? 'none':'block';
  document.getElementById('batchArea').style.display = batch ? 'block':'none';
  updateQuotaHint();
}

function updateQuotaHint(){
  const g = document.getElementById('group').value;
  const hint = document.getElementById('quotaHint');
  if(!g || !currentEvent){ hint.textContent = ""; return; }
  const remain = currentEvent.remain[g];
  const batch = document.getElementById('batchMode').checked;
  let count = 1;
  if(batch){
    const lines = document.getElementById('namesBatch').value
      .split(/\r?\n/).map(s=>s.trim()).filter(s=>s).length;
    count = lines || 1;
  }
  hint.textContent = remain >= count
    ? `預估 正選（剩餘 ${remain}，需求 ${count}）`
    : `預估 候補（剩餘 ${remain}，需求 ${count}）`;
}

async function submitForm(){
  const eventId = document.getElementById('eventSelect').value;
  const group = document.getElementById('group').value;
  if(!eventId){ return alert("請選擇活動"); }
  if(!group){ return alert("請選擇組別"); }
  const batch = document.getElementById('batchMode').checked;

  let payload;
  if(batch){
    const namesText = document.getElementById('namesBatch').value.trim();
    if(!namesText) return alert("請輸入批次姓名");
    payload = {
      action:"batchRegister",
      eventId,
      group,
      namesText,
      remarks: document.getElementById('remarks').value.trim(),
      source:"liff_form",
      liffUserId:userProfile?.userId || "",
      liffDisplayName:userProfile?.displayName || "",
      sendMethod:"line_send"
    };
  }else{
    const name = document.getElementById('name').value.trim();
    if(!name) return alert("請輸入姓名");
    payload = {
      action:"singleRegister",
      eventId,
      group,
      name,
      remarks: document.getElementById('remarks').value.trim(),
      source:"liff_form",
      liffUserId:userProfile?.userId || "",
      liffDisplayName:userProfile?.displayName || "",
      sendMethod:"line_send"
    };
  }

  updateStatus("送出中...");
  try{
    const res = await fetch(API_BASE,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload)
    });
    const data = await res.json();
    if(!data.success){
      updateStatus("失敗："+data.message, true);
      return;
    }
    showResult(data);
    updateStatus("完成");
    if(liff.isInClient()){
      try{
        await liff.sendMessages([{
          type:'text',
          text: batch
            ? `✅ 批次報名完成\n活動:${data.eventName}\n狀態:${data.status}\n筆數:${data.totalEntries}`
            : `✅ 報名完成\n活動:${data.eventName}\n姓名:${payload.name}\n狀態:${data.status}`
        }]);
      }catch(e){}
    }
    // 重新讀取活動剩餘
    await loadEvents();
    currentEvent = events.find(e=>e.eventId===eventId);
    renderGroups();
  }catch(e){
    updateStatus("錯誤："+e.message, true);
  }
}

function showResult(data){
  const box = document.getElementById('resultBox');
  box.style.display = 'block';
  box.textContent = JSON.stringify(data, null, 2);
}
</script>
</body>
</html>
