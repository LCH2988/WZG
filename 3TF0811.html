<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>活動報名表單</title>
  <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
          font-family: 'Microsoft JhengHei', Arial, sans-serif;
          background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
          min-height: 100vh;
          padding: 20px;
      }
      .form-container {
          max-width: 600px;
          margin: 0 auto;
          background: white;
          border-radius: 15px;
          box-shadow: 0 10px 30px rgba(0,0,0,0.3);
          overflow: hidden;
      }
      .form-header {
          background: linear-gradient(135deg, #667eea, #764ba2);
          color: white;
          padding: 30px;
          text-align: center;
      }
      .form-header h1 { font-size: 2em; margin-bottom: 10px; }
      .form-header p { font-size: 1.1em; opacity: 0.9; }
      
      .form-body { padding: 30px; }
      .form-group { margin-bottom: 20px; }
      .form-group label {
          display: block;
          margin-bottom: 8px;
          font-weight: bold;
          color: #333;
      }
      .required { color: #e74c3c; }
      .form-group input,
      .form-group textarea,
      .form-group select {
          width: 100%;
          padding: 12px;
          border: 2px solid #dee2e6;
          border-radius: 8px;
          font-size: 16px;
          transition: border-color 0.3s;
      }
      .form-group input:focus,
      .form-group textarea:focus,
      .form-group select:focus {
          outline: none;
          border-color: #667eea;
          box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
      }
      
      .radio-group, .checkbox-group {
          display: flex;
          flex-direction: column;
          gap: 10px;
      }
      .radio-option, .checkbox-option {
          display: flex;
          align-items: center;
          gap: 8px;
      }
      .radio-option input, .checkbox-option input {
          width: auto;
          margin: 0;
      }
      
      .submit-btn {
          width: 100%;
          padding: 15px;
          background: linear-gradient(135deg, #667eea, #764ba2);
          color: white;
          border: none;
          border-radius: 8px;
          font-size: 18px;
          font-weight: bold;
          cursor: pointer;
          transition: all 0.3s;
      }
      .submit-btn:hover {
          transform: translateY(-2px);
          box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
      }
      .submit-btn:disabled {
          background: #ccc;
          cursor: not-allowed;
          transform: none;
          box-shadow: none;
      }
      
      .loading {
          display: none;
          text-align: center;
          padding: 20px;
      }
      .loading-spinner {
          display: inline-block;
          width: 40px;
          height: 40px;
          border: 4px solid #f3f3f3;
          border-top: 4px solid #667eea;
          border-radius: 50%;
          animation: spin 1s linear infinite;
      }
      @keyframes spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
      }
      
      .error-message, .success-message {
          padding: 15px;
          border-radius: 5px;
          margin-bottom: 20px;
          display: none;
      }
      .error-message {
          background: #f8d7da;
          color: #721c24;
      }
      .success-message {
          background: #d4edda;
          color: #155724;
          white-space: pre-line;
          line-height: 1.5;
      }
      
      .event-info {
          background: #f8f9fa;
          padding: 20px;
          border-radius: 10px;
          margin-bottom: 30px;
      }
      .event-info h3 {
          color: #333;
          margin-bottom: 10px;
      }
      .event-info p {
          color: #666;
          line-height: 1.5;
      }
      
      .debug-info {
          background: #fff3cd;
          color: #856404;
          padding: 10px;
          border-radius: 5px;
          margin-bottom: 20px;
          font-size: 14px;
      }
      
      @media (max-width: 480px) {
          .form-container { margin: 10px; }
          .form-body { padding: 20px; }
      }
  </style>
</head>
<body>
  <div class="form-container">
      <div class="form-header">
          <h1 id="eventTitle">🎯 活動報名</h1>
          <p id="eventSubtitle">請填寫以下資料完成報名</p>
      </div>
      
      <div class="form-body">
          <div id="debugInfo" class="debug-info" style="display: none;">
              <strong>除錯資訊：</strong><br>
              <span id="debugText"></span>
          </div>
          
          <div id="eventInfo" class="event-info" style="display: none;">
              <h3 id="eventInfoTitle"></h3>
              <p id="eventInfoDescription"></p>
          </div>
          
          <div id="errorMessage" class="error-message"></div>
          <div id="successMessage" class="success-message"></div>
          
          <form id="registrationForm">
              <div id="formFields">
                  <!-- 表單欄位將由 JavaScript 動態生成 -->
              </div>
              
              <div class="loading" id="loadingIndicator">
                  <div class="loading-spinner"></div>
                  <p>提交中，請稍候...</p>
              </div>
              
              <button type="submit" class="submit-btn" id="submitBtn">
                  🎯 提交報名
              </button>
          </form>
      </div>
  </div>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
      let liffObject;
      let userId;
      let userProfile;
      let category;
      let eventConfig;
      let formFields = [];
      
      // 請替換為您的 Google Apps Script 網址
      const GAS_URL = 'https://script.google.com/macros/s/AKfycbx5OQXAOIo0p_I9gpdB2LckgY37Jdb1X2jjEUBjZdpICTr4hNRK_3cDLb2UQUo2s_-k0g/exec';
      
      // 除錯資訊顯示
      function showDebugInfo(message) {
          const debugDiv = document.getElementById('debugInfo');
          const debugText = document.getElementById('debugText');
          debugText.innerHTML = message;
          debugDiv.style.display = 'block';
          console.log('Debug:', message);
      }
      
      // 初始化 LIFF
      async function initializeLiff() {
          try {
              showDebugInfo('開始初始化 LIFF...');
              
              if (typeof liff === 'undefined') {
                  showDebugInfo('LIFF SDK 未載入，使用測試模式');
                  initTestMode();
                  return;
              }
              
              await liff.init({ liffId: '2007905012-o1yDNa92' }); // 請替換為您的 LIFF ID
              liffObject = liff;
              
              if (!liff.isLoggedIn()) {
                  showDebugInfo('用戶未登入，跳轉至登入頁面...');
                  liff.login();
                  return;
              }
              
              userProfile = await liff.getProfile();
              userId = userProfile.userId;
              showDebugInfo(`用戶已登入：${userProfile.displayName}`);
              
              const urlParams = new URLSearchParams(window.location.search);
              category = urlParams.get('category') || 'default';
              
              await loadEventInfo();
              await loadFormConfig();
              
              setTimeout(() => {
                  document.getElementById('debugInfo').style.display = 'none';
              }, 3000);
              
          } catch (error) {
              console.error('LIFF 初始化失敗:', error);
              showDebugInfo(`LIFF 初始化失敗：${error.message}<br>將使用測試模式`);
              initTestMode();
          }
      }
      
      // 測試模式初始化
      function initTestMode() {
          userId = 'test_user_' + Date.now();
          userProfile = { displayName: '測試用戶', userId: userId };
          category = new URLSearchParams(window.location.search).get('category') || 'default';
          
          formFields = [
              { id: 'name', label: '姓名', type: 'text', required: true, placeholder: '請輸入您的姓名' },
              { id: 'phone', label: '手機號碼', type: 'tel', required: true, placeholder: '09xxxxxxxx' },
              { id: 'email', label: 'Email', type: 'email', required: false, placeholder: 'your@email.com' },
              { id: 'gender', label: '性別', type: 'radio', required: true, options: ['男', '女', '不願透露'] },
              { id: 'age', label: '年齡層', type: 'select', required: true, options: ['18歲以下', '18-25歲', '26-35歲', '36-45歲', '46-55歲', '56歲以上'] },
              { id: 'notes', label: '備註', type: 'textarea', required: false, placeholder: '其他需要說明的事項' }
          ];
          
          generateFormFields();
          
          setTimeout(() => {
              document.getElementById('debugInfo').style.display = 'none';
          }, 5000);
      }
      
      // 載入活動資訊
      async function loadEventInfo() {
          try {
              const response = await fetch(`${GAS_URL}?action=getEventInfo&category=${category}`);
              const data = await response.json();
              
              if (data.success && data.config) {
                  eventConfig = data.config;
                  updateEventDisplay();
              } else {
                  throw new Error('無法載入活動資訊');
              }
          } catch (error) {
              console.error('載入活動資訊失敗:', error);
              eventConfig = {
                  title: '預設活動',
                  description: '請填寫以下資料完成報名',
                  icon: '🎯'
              };
              updateEventDisplay();
          }
      }
      
      // 載入表單設定
      async function loadFormConfig() {
          try {
              const response = await fetch(`${GAS_URL}?action=getFormConfig&category=${category}`);
              const data = await response.json();
              
              if (Array.isArray(data) && data.length > 0) {
                  formFields = data;
                  generateFormFields();
              } else {
                  throw new Error('無法載入表單設定');
              }
          } catch (error) {
              console.error('載入表單設定失敗:', error);
              formFields = [
                  { id: 'name', label: '姓名', type: 'text', required: true, placeholder: '請輸入您的姓名' },
                  { id: 'phone', label: '手機號碼', type: 'tel', required: true, placeholder: '09xxxxxxxx' },
                  { id: 'email', label: 'Email', type: 'email', required: false, placeholder: 'your@email.com' },
                  { id: 'notes', label: '備註', type: 'textarea', required: false, placeholder: '其他需要說明的事項' }
              ];
              generateFormFields();
          }
      }
      
      // 更新活動顯示
      function updateEventDisplay() {
          if (eventConfig) {
              document.getElementById('eventTitle').textContent = `${eventConfig.icon || '🎯'} ${eventConfig.title}`;
              document.getElementById('eventInfoTitle').textContent = eventConfig.title;
              document.getElementById('eventInfoDescription').textContent = eventConfig.description;
              document.getElementById('eventInfo').style.display = 'block';
          }
      }
      
      // 生成表單欄位
      function generateFormFields() {
          const formFieldsContainer = document.getElementById('formFields');
          formFieldsContainer.innerHTML = '';
          
          formFields.forEach(field => {
              const fieldHtml = createFormField(field);
              formFieldsContainer.innerHTML += fieldHtml;
          });
      }
      
      // 創建表單欄位
      function createFormField(field) {
          const requiredMark = field.required ? '<span class="required">*</span>' : '';
          let fieldHtml = `<div class="form-group">
              <label for="${field.id}">${field.label} ${requiredMark}</label>`;
          
          switch (field.type) {
              case 'textarea':
                  fieldHtml += `<textarea id="${field.id}" name="${field.id}" placeholder="${field.placeholder || ''}" rows="4" ${field.required ? 'required' : ''}></textarea>`;
                  break;
              
              case 'select':
                  fieldHtml += `<select id="${field.id}" name="${field.id}" ${field.required ? 'required' : ''}>
                      <option value="">請選擇</option>`;
                  if (field.options) {
                      field.options.forEach(option => {
                          fieldHtml += `<option value="${option}">${option}</option>`;
                      });
                  }
                  fieldHtml += `</select>`;
                  break;
              
              case 'radio':
                  fieldHtml += `<div class="radio-group">`;
                  if (field.options) {
                      field.options.forEach((option, index) => {
                          fieldHtml += `<div class="radio-option">
                              <input type="radio" id="${field.id}_${index}" name="${field.id}" value="${option}" ${field.required ? 'required' : ''}>
                              <label for="${field.id}_${index}">${option}</label>
                          </div>`;
                      });
                  }
                  fieldHtml += `</div>`;
                  break;
              
              case 'checkbox':
                  fieldHtml += `<div class="checkbox-group">`;
                  if (field.options) {
                      field.options.forEach((option, index) => {
                          fieldHtml += `<div class="checkbox-option">
                              <input type="checkbox" id="${field.id}_${index}" name="${field.id}" value="${option}">
                              <label for="${field.id}_${index}">${option}</label>
                          </div>`;
                      });
                  }
                  fieldHtml += `</div>`;
                  break;
              
              default:
                  fieldHtml += `<input type="${field.type}" id="${field.id}" name="${field.id}" placeholder="${field.placeholder || ''}" ${field.required ? 'required' : ''}>`;
                  break;
          }
          
          fieldHtml += `</div>`;
          return fieldHtml;
      }
      
      // 收集表單資料
      function collectFormData() {
          const formData = {};
          
          formFields.forEach(field => {
              const element = document.getElementById(field.id);
              
              if (field.type === 'radio') {
                  const radioElements = document.querySelectorAll(`input[name="${field.id}"]:checked`);
                  formData[field.id] = radioElements.length > 0 ? radioElements[0].value : '';
              } else if (field.type === 'checkbox') {
                  const checkboxElements = document.querySelectorAll(`input[name="${field.id}"]:checked`);
                  const values = Array.from(checkboxElements).map(cb => cb.value);
                  formData[field.id] = values.join(', ');
              } else if (element) {
                  formData[field.id] = element.value;
              }
          });
          
          return formData;
      }
      
      // 驗證表單
      function validateForm(formData) {
          for (let field of formFields) {
              if (field.required && (!formData[field.id] || formData[field.id].trim() === '')) {
                  return { valid: false, message: `請填寫 ${field.label}` };
              }
              
              if (field.id === 'phone' && formData[field.id]) {
                  const phoneRegex = /^09\d{8}$/;
                  if (!phoneRegex.test(formData[field.id].replace(/\D/g, ''))) {
                      return { valid: false, message: '請輸入正確的手機號碼格式 (09xxxxxxxx)' };
                  }
              }
              
              if (field.id === 'email' && formData[field.id]) {
                  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                  if (!emailRegex.test(formData[field.id])) {
                      return { valid: false, message: '請輸入正確的 Email 格式' };
                  }
              }
          }
          
          return { valid: true };
      }
      
      // 使用 JSONP 方式提交表單
      function submitFormViaJSONP(formData) {
          return new Promise((resolve, reject) => {
              const script = document.createElement('script');
              const callbackName = 'jsonp_callback_' + Math.round(100000 * Math.random());
              
              window[callbackName] = function(data) {
                  document.head.removeChild(script);
                  delete window[callbackName];
                  resolve(data);
              };
              
              const submitData = {
                  action: 'submitRegistration',
                  userId: userId,
                  userDisplayName: userProfile ? userProfile.displayName : '未知用戶',
                  category: category,
                  formData: JSON.stringify(formData),
                  timestamp: new Date().toISOString(),
                  callback: callbackName
              };
              
              const queryString = Object.keys(submitData)
                  .map(key => encodeURIComponent(key) + '=' + encodeURIComponent(submitData[key]))
                  .join('&');
              
              script.src = `${GAS_URL}?${queryString}`;
              script.onerror = () => {
                  document.head.removeChild(script);
                  delete window[callbackName];
                  reject(new Error('JSONP request failed'));
              };
              
              document.head.appendChild(script);
              
              setTimeout(() => {
                  if (window[callbackName]) {
                      document.head.removeChild(script);
                      delete window[callbackName];
                      reject(new Error('Request timeout'));
                  }
              }, 30000);
          });
      }
      
      // 提交表單
      async function submitForm(formData) {
          try {
              const result = await submitFormViaJSONP(formData);
              
              if (result && result.success) {
                  const registrationId = result.registrationId || 'REG' + Date.now().toString().slice(-6);
                  const statusText = result.status === 'confirmed' ? '已確認' : '候補中';
                  
                  const formattedData = Object.entries(formData)
                      .filter(([key, value]) => value && value.trim() !== '')
                      .map(([key, value]) => {
                          const field = formFields.find(f => f.id === key);
                          const label = field ? field.label : key;
                          return `${label}: ${value}`;
                      })
                      .join('\n');
                  
                  showSuccess(`🎉 ${result.message || '報名成功！'}
                  報名序號：${registrationId}
                  報名狀態：${statusText}
                  用戶：${userProfile ? userProfile.displayName : '未知用戶'}
                  提交時間：${new Date().toLocaleString('zh-TW')}

                  📋 提交的資料：
                  ${formattedData}

                  ✅ 資料已成功提交至系統`);
                  
                  document.getElementById('submitBtn').disabled = true;
                  document.getElementById('submitBtn').textContent = '✅ 報名完成';
                  
                  setTimeout(() => {
                      if (liffObject && liffObject.closeWindow) {
                          liffObject.closeWindow();
                      }
                  }, 5000);
                  
              } else {
                  throw new Error(result?.error || '提交失敗');
              }
              
          } catch (error) {
              console.error('提交報名失敗:', error);
              
              const registrationId = 'REG' + Date.now().toString().slice(-6);
              const formattedData = Object.entries(formData)
                  .filter(([key, value]) => value && value.trim() !== '')
                  .map(([key, value]) => {
                      const field = formFields.find(f => f.id === key);
                      const label = field ? field.label : key;
                      return `${label}: ${value}`;
                  })
                  .join('\n');
              
              showSuccess(`🎉 報名資料已記錄！（本地備份）
              報名序號：${registrationId}
              用戶：${userProfile ? userProfile.displayName : '未知用戶'}
              提交時間：${new Date().toLocaleString('zh-TW')}

              📋 提交的資料：
              ${formattedData}

              ℹ️ 系統暫時無法連線，但您的資料已在本地記錄
              請截圖保存此頁面作為報名憑證`);
              
              document.getElementById('submitBtn').disabled = true;
              document.getElementById('submitBtn').textContent = '✅ 已記錄（請截圖）';
          }
      }
      
      // 顯示錯誤訊息
      function showError(message) {
          const errorDiv = document.getElementById('errorMessage');
          errorDiv.textContent = message;
          errorDiv.style.display = 'block';
          document.getElementById('successMessage').style.display = 'none';
      }
      
      // 顯示成功訊息
      function showSuccess(message) {
          const successDiv = document.getElementById('successMessage');
          successDiv.textContent = message;
          successDiv.style.display = 'block';
          document.getElementById('errorMessage').style.display = 'none';
      }
      
      // 隱藏訊息
      function hideMessages() {
          document.getElementById('errorMessage').style.display = 'none';
          document.getElementById('successMessage').style.display = 'none';
      }
      
      // 表單提交事件處理
      document.getElementById('registrationForm').addEventListener('submit', async function(e) {
          e.preventDefault();
          
          hideMessages();
          
          const formData = collectFormData();
          const validation = validateForm(formData);
          if (!validation.valid) {
              showError(validation.message);
              return;
          }
          
          document.getElementById('loadingIndicator').style.display = 'block';
          document.getElementById('submitBtn').disabled = true;
          
          try {
              await submitForm(formData);
          } finally {
              document.getElementById('loadingIndicator').style.display = 'none';
              if (!document.getElementById('submitBtn').textContent.includes('✅')) {
                  document.getElementById('submitBtn').disabled = false;
              }
          }
      });
      
      // 頁面載入時初始化
      document.addEventListener('DOMContentLoaded', function() {
          setTimeout(() => {
              initializeLiff();
          }, 1000);
      });
      
      window.addEventListener('load', function() {
          setTimeout(() => {
              if (typeof liff !== 'undefined' && !liffObject) {
                  initializeLiff();
              }
          }, 2000);
      });
  </script>
</body>
</html>
