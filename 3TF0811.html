<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三鐵活動報名系統</title>
<meta name="description" content="三鐵活動多分類報名系統 - 登山組、單車組、慢跑組、水上組">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏃‍♂️</text></svg>">

<style>
  /* ====== CSS 樣式 ====== */
  :root {
    --primary-color: #1565c0;
    --secondary-color: #42a5f5;
    --success-color: #4caf50;
    --warning-color: #ff9800;
    --error-color: #f44336;
    --info-color: #2196f3;
    --text-color: #333;
    --bg-color: #f5f7fa;
    --card-shadow: 0 2px 8px rgba(0,0,0,0.1);
    --border-radius: 8px;
    --transition: all 0.3s ease;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg-color);
    color: var(--text-color);
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ====== 頁面佈局 ====== */
  header {
    background: #fff;
    box-shadow: var(--card-shadow);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-content {
    max-width: 1200px;
    margin: 0 auto;
    padding: 16px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  header h1 {
    font-size: 24px;
    font-weight: 600;
    color: var(--primary-color);
  }

  nav {
    background: var(--primary-color);
    padding: 0 20px;
  }

  nav a {
    display: inline-block;
    padding: 12px 20px;
    color: #fff;
    text-decoration: none;
    transition: var(--transition);
    border-radius: 4px 4px 0 0;
    margin-right: 4px;
  }

  nav a:hover, nav a.nav-active {
    background: rgba(255,255,255,0.2);
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
    flex: 1;
  }

  footer {
    background: #333;
    color: #fff;
    text-align: center;
    padding: 20px;
    margin-top: auto;
  }

  /* ====== 通用元件 ====== */
  .btn, button {
    background: var(--primary-color);
    color: #fff;
    border: none;
    padding: 12px 24px;
    border-radius: var(--border-radius);
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    transition: var(--transition);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-width: 100px;
  }

  .btn:hover, button:hover {
    background: #0d47a1;
    transform: translateY(-1px);
  }

  .btn.secondary, button.secondary {
    background: #6c757d;
  }

  .btn.success, button.success {
    background: var(--success-color);
  }

  .btn.warning, button.warning {
    background: var(--warning-color);
  }

  .btn.danger, button.danger {
    background: var(--error-color);
  }

  .btn:disabled, button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }

  .btn.loading, button.loading {
    position: relative;
    color: transparent;
  }

  .btn.loading::after, button.loading::after {
    content: "";
    position: absolute;
    width: 16px;
    height: 16px;
    border: 2px solid #fff;
    border-top: 2px solid transparent;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }

  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  /* ====== 表單元件 ====== */
  .form-group {
    margin-bottom: 20px;
  }

  .form-row {
    display: grid;
    gap: 16px;
    grid-template-columns: 1fr 1fr;
  }

  label {
    display: block;
    margin-bottom: 6px;
    font-weight: 500;
    color: #333;
  }

  input, select, textarea {
    width: 100%;
    padding: 12px;
    border: 2px solid #e0e0e0;
    border-radius: var(--border-radius);
    font-size: 14px;
    transition: var(--transition);
    font-family: inherit;
  }

  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--primary-color);
    box-shadow: 0 0 0 3px rgba(21, 101, 192, 0.1);
  }

  small {
    display: block;
    margin-top: 4px;
    font-size: 12px;
    color: #666;
  }

  .form-actions {
    display: flex;
    gap: 12px;
    margin-top: 24px;
    flex-wrap: wrap;
  }

  /* ====== 卡片組件 ====== */
  .card {
    background: #fff;
    border-radius: var(--border-radius);
    box-shadow: var(--card-shadow);
    padding: 20px;
    transition: var(--transition);
    border: 1px solid #e0e0e0;
  }

  .card:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  }

  .grid {
    display: grid;
    gap: 20px;
  }

  .cols-3 {
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  }

  /* ====== 徽章和狀態 ====== */
  .badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 16px;
    font-size: 12px;
    font-weight: 500;
    text-align: center;
  }

  .badge.登山組 {
    background: #e8f5e8;
    color: #2e7d32;
  }

  .badge.單車組 {
    background: #e3f2fd;
    color: #1565c0;
  }

  .badge.慢跑組 {
    background: #fff3e0;
    color: #ef6c00;
  }

  .badge.水上組 {
    background: #e0f2f1;
    color: #00695c;
  }

  .status-indicator {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 6px;
  }

  .status-indicator.active {
    background: var(--success-color);
  }

  .status-indicator.inactive {
    background: var(--error-color);
  }

  /* ====== 篩選器 ====== */
  .filter-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .chip {
    padding: 8px 16px;
    background: #fff;
    border: 2px solid #e0e0e0;
    border-radius: 20px;
    cursor: pointer;
    transition: var(--transition);
    font-size: 14px;
    font-weight: 500;
    white-space: nowrap;
  }

  .chip:hover, .chip.active {
    background: var(--primary-color);
    color: #fff;
    border-color: var(--primary-color);
  }

  /* ====== 訊息提示 ====== */
  .msg {
    padding: 12px 16px;
    border-radius: var(--border-radius);
    margin: 16px 0;
    border-left: 4px solid;
  }

  .msg.success {
    background: #e8f5e8;
    color: #2e7d32;
    border-color: var(--success-color);
  }

  .msg.error {
    background: #ffebee;
    color: #c62828;
    border-color: var(--error-color);
  }

  .msg.warning {
    background: #fff3e0;
    color: #ef6c00;
    border-color: var(--warning-color);
  }

  .msg.info {
    background: #e3f2fd;
    color: #1565c0;
    border-color: var(--info-color);
  }

  /* ====== 通知系統 ====== */
  .notification {
    position: fixed;
    top: 20px;
    right: 20px;
    padding: 16px 20px;
    border-radius: var(--border-radius);
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    z-index: 1000;
    transform: translateX(400px);
    transition: var(--transition);
    max-width: 350px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .notification.show {
    transform: translateX(0);
  }

  .notification.success {
    background: var(--success-color);
    color: #fff;
  }

  .notification.error {
    background: var(--error-color);
    color: #fff;
  }

  .notification.warning {
    background: var(--warning-color);
    color: #fff;
  }

  .notification.info {
    background: var(--info-color);
    color: #fff;
  }

  /* ====== 模態框 ====== */
  .modal-backdrop {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.5);
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .modal-backdrop.show {
    display: flex;
  }

  .modal {
    background: #fff;
    border-radius: var(--border-radius);
    max-width: 600px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    position: relative;
    animation: modalSlideIn 0.3s ease;
  }

  @keyframes modalSlideIn {
    from {
      opacity: 0;
      transform: scale(0.9) translateY(-20px);
    }
    to {
      opacity: 1;
      transform: scale(1) translateY(0);
    }
  }

  .modal h2 {
    background: var(--primary-color);
    color: #fff;
    padding: 20px;
    margin: 0;
    border-radius: var(--border-radius) var(--border-radius) 0 0;
  }

  .modal-content {
    padding: 20px;
  }

  .close-btn {
    position: absolute;
    top: 15px;
    right: 20px;
    background: none;
    border: none;
    color: #fff;
    font-size: 24px;
    cursor: pointer;
    padding: 0;
    min-width: auto;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .close-btn:hover {
    background: rgba(255,255,255,0.2);
  }

  /* ====== 載入狀態 ====== */
  .loading-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px;
    color: #666;
  }

  .spinner {
    width: 40px;
    height: 40px;
    border: 4px solid #e0e0e0;
    border-top: 4px solid var(--primary-color);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-bottom: 16px;
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: #666;
  }

  .empty-state p {
    margin-bottom: 8px;
  }

  .empty-state .small {
    font-size: 14px;
    color: #999;
  }

  /* ====== 活動卡片特定樣式 ====== */
  .event-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 16px;
  }

  .event-title h3 {
    margin: 0 0 8px 0;
    color: #333;
    font-size: 18px;
    line-height: 1.3;
  }

  .event-meta {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }

  .event-id {
    font-family: 'Courier New', monospace;
    font-size: 12px;
    color: #666;
    background: #f0f0f0;
    padding: 2px 6px;
    border-radius: 4px;
  }

  .quota-info {
    margin: 16px 0;
  }

  .quota-bar {
    background: #e0e0e0;
    height: 8px;
    border-radius: 4px;
    overflow: hidden;
    margin: 8px 0;
  }

  .quota-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--success-color), var(--warning-color));
    transition: width 0.3s ease;
  }

  .quota-text {
    font-size: 14px;
    color: #666;
    display: flex;
    justify-content: space-between;
  }

  .remain {
    font-weight: 600;
  }

  .remain.ok {
    color: var(--success-color);
  }

  .remain.low {
    color: var(--warning-color);
  }

  .remain.full {
    color: var(--error-color);
  }

  .event-actions {
    display: flex;
    gap: 8px;
    margin-top: 16px;
    flex-wrap: wrap;
  }

  .event-actions button {
    flex: 1;
    min-width: 100px;
    font-size: 13px;
    padding: 10px 16px;
  }

  /* ====== 頁面特定樣式 ====== */
  .page-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 16px;
  }

  .title-section h2 {
    margin: 0;
    color: #333;
    font-size: 24px;
  }

  .event-count {
    font-size: 14px;
    color: #666;
    margin-top: 4px;
  }

  .toolbar {
    display: flex;
    gap: 12px;
    align-items: center;
  }

  .search-box {
    position: relative;
    min-width: 250px;
  }

  .search-box input {
    width: 100%;
    padding: 10px 16px;
    border: 2px solid #e0e0e0;
    border-radius: 25px;
    font-size: 14px;
  }

  .refresh-btn {
    white-space: nowrap;
    min-width: 120px;
  }

  /* ====== 批次報名樣式 ====== */
  .batch-info {
    background: #f8f9fa;
    padding: 16px;
    border-radius: var(--border-radius);
    margin-bottom: 20px;
  }

  .info-grid {
    display: grid;
    gap: 8px;
    margin-bottom: 16px;
  }

  .batch-tips {
    border-top: 1px solid #e0e0e0;
    padding-top: 12px;
  }

  .batch-tips ul {
    margin: 8px 0 0 20px;
    font-size: 14px;
    color: #555;
  }

  .counter {
    font-size: 12px;
    color: #666;
    float: right;
  }

  .batch-preview {
    background: #f8f9fa;
    padding: 16px;
    border-radius: var(--border-radius);
    margin: 16px 0;
  }

  .preview-list {
    max-height: 200px;
    overflow-y: auto;
    display: grid;
    gap: 4px;
  }

  .preview-item {
    padding: 4px 8px;
    background: #fff;
    border-radius: 4px;
    font-size: 14px;
  }

  /* ====== 統計樣式 ====== */
  .stats-grid {
    display: grid;
    gap: 16px;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    margin: 20px 0;
  }

  .stat-card {
    background: #f8f9fa;
    padding: 20px;
    border-radius: var(--border-radius);
    text-align: center;
    border-left: 4px solid var(--info-color);
  }

  .stat-card.success {
    border-color: var(--success-color);
  }

  .stat-card.warning {
    border-color: var(--warning-color);
  }

  .stat-card.error {
    border-color: var(--error-color);
  }

  .stat-number {
    font-size: 32px;
    font-weight: 700;
    color: #333;
    margin-bottom: 4px;
  }

  .stat-label {
    font-size: 14px;
    color: #666;
  }

  .usage-bar {
    background: #e0e0e0;
    height: 6px;
    border-radius: 3px;
    overflow: hidden;
    margin: 12px 0 8px 0;
    position: relative;
  }

  .usage-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--success-color), var(--warning-color));
    transition: width 0.3s ease;
  }

  .usage-text {
    font-size: 12px;
    color: #666;
    text-align: center;
  }

  /* ====== 管理後台樣式 ====== */
  .admin-menu {
    margin-bottom: 40px;
  }

  .menu-grid {
    display: grid;
    gap: 20px;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  }

  .menu-card {
    background: #fff;
    padding: 24px;
    border-radius: var(--border-radius);
    box-shadow: var(--card-shadow);
    text-align: center;
    cursor: pointer;
    transition: var(--transition);
    border: 2px solid transparent;
  }

  .menu-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(0,0,0,0.15);
    border-color: var(--primary-color);
  }

  .menu-icon {
    font-size: 48px;
    margin-bottom: 16px;
  }

  .admin-section {
    background: #fff;
    border-radius: var(--border-radius);
    box-shadow: var(--card-shadow);
    margin-bottom: 24px;
    overflow: hidden;
    display: none;
  }

  .section-header {
    background: #f8f9fa;
    padding: 20px 24px;
    border-bottom: 1px solid #e0e0e0;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .admin-form {
    padding: 24px;
  }

  /* ====== 響應式設計 ====== */
  @media (max-width: 768px) {
    .container {
      padding: 16px;
    }

    .form-row {
      grid-template-columns: 1fr;
    }

    .page-header {
      flex-direction: column;
      align-items: stretch;
    }

    .toolbar {
      flex-direction: column;
      gap: 12px;
    }

    .search-box {
      min-width: auto;
    }

    .event-actions {
      flex-direction: column;
    }

    .event-actions button {
      flex: none;
    }

    nav a {
      display: block;
      margin: 0;
      border-radius: 0;
    }

    .stats-grid {
      grid-template-columns: repeat(2, 1fr);
    }

    .menu-grid {
      grid-template-columns: 1fr;
    }
  }

  @media (max-width: 480px) {
    .header-content {
      padding: 12px 16px;
    }

    header h1 {
      font-size: 20px;
    }

    .stats-grid {
      grid-template-columns: 1fr;
    }

    .form-actions {
      flex-direction: column;
    }

    .notification {
      left: 16px;
      right: 16px;
      max-width: none;
      transform: translateY(-100px);
    }

    .notification.show {
      transform: translateY(0);
    }
  }

  /* ====== 動畫效果 ====== */
  .fade-in {
    animation: fadeIn 0.5s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .slide-up {
    animation: slideUp 0.3s ease;
  }

  @keyframes slideUp {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
</style>
</head>

<body>
<!-- 頁面標題 -->
<header>
  <div class="header-content">
    <h1 id="pageTitle">🏃‍♂️ 三鐵活動報名</h1>
    <div class="user-info" style="display: none;"></div>
  </div>
  <nav id="mainNav">
    <a href="#" onclick="showPage('home')" class="nav-active">🏠 活動列表</a>
    <a href="#" onclick="showPage('batch')">📝 批次報名</a>
    <a href="#" onclick="showPage('admin')">⚙️ 管理後台</a>
  </nav>
</header>

<!-- 主要內容容器 -->
<div class="container">
  <div id="mainContent">
    <!-- 動態載入頁面內容 -->
  </div>
</div>

<!-- 模態框 -->
<div id="modalBackdrop" class="modal-backdrop">
  <div class="modal" id="modalContent">
    <!-- 動態內容 -->
  </div>
</div>

<!-- 頁尾 -->
<footer>
  <div class="footer-content">
    <p>© 2025 三鐵活動報名系統 v2.0</p>
  </div>
</footer>

<script>
  // ====== 全域變數 ====== 
  const CONFIG = {
    API_BASE_URL: "https://script.google.com/macros/s/AKfycbxdSWNjtioLiJ7wv6kpwRgqeUoRSiEiXMCGcJsjMeyM2CbePptLYDcOVt7SAgy-_EKy/exec",
    LIFF_ID: "2007905012-o1yDNa92", 
    VERSION: "2.0.0"
  };

  let gProfile = {
    isLoggedIn: false,
    userId: null,
    displayName: null,
    pictureUrl: null
  };

  let gSystemInfo = {
    categories: ["登山組", "單車組", "慢跑組", "水上組"],
    lastRefresh: 0
  };

  let currentPage = 'home';
  let allEvents = [];
  let filteredEvents = [];

  // ====== 共用工具函數 ======
  function htmlEscape(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function formatDateTime(dateStr) {
    if (!dateStr) return '-';
    try {
      const date = new Date(dateStr);
      return date.toLocaleString('zh-TW', {
        year: 'numeric',
        month: '2-digit', 
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit'
      });
    } catch (error) {
      return dateStr;
    }
  }

  function truncateText(text, maxLength) {
    if (!text || text.length <= maxLength) return text;
    return text.substring(0, maxLength) + '...';
  }

  function debounce(func, wait) {
    let timeout;
    return function executedFunction(...args) {
      const later = () => {
        clearTimeout(timeout);
        func(...args);
      };
      clearTimeout(timeout);
      timeout = setTimeout(later, wait);
    };
  }

  function saveToLocalStorage(key, value) {
    try {
      localStorage.setItem(`triathlon_${key}`, JSON.stringify(value));
    } catch (error) {
      console.warn('無法儲存到 localStorage:', error);
    }
  }

  function loadFromLocalStorage(key, defaultValue = null) {
    try {
      const item = localStorage.getItem(`triathlon_${key}`);
      return item ? JSON.parse(item) : defaultValue;
    } catch (error) {
      console.warn('無法從 localStorage 讀取:', error);
      return defaultValue;
    }
  }

  // ====== 修正後的 API 函數 ======
async function apiRequest(method, params = {}) {
  const url = CONFIG.API_BASE_URL;
  
  try {
    let response;
    
    if (method === 'GET') {
      // GET 請求：將參數加到 URL
      const urlParams = new URLSearchParams(params);
      const requestUrl = `${url}?${urlParams.toString()}`;
      
      response = await fetch(requestUrl, {
        method: 'GET',
        mode: 'cors', // 明確指定 CORS 模式
        cache: 'no-cache',
        headers: {
          'Content-Type': 'application/json',
        }
      });
    } else if (method === 'POST') {
      // POST 請求：使用表單數據格式（GAS 更容易處理）
      const formData = new URLSearchParams();
      Object.keys(params).forEach(key => {
        if (typeof params[key] === 'object') {
          formData.append(key, JSON.stringify(params[key]));
        } else {
          formData.append(key, params[key]);
        }
      });
      
      response = await fetch(url, {
        method: 'POST',
        mode: 'cors',
        cache: 'no-cache',
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded',
        },
        body: formData
      });
    }
    
    // 檢查回應是否為 HTML（通常表示需要登入）
    const contentType = response.headers.get('content-type');
    if (contentType && contentType.includes('text/html')) {
      throw new Error('API 未正確部署，請檢查 Google Apps Script 部署設定');
    }
    
    if (!response.ok) {
      throw new Error(`HTTP ${response.status}: ${response.statusText}`);
    }
    
    const result = await response.json();
    return result;
    
  } catch (error) {
    console.error('API 請求失敗:', error);
    
    // 提供更具體的錯誤訊息
    if (error.message.includes('CORS')) {
      throw new Error('跨域請求被阻擋，請確認 Google Apps Script 已正確部署並設定為「任何人」可存取');
    } else if (error.message.includes('Failed to fetch')) {
      throw new Error('網路連線失敗，請檢查網路狀態或 API 部署狀態');
    }
    
    throw error;
  }
}

// 修正後的 POST 處理（適用於 Google Apps Script）
async function apiPost(action, data) {
  return await apiRequest('POST', { action, ...data });
}

async function handleRegisterSubmit(e) {
e.preventDefault();

const form = e.target;
const submitBtn = form.querySelector('button[type="submit"]');
const msgDiv = document.getElementById('registerMsg');

setButtonLoading(submitBtn, true);
msgDiv.innerHTML = '';

try {
  const formData = new FormData(form);
  const registrationData = {
    eventId: formData.get('eventId'),
    name: formData.get('name').trim(),
    phone: formData.get('phone').trim(),
    note: formData.get('note').trim(),
    userId: gProfile.userId || 'anonymous',
    source: 'web'
  };
  
  if (!registrationData.name) {
    throw new Error('請輸入姓名');
  }
  
  const result = await apiPost('singleRegister', registrationData);
  
  if (result.success) {
    showMessage(msgDiv, 
      `✅ 報名成功！\n狀態：${result.status}`, 
      'success'
    );
    
    setTimeout(() => {
      closeModal();
      refreshEvents();
      showNotification('報名成功', 'success');
    }, 2000);
  } else {
    showMessage(msgDiv, result.message, 'error');
  }
} catch (error) {
  showMessage(msgDiv, '報名失敗：' + error.message, 'error');
} finally {
  setButtonLoading(submitBtn, false);
}
}

  function updateBatchPreview() {
    const textarea = document.querySelector('textarea[name="nameList"]');
    const counter = document.querySelector('.counter');
    const preview = document.getElementById('batchPreview');
    const previewList = document.getElementById('previewList');
    const submitBtn = document.querySelector('#batchRegisterForm button[type="submit"]');
    
    const names = textarea.value
      .split('\n')
      .map(name => name.trim())
      .filter(name => name.length > 0);
    
    counter.textContent = `${names.length} 人`;
    
    if (names.length > 0) {
      preview.style.display = 'block';
      previewList.innerHTML = names.map((name, index) => 
        `<div class="preview-item">${index + 1}. ${htmlEscape(name)}</div>`
      ).join('');
      submitBtn.disabled = false;
    } else {
      preview.style.display = 'none';
      submitBtn.disabled = true;
    }
  }

  async function handleBatchRegisterSubmit(e) {
    e.preventDefault();
    
    const form = e.target;
    const submitBtn = form.querySelector('button[type="submit"]');
    const msgDiv = document.getElementById('batchRegisterMsg');
    
    setButtonLoading(submitBtn, true);
    msgDiv.innerHTML = '';
    
    try {
      const formData = new FormData(form);
      const names = formData.get('nameList')
        .split('\n')
        .map(name => name.trim())
        .filter(name => name.length > 0);
      
      if (names.length === 0) {
        throw new Error('請輸入至少一個姓名');
      }
      
      const batchData = {
        eventId: formData.get('eventId'),
        names: names,
        commonPhone: formData.get('commonPhone').trim(),
        commonNote: formData.get('commonNote').trim(),
        userId: gProfile.userId
      };
      
      const result = await apiPost('batchRegister', batchData);
      
      if (result.success) {
        const { successful, failed, waitingCount } = result.result;
        let message = `✅ 批次報名完成！\n成功：${successful.length} 人`;
        if (waitingCount > 0) message += `\n候補：${waitingCount} 人`;
        if (failed.length > 0) message += `\n失敗：${failed.length} 人`;
        
        showMessage(msgDiv, message, 'success');
        
        setTimeout(() => {
          closeModal();
          showNotification('批次報名完成', 'success');
          if (currentPage === 'home') refreshEvents();
          if (currentPage === 'batch') loadBatchEvents();
        }, 2000);
      } else {
        showMessage(msgDiv, result.message, 'error');
      }
    } catch (error) {
      showMessage(msgDiv, '批次報名失敗：' + error.message, 'error');
    } finally {
      setButtonLoading(submitBtn, false);
    }
  }

  async function handleCreateEventSubmit(e) {
    e.preventDefault();
    
    const form = e.target;
    const submitBtn = form.querySelector('button[type="submit"]');
    const msgDiv = document.getElementById('createEventMsg');
    
    setButtonLoading(submitBtn, true);
    msgDiv.innerHTML = '';
    
    try {
      const formData = new FormData(form);
      const eventData = {
        eventName: formData.get('eventName').trim(),
        category: formData.get('category'),
        eventDate: formData.get('eventDate'),
        capacity: parseInt(formData.get('capacity')),
        location: formData.get('location').trim(),
        description: formData.get('description').trim(),
        userId: gProfile.userId
      };
      
      if (!eventData.eventName || !eventData.category || !eventData.capacity) {
        throw new Error('請填寫必要欄位');
      }
      
      const result = await apiPost('createEvent', eventData);
      
      if (result.success) {
        showMessage(msgDiv, `✅ 活動建立成功！\n活動ID：${result.eventId}`, 'success');
        form.reset();
        
        setTimeout(() => {
          showNotification('活動建立成功', 'success');
          if (currentPage === 'home') refreshEvents();
        }, 1500);
      } else {
        showMessage(msgDiv, result.message, 'error');
      }
    } catch (error) {
      showMessage(msgDiv, '建立失敗：' + error.message, 'error');
    } finally {
      setButtonLoading(submitBtn, false);
    }
  }

    const container = document.getElementById('eventListContainer');
    showLoading(container, '載入活動列表...');
    
    try {
      const result = await fetchAllEvents(false); // 包含停用的活動
      
      if (!result.success) {
        container.innerHTML = `
          <div class="empty-state">
            <p>❌ 載入失敗</p>
            <p>${htmlEscape(result.message)}</p>
          </div>
        `;
        return;
      }
      
      allEvents = result.events || [];
      filteredEvents = [...allEvents];
      renderManagementEventList();
      
    } catch (error) {
      container.innerHTML = `
        <div class="empty-state">
          <p>❌ 載入失敗</p>

  function filterEventList() {
    const statusFilter = document.getElementById('statusFilter').value;
    const categoryFilter = document.getElementById('categoryFilter2').value;
    
    filteredEvents = allEvents.filter(event => {
      const statusMatch = !statusFilter || event.enabled.toString() === statusFilter;
      const categoryMatch = !categoryFilter || event.category === categoryFilter;
      return statusMatch && categoryMatch;
    });
    
    renderManagementEventList();
  }

  async function toggleEventStatus(eventId, newStatus) {
    try {
      const result = await apiPost('toggleEventStatus', { 
        eventId, 
        enabled: newStatus,
        userId: gProfile.userId 
      });
      
      if (result.success) {
        showNotification(`活動已${newStatus ? '啟用' : '停用'}`, 'success');
        await refreshEventList();
      } else {
        showNotification(result.message, 'error');
      }
    } catch (error) {
      showNotification('操作失敗：' + error.message, 'error');
    }
  }

  async function deleteEvent(eventId) {
    const event = allEvents.find(e => e.eventId === eventId);
    if (!event) return;
    
    const confirmed = confirm(`確定要刪除活動「${event.name}」嗎？\n\n⚠️ 此操作無法復原！`);
    if (!confirmed) return;
    
    try {
      const result = await apiPost('deleteEvent', { 
        eventId,
        userId: gProfile.userId 
      });
      
      if (result.success) {
        showNotification('活動已刪除', 'success');
        await refreshEventList();
      } else {
        showNotification(result.message, 'error');
      }
    } catch (error) {
      showNotification('刪除失敗：' + error.message, 'error');
    }
  }

  
  async function initializeSystem() {
    if (!confirm('確定要初始化系統嗎？')) return;
    
    try {
      const result = await apiPost('initializeSystem', { userId: gProfile.userId });
      
      if (result.success) {
        showNotification('系統初始化完成', 'success');
      } else {
        showNotification(result.message, 'error');
      }
    } catch (error) {
      showNotification('初始化失敗：' + error.message, 'error');
    }
  }

  async function migrateData() {
    if (!confirm('確定要執行資料遷移嗎？')) return;
    
    try {
      const result = await apiPost('migrateData', { userId: gProfile.userId });
      
      if (result.success) {
        showNotification('資料遷移完成', 'success');
      } else {
        showNotification(result.message, 'error');
      }
    } catch (error) {
      showNotification('遷移失敗：' + error.message, 'error');
    }
  }

  async function cleanupOldData() {
    if (!confirm('確定要清理舊資料嗎？\n\n⚠️ 此操作無法復原！')) return;
    
    try {
      const result = await apiPost('cleanupOldData', { userId: gProfile.userId });
      
      if (result.success) {
        showNotification(`清理完成，刪除了 ${result.deletedCount} 筆資料`, 'success');
      } else {
        showNotification(result.message, 'error');
      }
    } catch (error) {
      showNotification('清理失敗：' + error.message, 'error');
    }
  }

  // ====== 初始化應用程式 ======
  document.addEventListener('DOMContentLoaded', async function() {
    console.log('🚀 三鐵報名系統啟動中...');
    
    try {
      // 初始化 LIFF
      await initLiffIfEnabled();
      
      // 載入預設頁面
      showPage('home');
      
      console.log('✅ 系統初始化完成');
      
    } catch (error) {
      console.error('❌ 系統初始化失敗:', error);
      showNotification('系統初始化失敗：' + error.message, 'error');
    }
  });

  // 鍵盤快捷鍵
  document.addEventListener('keydown', function(e) {
    // ESC 關閉模態框
    if (e.key === 'Escape') {
      closeModal();
    }
    
    // Ctrl+R 重新載入當前頁面
    if (e.ctrlKey && e.key === 'r') {
      e.preventDefault();
      switch(currentPage) {
        case 'home':
          refreshEvents();
          break;
        case 'batch':
          loadBatchEvents();
          break;
        case 'admin':
          if (document.getElementById('manageEventsSection').style.display !== 'none') {
            refreshEventList();
          }
          break;
      }
    }
  });

  // 全域錯誤處理
  window.addEventListener('error', function(e) {
    console.error('全域錯誤:', e.error);
    showNotification('系統發生錯誤，請重新整理頁面', 'error');
  });

  window.addEventListener('unhandledrejection', function(e) {
    console.error('未處理的 Promise 錯誤:', e.reason);
    showNotification('網路請求失敗，請檢查連線狀態', 'error');
  });
</script>
</body>
</html>
