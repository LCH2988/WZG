
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>多活動報名</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body { font-family:'Microsoft JhengHei', Arial; background:#f0f4f8; margin:0; padding:20px;}
  .wrap { max-width:900px; margin:0 auto; background:#fff; padding:28px 32px 60px; border-radius:18px; box-shadow:0 8px 26px rgba(0,0,0,.1);}
  h1 { margin:0 0 10px; font-size:1.7rem; color:#0d47a1;}
  .row { margin-top:20px;}
  label { font-weight:bold; display:block; margin-bottom:8px;}
  select, input, textarea { width:100%; padding:14px 15px; border:2px solid #cfd8dc; border-radius:10px; font-size:1rem; background:#fafafa; transition:.25s;}
  select:focus, input:focus, textarea:focus { outline:none; border-color:#1976d2; background:#fff;}
  .groups { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin-top:10px;}
  .gcard { background:#f5f7f9; border:2px solid #ddd; border-radius:12px; padding:16px; cursor:pointer; text-align:center; position:relative; }
  .gcard.disabled { opacity:.35; cursor:not-allowed; }
  .gcard.active { border-color:#1976d2; background:#1976d2; color:#fff; box-shadow:0 4px 16px rgba(25,118,210,.4);}
  .people-box { display:flex; gap:10px; align-items:center; margin-top:10px;}
  .people-box button { width:48px; height:48px; background:#1976d2; color:#fff; border:none; font-size:1.4rem; border-radius:12px; cursor:pointer;}
  .people-display { flex:1; background:#eceff1; text-align:center; font-size:1.4rem; border-radius:12px; padding:10px 0; font-weight:bold;}
  .toggle-batch { margin-top:18px; display:flex; align-items:center; gap:10px;}
  .submit-btn { margin-top:38px; width:100%; padding:18px; font-size:1.3rem; border:none; border-radius:14px; background:linear-gradient(90deg,#1976d2,#26a69a); color:#fff; cursor:pointer; font-weight:bold;}
  .status-bar { padding:10px 14px; background:#e3f2fd; border-left:6px solid #1976d2; border-radius:8px; font-size:.9rem;}
  .hint { font-size:.8rem; color:#607d8b; margin-top:6px; line-height:1.4;}
  .note { background:#fffde7; padding:10px 14px; border-left:6px solid #fbc02d; border-radius:6px; font-size:.85rem; margin-top:20px;}
  .inline { display:inline-block; margin-right:12px; font-size:.85rem;}
  .result { margin-top:20px; padding:14px 16px; border-radius:10px; background:#f1f8e9; color:#33691e; display:none; white-space:pre-line;}
  .danger { color:#d32f2f;}
  .badge { position:absolute; top:8px; right:8px; background:#0d47a1; color:#fff; padding:2px 8px; border-radius:12px; font-size:.65rem;}
</style>
</head>
<body>
  <div class="wrap">
    <h1>多活動報名</h1>
    <div id="status" class="status-bar">初始化中...</div>

    <div class="row">
      <label>選擇活動 *</label>
      <select id="eventSelect" onchange="onSelectEvent()">
        <option value="">載入中...</option>
      </select>
      <div class="hint" id="eventInfo"></div>
    </div>

    <div class="row">
      <label>選擇組別 *</label>
      <div class="groups" id="groupWrap"></div>
      <input type="hidden" id="group">
      <div class="hint" id="quotaHint"></div>
    </div>

    <div class="toggle-batch">
      <input type="checkbox" id="batchMode" onchange="toggleBatch()"> 批次報名
    </div>

    <div id="singleArea">
      <div class="row">
        <label>姓名 *</label>
        <input type="text" id="name" placeholder="輸入姓名">
      </div>
      <div class="row">
        <label>人數 *</label>
        <div class="people-box">
          <button type="button" onclick="adjPeople(-1)">-</button>
          <div class="people-display" id="peopleDisplay">1</div>
          <button type="button" onclick="adjPeople(1)">+</button>
        </div>
        <input type="hidden" id="people" value="1">
      </div>
    </div>

    <div id="batchArea" style="display:none;">
      <div class="row">
        <label>批次姓名清單 *</label>
        <textarea id="namesBatch" placeholder="每行一筆，可加 *2 或 x2 表示人數，例如：&#10;王小明&#10;李小華*2&#10;張三 x3"></textarea>
      </div>
    </div>

    <div class="row">
      <label>備註</label>
      <textarea id="remarks" placeholder="可填寫隊名 / 特殊需求..."></textarea>
    </div>

    <button class="submit-btn" onclick="submitForm()">送出報名</button>

    <div class="note">
      若正選名額不足，系統將自動列入候補。<br>
      批次報名整批同一狀態（無拆分），需要拆分可再告知我擴充。
    </div>

    <div id="resultBox" class="result"></div>
  </div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
const liffId = "2007905012-o1yDNa92";
const GAS_BASE = "https://script.google.com/macros/s/AKfycbya7ojH0_3gVG1-U15ReawAixNhheJ0swR70sAG-rigdCsNj1WxgFXDVbKJ6rGFq_b0/exec";
let events = [];
let currentEvent = null;
let userProfile = null;

const GROUPS = ["登山組","單車組","慢跑組","水上組"];

document.addEventListener("DOMContentLoaded", init);

async function init(){
  updateStatus("初始化 LIFF...");
  try{
    await liff.init({liffId});
    if(!liff.isLoggedIn()){ liff.login(); return; }
    userProfile = await liff.getProfile();
    updateStatus("歡迎，"+userProfile.displayName);
  }catch(e){
    updateStatus("LIFF 初始化失敗："+e.message, true);
  }
  await loadEvents();
  renderGroups();
}

function updateStatus(msg, err=false){
  const s = document.getElementById('status');
  s.textContent = msg;
  s.style.background = err ? "#ffebee" : "#e3f2fd";
  s.style.borderLeftColor = err ? "#c62828" : "#1976d2";
}

async function loadEvents(){
  try{
    const res = await fetch(GAS_BASE+"?action=getEvents");
    const data = await res.json();
    events = data.events || [];
    const sel = document.getElementById('eventSelect');
    sel.innerHTML = '<option value="">請選擇活動</option>';
    events.forEach(ev=>{
      const opt = document.createElement('option');
      opt.value = ev.eventId;
      opt.textContent = `${ev.name} (${ev.date || ''})`;
      sel.appendChild(opt);
    });
  }catch(e){
    updateStatus("載入活動失敗:"+e.message,true);
  }
}

function onSelectEvent(){
  const id = document.getElementById('eventSelect').value;
  currentEvent = events.find(e=>e.eventId===id);
  const info = document.getElementById('eventInfo');
  if(!currentEvent){
    info.textContent = "";
    return;
  }
  info.textContent = currentEvent.description || "";
  renderGroups();
  document.getElementById('group').value = "";
  document.getElementById('quotaHint').textContent="";
}

function renderGroups(){
  const wrap = document.getElementById('groupWrap');
  wrap.innerHTML = "";
  GROUPS.forEach(g=>{
    const div = document.createElement('div');
    div.className = 'gcard';
    div.dataset.group = g;
    let remain = currentEvent ? currentEvent.remain[g] : "-";
    let cap = currentEvent ? currentEvent.capacity[g] : "-";
    if(currentEvent && cap <=0){
      div.classList.add('disabled');
      div.innerHTML = `<strong>${g}</strong><div class="badge">未開放</div>`;
    }else{
      div.innerHTML = `<strong>${g}</strong><div style="margin-top:6px;font-size:.8rem;">剩餘：${remain}</div>`;
      div.onclick = ()=> selectGroup(g, div);
    }
    wrap.appendChild(div);
  });
}

function selectGroup(g, el){
  if(el.classList.contains('disabled')) return;
  document.querySelectorAll('.gcard').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('group').value = g;
  updateQuotaHint();
}

function updateQuotaHint(){
  const g = document.getElementById('group').value;
  if(!g || !currentEvent){ document.getElementById('quotaHint').textContent = ""; return; }
  const remain = currentEvent.remain[g];
  const ppl = parseInt(document.getElementById('people').value)||1;
  document.getElementById('quotaHint').textContent =
    remain >= ppl ? `預估 正選 (剩餘 ${remain})` : `預估 候補 (剩餘 ${remain})`;
}

function adjPeople(d){
  const hidden = document.getElementById('people');
  let v = parseInt(hidden.value)||1;
  v += d;
  if(v<1) v=1;
  if(v>99) v=99;
  hidden.value = v;
  document.getElementById('peopleDisplay').textContent = v;
  updateQuotaHint();
}

function toggleBatch(){
  const batch = document.getElementById('batchMode').checked;
  document.getElementById('singleArea').style.display = batch ? 'none':'block';
  document.getElementById('batchArea').style.display = batch ? 'block':'none';
  document.getElementById('quotaHint').textContent="";
}

async function submitForm(){
  const eventId = document.getElementById('eventSelect').value;
  const group = document.getElementById('group').value;
  if(!eventId) return alert("請選擇活動");
  if(!group) return alert("請選擇組別");
  const batch = document.getElementById('batchMode').checked;
  let payload;
  if(batch){
    const namesText = document.getElementById('namesBatch').value.trim();
    if(!namesText) return alert("請輸入批次姓名");
    payload = {
      action:"batchRegister",
      eventId,
      group,
      namesText,
      remarks: document.getElementById('remarks').value.trim(),
      source:"liff_form",
      liffUserId:userProfile?.userId || "",
      liffDisplayName:userProfile?.displayName || "",
      sendMethod:"line_send"
    };
  }else{
    const name = document.getElementById('name').value.trim();
    if(!name) return alert("請輸入姓名");
    const people = parseInt(document.getElementById('people').value)||1;
    payload = {
      action:"singleRegister",
      eventId,
      group,
      name,
      people,
      remarks: document.getElementById('remarks').value.trim(),
      source:"liff_form",
      liffUserId:userProfile?.userId || "",
      liffDisplayName:userProfile?.displayName || "",
      sendMethod:"line_send"
    };
  }
  updateStatus("送出中...");
  try{
    const res = await fetch(GAS_BASE,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload)
    });
    const data = await res.json();
    if(!data.success){
      updateStatus("失敗："+data.message,true);
      return;
    }
    showResult(data);
    updateStatus("完成");
    if(liff.isInClient()){
      try{
        await liff.sendMessages([{
          type:'text',
          text: batch
            ? `✅ 批次報名完成\n活動:${data.eventName}\n狀態:${data.status||''}\n筆數:${data.totalEntries||''} 人數:${data.totalPeople||''}`
            : `✅ 報名完成\n活動:${data.eventName}\n姓名:${payload.name}\n組別:${payload.group}\n狀態:${data.status}`
        }]);
      }catch(e){}
    }
    // 重新載入活動以更新剩餘
    await loadEvents();
    currentEvent = events.find(e=>e.eventId===eventId);
    renderGroups();
  }catch(e){
    updateStatus("錯誤："+e.message,true);
  }
}

function showResult(data){
  const box = document.getElementById('resultBox');
  box.style.display='block';
  box.textContent = JSON.stringify(data, null, 2);
}
</script>
</body>
</html>
