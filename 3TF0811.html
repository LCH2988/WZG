
// ==================== index.html ====================
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三鐵飛翔好活動報名系統</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 16px;
            opacity: 0.9;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 18px;
            margin-top: 50px;
        }

        .error {
            background: #ff5252;
            color: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin: 20px 0;
        }

        /* 活動卡片樣式 */
        .activities-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .activity-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .activity-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.15);
        }

        .activity-image {
            height: 200px;
            background: linear-gradient(45deg, #4CAF50, #2196F3);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: white;
        }

        .activity-content {
            padding: 20px;
        }

        .activity-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #2c3e50;
        }

        .activity-info {
            color: #666;
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .activity-info div {
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .groups-info {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
        }

        .group-badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            color: white;
        }

        .activity-buttons {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: #2196F3;
            color: white;
        }

        .btn-primary:hover {
            background: #1976D2;
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #666;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        /* 報名表單樣式 */
        .form-container {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .form-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #2c3e50;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: #2196F3;
        }

        .radio-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .radio-option:hover {
            border-color: #2196F3;
            background: #f3f8ff;
        }

        .radio-option.selected {
            border-color: #2196F3;
            background: #2196F3;
            color: white;
        }

        .radio-option input {
            display: none;
        }

        .names-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .name-input-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .add-name-btn {
            padding: 8px 16px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .remove-name-btn {
            padding: 8px 12px;
            background: #f44336;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .submit-btn:hover {
            background: #1976D2;
        }

        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        /* 統計頁面樣式 */
        .stats-container {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }

        .stats-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .stats-title {
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .group-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .group-card {
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
            background: #fafafa;
        }

        .group-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            font-size: 18px;
            font-weight: bold;
        }

        .group-count {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }

        .name-list {
            list-style: none;
            padding: 0;
        }

        .name-list li {
            padding: 5px 0;
            border-bottom: 1px solid #eee;
        }

        .name-list li:last-child {
            border-bottom: none;
        }

        .confirmed {
            color: #4CAF50;
            font-weight: bold;
        }

        .waitlist {
            color: #FF9800;
            font-weight: bold;
        }

        .back-btn {
            display: inline-block;
            padding: 12px 24px;
            background: #666;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            margin-bottom: 20px;
            transition: background 0.3s ease;
        }

        .back-btn:hover {
            background: #555;
        }

        .success-message {
            background: #4CAF50;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: center;
        }

        .user-info {
            background: #f0f8ff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
        }

        .user-name {
            font-weight: bold;
            color: #2c3e50;
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            .activities-grid {
                grid-template-columns: 1fr;
            }

            .radio-group {
                grid-template-columns: 1fr;
            }

            .group-stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏃‍♂️ 三鐵飛翔好</h1>
            <p>活動報名系統</p>
        </div>
        <div id="app">
            <div class="loading">載入中...</div>
        </div>
    </div>

    <script>
        const PAGE = '<?= page ?>';
        const ACTIVITY_ID = '<?= activityId ?>';
        const LIFF_ID = '<?= liffId ?>';
        const WEB_APP_URL = '<?= webAppUrl ?>';
        
        const GROUPS = {
            '登山組': { icon: '🏔️', color: '#4CAF50' },
            '單車組': { icon: '🚴', color: '#2196F3' },
            '跑步組': { icon: '🏃', color: '#FF9800' },
            '水上組': { icon: '🏊', color: '#00BCD4' }
        };

        let liffProfile = null;
        let currentActivity = null;

        // 初始化 LIFF
        async function initLiff() {
            try {
                await liff.init({ liffId: LIFF_ID });
                
                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }

                liffProfile = await liff.getProfile();
                console.log('LIFF Profile:', liffProfile);
            } catch (error) {
                console.error('LIFF initialization failed:', error);
                showError('LIFF 初始化失敗，請重新整理頁面');
            }
        }

        // API 呼叫
        async function apiCall(action, data = {}) {
            try {
                const response = await fetch(`${WEB_APP_URL}?action=${action}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });
                return await response.json();
            } catch (error) {
                console.error('API call failed:', error);
                throw new Error('網路連線錯誤');
            }
        }

        // 顯示錯誤訊息
        function showError(message) {
            document.getElementById('app').innerHTML = `
                <div class="error">
                    <strong>錯誤：</strong>${message}
                </div>
            `;
        }

        // 顯示成功訊息
        function showSuccess(message) {
            const successDiv = document.createElement('div');
            successDiv.className = 'success-message';
            successDiv.textContent = message;
            document.getElementById('app').prepend(successDiv);
            
            setTimeout(() => {
                successDiv.remove();
            }, 5000);
        }

        // 載入活動列表頁面
        async function loadActivitiesPage() {
            try {
                const result = await apiCall('getActivities');
                if (!result.success) {
                    showError('無法載入活動列表');
                    return;
                }

                const activities = result.data;
                if (activities.length === 0) {
                    document.getElementById('app').innerHTML = `
                        <div class="form-container">
                            <h2 style="text-align: center; color: #666;">目前沒有開放的活動</h2>
                        </div>
                    `;
                    return;
                }

                let html = '<div class="activities-grid">';
                
                activities.forEach(activity => {
                    const groupsHtml = Object.keys(GROUPS).map(group => {
                        const limit = activity[GROUPS[group].field.replace('上限', '組上限')] || 0;
                        if (limit > 0) {
                            return `<span class="group-badge" style="background-color: ${GROUPS[group].color}">
                                ${GROUPS[group].icon} ${group} (${limit}人)
                            </span>`;
                        }
                        return '';
                    }).join('');

                    html += `
                        <div class="activity-card" onclick="goToRegister('${activity['活動ID']}')">
                            <div class="activity-image">
                                🏃‍♂️🚴‍♀️🏊‍♂️
                            </div>
                            <div class="activity-content">
                                <div class="activity-title">${activity['活動名稱']}</div>
                                <div class="activity-info">
                                    <div>📅 ${activity['日期']}</div>
                                    <div>⏰ ${activity['時間']}</div>
                                    <div>📍 ${activity['地點']}</div>
                                    <div>🆔 ${activity['活動ID']}</div>
                                </div>
                                <div class="groups-info">
                                    ${groupsHtml}
                                </div>
                                <div class="activity-buttons">
                                    <button class="btn btn-primary" onclick="event.stopPropagation(); goToRegister('${activity['活動ID']}')">
                                        立即報名
                                    </button>
                                    <button class="btn btn-secondary" onclick="event.stopPropagation(); goToStats('${activity['活動ID']}')">
                                        查看名單
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                });
                
                html += '</div>';
                document.getElementById('app').innerHTML = html;

            } catch (error) {
                showError(error.message);
            }
        }

        // 載入報名頁面
        async function loadRegisterPage() {
            if (!ACTIVITY_ID) {
                showError('未指定活動ID');
                return;
            }

            try {
                const result = await apiCall('getActivity', { activityId: ACTIVITY_ID });
                if (!result.success) {
                    showError('活動不存在');
                    return;
                }

                currentActivity = result.data;
                
                let userInfoHtml = '';
                if (liffProfile) {
                    userInfoHtml = `
                        <div class="user-info">
                            <img src="${liffProfile.pictureUrl}" alt="頭像" class="user-avatar">
                            <div>
                                <div class="user-name">${liffProfile.displayName}</div>
                                <div style="font-size: 14px; color: #666;">報名者身份</div>
                            </div>
                        </div>
                    `;
                }

                const groupsHtml = Object.keys(GROUPS).map(group => {
                    const limit = currentActivity[GROUPS[group].field.replace('上限', '組上限')] || 0;
                    if (limit > 0) {
                        return `
                            <div class="radio-option" onclick="selectGroup('${group}')">
                                <input type="radio" name="group" value="${group}" id="group_${group}">
                                <span>${GROUPS[group].icon} ${group} (名額: ${limit}人)</span>
                            </div>
                        `;
                    }
                    return '';
                }).join('');

                document.getElementById('app').innerHTML = `
                    <a href="javascript:goToActivities()" class="back-btn">← 返回活動列表</a>
                    
                    <div class="form-container">
                        <div class="form-title">${currentActivity['活動名稱']}</div>
                        
                        <div style="text-align: center; margin-bottom: 20px; color: #666;">
                            <div>📅 ${currentActivity['日期']} ${currentActivity['時間']}</div>
                            <div>📍 ${currentActivity['地點']}</div>
                            <div style="margin-top: 10px; font-size: 14px;">${currentActivity['說明']}</div>
                        </div>

                        ${userInfoHtml}
                        
                        <form id="registrationForm">
                            <div class="form-group">
                                <label class="form-label">選擇組別 *</label>
                                <div class="radio-group">
                                    ${groupsHtml}
                                </div>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label">報名模式</label>
                                <div class="radio-group">
                                    <div class="radio-option selected" onclick="selectMode('single')">
                                        <input type="radio" name="mode" value="single" checked>
                                        <span>個人報名</span>
                                    </div>
                                    <div class="radio-option" onclick="selectMode('multiple')">
                                        <input type="radio" name="mode" value="multiple">
                                        <span>多人報名</span>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label">參加者姓名 *</label>
                                <div class="names-container" id="namesContainer">
                                    <div class="name-input-group">
                                        <input type="text" class="form-control name-input" placeholder="請輸入姓名" required>
                                    </div>
                                </div>
                                <button type="button" class="add-name-btn" id="addNameBtn" onclick="addNameField()" style="display: none; margin-top: 10px;">
                                    + 新增姓名
                                </button>
                            </div>
                            
                            <button type="submit" class="submit-btn">確認報名</button>
                        </form>
                    </div>
                `;

                // 綁定表單提交事件
                document.getElementById('registrationForm').addEventListener('submit', handleRegistration);

            } catch (error) {
                showError(error.message);
            }
        }

        // 載入統計頁面
        async function loadStatsPage() {
            if (!ACTIVITY_ID) {
                showError('未指定活動ID');
                return;
            }

            try {
                const result = await apiCall('getStats', { activityId: ACTIVITY_ID });
                if (!result.success) {
                    showError('無法載入統計資料');
                    return;
                }

                const { activity, stats } = result.data;
                
                let groupsHtml = '';
                Object.keys(GROUPS).forEach(group => {
                    const limit = activity[GROUPS[group].field.replace('上限', '組上限')] || 0;
                    if (limit > 0) {
                        const groupStats = stats.groups[group];
                        
                        let confirmedHtml = '';
                        if (groupStats.confirmed.length > 0) {
                            confirmedHtml = groupStats.confirmed.map(person => 
                                `<li class="confirmed">${person.sequence}. ${person.name}</li>`
                            ).join('');
                        } else {
                            confirmedHtml = '<li style="color: #999;">暫無報名</li>';
                        }
                        
                        let waitlistHtml = '';
                        if (groupStats.waitlist.length > 0) {
                            waitlistHtml = groupStats.waitlist.map(person => 
                                `<li class="waitlist">${person.sequence}. ${person.name}</li>`
                            ).join('');
                        } else {
                            waitlistHtml = '<li style="color: #999;">暫無候補</li>';
                        }

                        groupsHtml += `
                            <div class="group-card">
                                <div class="group-header" style="color: ${GROUPS[group].color}">
                                    ${GROUPS[group].icon} ${group}
                                </div>
                                <div class="group-count">
                                    正選: ${groupStats.confirmedCount}/${limit} 人 | 
                                    候補: ${groupStats.waitlistCount} 人
                                </div>
                                <div style="margin-bottom: 15px;">
                                    <strong style="color: #4CAF50;">✅ 正選名單</strong>
                                    <ul class="name-list">
                                        ${confirmedHtml}
                                    </ul>
                                </div>
                                <div>
                                    <strong style="color: #FF9800;">⏳ 候補名單</strong>
                                    <ul class="name-list">
                                        ${waitlistHtml}
                                    </ul>
                                </div>
                            </div>
                        `;
                    }
                });

                document.getElementById('app').innerHTML = `
                    <a href="javascript:goToActivities()" class="back-btn">← 返回活動列表</a>
                    
                    <div class="stats-container">
                        <div class="stats-header">
                            <div class="stats-title">${activity['活動名稱']}</div>
                            <div style="color: #666;">
                                📅 ${activity['日期']} ${activity['時間']}<br>
                                📍 ${activity['地點']}
                            </div>
                        </div>
                        
                        <div class="group-stats">
                            ${groupsHtml}
                        </div>
                        
                        <div style="text-align: center; margin-top: 30px;">
                            <a href="javascript:goToRegister('${ACTIVITY_ID}')" class="btn btn-primary" style="text-decoration: none;">
                                我要報名
                            </a>
                        </div>
                    </div>
                `;

            } catch (error) {
                showError(error.message);
            }
        }

        // 選擇組別
        function selectGroup(group) {
            document.querySelectorAll('.radio-option').forEach(option => {
                option.classList.remove('selected');
            });
            event.currentTarget.classList.add('selected');
            document.getElementById(`group_${group}`).checked = true;
        }

        // 選擇模式
        function selectMode(mode) {
            document.querySelectorAll('input[name="mode"]').forEach(input => {
                input.parentElement.classList.remove('selected');
            });
            event.currentTarget.classList.add('selected');
            event.currentTarget.querySelector('input').checked = true;
            
            const addBtn = document.getElementById('addNameBtn');
            const container = document.getElementById('namesContainer');
            
            if (mode === 'multiple') {
                addBtn.style.display = 'block';
            } else {
                addBtn.style.display = 'none';
                // 重置為單一姓名欄位
                container.innerHTML = `
                    <div class="name-input-group">
                        <input type="text" class="form-control name-input" placeholder="請輸入姓名" required>
                    </div>
                `;
            }
        }

        // 新增姓名欄位
        function addNameField() {
            const container = document.getElementById('namesContainer');
            const currentCount = container.querySelectorAll('.name-input').length;
            
            if (currentCount >= 3) {
                alert('最多只能報名 3 人');
                return;
            }
            
            const newField = document.createElement('div');
            newField.className = 'name-input-group';
            newField.innerHTML = `
                <input type="text" class="form-control name-input" placeholder="請輸入姓名" required>
                <button type="button" class="remove-name-btn" onclick="removeNameField(this)">移除</button>
            `;
            
            container.appendChild(newField);
        }

        // 移除姓名欄位
        function removeNameField(button) {
            button.parentElement.remove();
        }

        // 處理報名
        async function handleRegistration(event) {
            event.preventDefault();
            
            const selectedGroup = document.querySelector('input[name="group"]:checked');
            if (!selectedGroup) {
                alert('請選擇組別');
                return;
            }
            
            const nameInputs = document.querySelectorAll('.name-input');
            const names = Array.from(nameInputs)
                .map(input => input.value.trim())
                .filter(name => name);
            
            if (names.length === 0) {
                alert('請至少輸入一個姓名');
                return;
            }
            
            if (!liffProfile) {
                alert('無法取得使用者資訊，請重新整理頁面');
                return;
            }
            
            const submitBtn = document.querySelector('.submit-btn');
            submitBtn.disabled = true;
            submitBtn.textContent = '報名中...';
            
            try {
                const result = await apiCall('register', {
                    activityId: ACTIVITY_ID,
                    group: selectedGroup.value,
                    names: names,
                    userId: liffProfile.userId,
                    userName: liffProfile.displayName
                });
                
                if (result.success) {
                    let message = '報名成功！\n\n';
                    result.results.forEach(person => {
                        const status = person.status === 'CONFIRMED' ? '正選' : '候補';
                        message += `${person.name}: ${status} #${person.sequence}\n`;
                    });
                    
                    alert(message);
                    goToStats(ACTIVITY_ID);
                } else {
                    alert('報名失敗: ' + result.message);
                }
            } catch (error) {
                alert('報名失敗: ' + error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '確認報名';
            }
        }

        // 導航功能
        function goToActivities() {
            window.location.href = `${WEB_APP_URL}?page=activities`;
        }

        function goToRegister(activityId) {
            window.location.href = `${WEB_APP_URL}?page=register&activityId=${activityId}`;
        }

        function goToStats(activityId) {
            window.location.href = `${WEB_APP_URL}?page=stats&activityId=${activityId}`;
        }

        // 頁面初始化
        async function initPage() {
            await initLiff();
            
            switch (PAGE) {
                case 'register':
                    await loadRegisterPage();
                    break;
                case 'stats':
                    await loadStatsPage();
                    break;
                default:
                    await loadActivitiesPage();
                    break;
            }
        }

        // 頁面載入完成後初始化
        document.addEventListener('DOMContentLoaded', initPage);
    </script>
</body>
</html>
