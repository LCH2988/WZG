<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>活動報名表單</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
          font-family: 'Microsoft JhengHei', Arial, sans-serif;
          background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
          min-height: 100vh;
          padding: 20px;
      }
      .form-container {
          max-width: 600px;
          margin: 0 auto;
          background: white;
          border-radius: 15px;
          box-shadow: 0 10px 30px rgba(0,0,0,0.3);
          overflow: hidden;
      }
      .form-header {
          background: linear-gradient(135deg, #667eea, #764ba2);
          color: white;
          padding: 30px;
          text-align: center;
      }
      .form-header h1 { font-size: 2em; margin-bottom: 10px; }
      .form-header p { font-size: 1.1em; opacity: 0.9; }
      
      .form-body {
          padding: 30px;
      }
      .form-group {
          margin-bottom: 20px;
      }
      .form-group label {
          display: block;
          margin-bottom: 8px;
          font-weight: bold;
          color: #333;
      }
      .required {
          color: #e74c3c;
      }
      .form-group input,
      .form-group textarea,
      .form-group select {
          width: 100%;
          padding: 12px;
          border: 2px solid #dee2e6;
          border-radius: 8px;
          font-size: 16px;
          transition: border-color 0.3s;
      }
      .form-group input:focus,
      .form-group textarea:focus,
      .form-group select:focus {
          outline: none;
          border-color: #667eea;
          box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
      }
      
      .radio-group,
      .checkbox-group {
          display: flex;
          flex-direction: column;
          gap: 10px;
      }
      .radio-option,
      .checkbox-option {
          display: flex;
          align-items: center;
          gap: 8px;
      }
      .radio-option input,
      .checkbox-option input {
          width: auto;
          margin: 0;
      }
      
      .submit-btn {
          width: 100%;
          padding: 15px;
          background: linear-gradient(135deg, #667eea, #764ba2);
          color: white;
          border: none;
          border-radius: 8px;
          font-size: 18px;
          font-weight: bold;
          cursor: pointer;
          transition: all 0.3s;
      }
      .submit-btn:hover {
          transform: translateY(-2px);
          box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
      }
      .submit-btn:disabled {
          background: #ccc;
          cursor: not-allowed;
          transform: none;
          box-shadow: none;
      }
      
      .loading {
          display: none;
          text-align: center;
          padding: 20px;
      }
      .loading-spinner {
          display: inline-block;
          width: 40px;
          height: 40px;
          border: 4px solid #f3f3f3;
          border-top: 4px solid #667eea;
          border-radius: 50%;
          animation: spin 1s linear infinite;
      }
      @keyframes spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
      }
      
      .error-message {
          background: #f8d7da;
          color: #721c24;
          padding: 10px;
          border-radius: 5px;
          margin-bottom: 20px;
          display: none;
      }
      .success-message {
          background: #d4edda;
          color: #155724;
          padding: 10px;
          border-radius: 5px;
          margin-bottom: 20px;
          display: none;
      }
      
      .event-info {
          background: #f8f9fa;
          padding: 20px;
          border-radius: 10px;
          margin-bottom: 30px;
      }
      .event-info h3 {
          color: #333;
          margin-bottom: 10px;
      }
      .event-info p {
          color: #666;
          line-height: 1.5;
      }
      
      @media (max-width: 480px) {
          .form-container {
              margin: 10px;
          }
          .form-body {
              padding: 20px;
          }
      }
  </style>
</head>
<body>
  <div class="form-container">
      <div class="form-header">
          <h1 id="eventTitle">🎯 活動報名</h1>
          <p id="eventSubtitle">請填寫以下資料完成報名</p>
      </div>
      
      <div class="form-body">
          <div id="eventInfo" class="event-info" style="display: none;">
              <h3 id="eventInfoTitle"></h3>
              <p id="eventInfoDescription"></p>
          </div>
          
          <div id="errorMessage" class="error-message"></div>
          <div id="successMessage" class="success-message"></div>
          
          <form id="registrationForm">
              <div id="formFields">
                  <!-- 表單欄位將由 JavaScript 動態生成 -->
              </div>
              
              <div class="loading" id="loadingIndicator">
                  <div class="loading-spinner"></div>
                  <p>提交中，請稍候...</p>
              </div>
              
              <button type="submit" class="submit-btn" id="submitBtn">
                  🎯 提交報名
              </button>
          </form>
      </div>
  </div>

  <script>
      let liff;
      let userId;
      let category;
      let eventConfig;
      let formFields = [];
      
      // 請替換為您的 Google Apps Script 網址
      const GAS_URL = 'https://script.google.com/macros/s/AKfycbyBfaeS01V1WpmVVu7TsZlSl0Exw1EZ1ksw5jZK8p_N3rCYKmjLwrf1GbRNnaqL1iUW/exec';
      
      // 初始化 LIFF
      async function initializeLiff() {
          try {
              await liff.init({ liffId: '2007905012-o1yDNa92' }); // 請替換為您的 LIFF ID
              
              if (!liff.isLoggedIn()) {
                  liff.login();
                  return;
              }
              
              // 取得用戶資訊
              const profile = await liff.getProfile();
              userId = profile.userId;
              
              // 取得 URL 參數
              const urlParams = new URLSearchParams(window.location.search);
              category = urlParams.get('category');
              
              if (!category) {
                  showError('缺少活動類別參數');
                  return;
              }
              
              // 載入活動資訊和表單設定
              await loadEventInfo();
              await loadFormConfig();
              
          } catch (error) {
              console.error('LIFF 初始化失敗:', error);
              showError('系統初始化失敗，請重新整理頁面');
          }
      }
      
      // 載入活動資訊
      async function loadEventInfo() {
          try {
              const response = await fetch(`${GAS_URL}?action=getEventInfo&category=${category}`);
              const data = await response.json();
              
              if (data.success) {
                  eventConfig = data.config;
                  updateEventDisplay();
              } else {
                  showError('無法載入活動資訊');
              }
          } catch (error) {
              console.error('載入活動資訊失敗:', error);
              showError('載入活動資訊失敗');
          }
      }
      
      // 載入表單設定
      async function loadFormConfig() {
          try {
              const response = await fetch(`${GAS_URL}?action=getFormConfig&category=${category}`);
              const data = await response.json();
              
              if (data.success || Array.isArray(data)) {
                  formFields = data.success ? data.fields : data;
                  generateFormFields();
              } else {
                  // 使用預設表單欄位
                  formFields = [
                      { id: 'name', label: '姓名', type: 'text', required: true, placeholder: '請輸入您的姓名' },
                      { id: 'phone', label: '手機號碼', type: 'tel', required: true, placeholder: '09xxxxxxxx' },
                      { id: 'email', label: 'Email', type: 'email', required: false, placeholder: 'your@email.com' }
                  ];
                  generateFormFields();
              }
          } catch (error) {
              console.error('載入表單設定失敗:', error);
              // 使用預設表單欄位
              formFields = [
                  { id: 'name', label: '姓名', type: 'text', required: true, placeholder: '請輸入您的姓名' },
                  { id: 'phone', label: '手機號碼', type: 'tel', required: true, placeholder: '09xxxxxxxx' },
                  { id: 'email', label: 'Email', type: 'email', required: false, placeholder: 'your@email.com' }
              ];
              generateFormFields();
          }
      }
      
      // 更新活動顯示
      function updateEventDisplay() {
          if (eventConfig) {
              document.getElementById('eventTitle').textContent = `${eventConfig.icon} ${eventConfig.title}`;
              document.getElementById('eventInfoTitle').textContent = eventConfig.title;
              document.getElementById('eventInfoDescription').textContent = eventConfig.description;
              document.getElementById('eventInfo').style.display = 'block';
          }
      }
      
      // 生成表單欄位
      function generateFormFields() {
          const formFieldsContainer = document.getElementById('formFields');
          formFieldsContainer.innerHTML = '';
          
          formFields.forEach(field => {
              const fieldHtml = createFormField(field);
              formFieldsContainer.innerHTML += fieldHtml;
          });
      }
      
      // 創建表單欄位
      function createFormField(field) {
          const requiredMark = field.required ? '<span class="required">*</span>' : '';
          let fieldHtml = `<div class="form-group">
              <label for="${field.id}">${field.label} ${requiredMark}</label>`;
          
          switch (field.type) {
              case 'textarea':
                  fieldHtml += `<textarea id="${field.id}" name="${field.id}" placeholder="${field.placeholder || ''}" rows="4" ${field.required ? 'required' : ''}></textarea>`;
                  break;
              
              case 'select':
                  fieldHtml += `<select id="${field.id}" name="${field.id}" ${field.required ? 'required' : ''}>
                      <option value="">請選擇</option>`;
                  if (field.options) {
                      field.options.forEach(option => {
                          fieldHtml += `<option value="${option}">${option}</option>`;
                      });
                  }
                  fieldHtml += `</select>`;
                  break;
              
              case 'radio':
                  fieldHtml += `<div class="radio-group">`;
                  if (field.options) {
                      field.options.forEach((option, index) => {
                          fieldHtml += `<div class="radio-option">
                              <input type="radio" id="${field.id}_${index}" name="${field.id}" value="${option}" ${field.required ? 'required' : ''}>
                              <label for="${field.id}_${index}">${option}</label>
                          </div>`;
                      });
                  }
                  fieldHtml += `</div>`;
                  break;
              
              case 'checkbox':
                  fieldHtml += `<div class="checkbox-group">`;
                  if (field.options) {
                      field.options.forEach((option, index) => {
                          fieldHtml += `<div class="checkbox-option">
                              <input type="checkbox" id="${field.id}_${index}" name="${field.id}" value="${option}">
                              <label for="${field.id}_${index}">${option}</label>
                          </div>`;
                      });
                  }
                  fieldHtml += `</div>`;
                  break;
              
              default:
                  fieldHtml += `<input type="${field.type}" id="${field.id}" name="${field.id}" placeholder="${field.placeholder || ''}" ${field.required ? 'required' : ''}>`;
                  break;
          }
          
          fieldHtml += `</div>`;
          return fieldHtml;
      }
      
      // 收集表單資料
      function collectFormData() {
          const formData = {};
          
          formFields.forEach(field => {
              const element = document.getElementById(field.id);
              
              if (field.type === 'radio') {
                  const radioElements = document.querySelectorAll(`input[name="${field.id}"]:checked`);
                  formData[field.id] = radioElements.length > 0 ? radioElements[0].value : '';
              } else if (field.type === 'checkbox') {
                  const checkboxElements = document.querySelectorAll(`input[name="${field.id}"]:checked`);
                  const values = Array.from(checkboxElements).map(cb => cb.value);
                  formData[field.id] = values.join(', ');
              } else if (element) {
                  formData[field.id] = element.value;
              }
          });
          
          return formData;
      }
      
      // 驗證表單
      function validateForm(formData) {
          for (let field of formFields) {
              if (field.required && (!formData[field.id] || formData[field.id].trim() === '')) {
                  return { valid: false, message: `請填寫 ${field.label}` };
              }
              
              // 特殊驗證
              if (field.id === 'phone' && formData[field.id]) {
                  const phoneRegex = /^09\d{8}$/;
                  if (!phoneRegex.test(formData[field.id].replace(/\D/g, ''))) {
                      return { valid: false, message: '請輸入正確的手機號碼格式 (09xxxxxxxx)' };
                  }
              }
              
              if (field.id === 'email' && formData[field.id]) {
                  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                  if (!emailRegex.test(formData[field.id])) {
                      return { valid: false, message: '請輸入正確的 Email 格式' };
                  }
              }
          }
          
          return { valid: true };
      }
      
      // 提交表單
      async function submitForm(formData) {
          try {
              const response = await fetch(`${GAS_URL}?action=submitRegistration&userId=${userId}&category=${category}&formData=${encodeURIComponent(JSON.stringify(formData))}`);
              const data = await response.json();
              
              if (data.success) {
                  showSuccess(`🎉 ${data.message}\n報名序號：${data.registrationId}`);
                  document.getElementById('submitBtn').disabled = true;
                  document.getElementById('submitBtn').textContent = '✅ 報名完成';
                  
                  // 3秒後關閉 LIFF 視窗
                  setTimeout(() => {
                      liff.closeWindow();
                  }, 3000);
              } else {
                  showError(data.error || '報名失敗，請稍後再試');
              }
          } catch (error) {
              console.error('提交報名失敗:', error);
              showError('系統錯誤，請稍後再試');
          }
      }
      
      // 顯示錯誤訊息
      function showError(message) {
          const errorDiv = document.getElementById('errorMessage');
          errorDiv.textContent = message;
          errorDiv.style.display = 'block';
          document.getElementById('successMessage').style.display = 'none';
      }
      
      // 顯示成功訊息
      function showSuccess(message) {
          const successDiv = document.getElementById('successMessage');
          successDiv.textContent = message;
          successDiv.style.display = 'block';
          document.getElementById('errorMessage').style.display = 'none';
      }
      
      // 隱藏訊息
      function hideMessages() {
          document.getElementById('errorMessage').style.display = 'none';
          document.getElementById('successMessage').style.display = 'none';
      }
      
      // 表單提交事件處理
      document.getElementById('registrationForm').addEventListener('submit', async function(e) {
          e.preventDefault();
          
          hideMessages();
          
          // 收集表單資料
          const formData = collectFormData();
          
          // 驗證表單
          const validation = validateForm(formData);
          if (!validation.valid) {
              showError(validation.message);
              return;
          }
          
          // 顯示載入狀態
          document.getElementById('loadingIndicator').style.display = 'block';
          document.getElementById('submitBtn').disabled = true;
          
          try {
              await submitForm(formData);
          } finally {
              document.getElementById('loadingIndicator').style.display = 'none';
              document.getElementById('submitBtn').disabled = false;
          }
      });
      
      // 頁面載入時初始化
      document.addEventListener('DOMContentLoaded', function() {
          initializeLiff();
      });
  </script>
</body>
</html>
