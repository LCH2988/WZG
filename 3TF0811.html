<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>三鐵飛翔好活動 - 線上報名</title>
  <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
          font-family: 'Microsoft JhengHei', Arial, sans-serif;
          background: linear-gradient(135deg, #FF6B35, #F7931E);
          min-height: 100vh;
          padding: 20px;
          font-size: 16px;
      }
      .container {
          max-width: 800px;
          margin: 0 auto;
          background: white;
          border-radius: 15px;
          box-shadow: 0 10px 30px rgba(0,0,0,0.3);
          overflow: hidden;
      }
      .event-header {
          background: linear-gradient(135deg, #FF6B35, #F7931E);
          color: white;
          padding: 30px;
          text-align: center;
      }
      .event-header h1 {
          font-size: 2em;
          margin-bottom: 10px;
      }
      .event-header p {
          font-size: 1.1em;
          opacity: 0.9;
      }
      .status-info {
          background: #f0f8ff;
          padding: 15px;
          margin: 20px;
          border-radius: 10px;
          border-left: 5px solid #4169E1;
      }
      .status-success { border-left-color: #28a745; background: #d4edda; }
      .status-error { border-left-color: #dc3545; background: #f8d7da; }
      .status-warning { border-left-color: #ffc107; background: #fff3cd; }
      .event-info {
          background: #f8f9fa;
          padding: 20px;
          margin: 20px;
          border-radius: 10px;
          border-left: 5px solid #FF6B35;
      }
      .event-info h3 {
          color: #FF6B35;
          margin-bottom: 15px;
      }
      .info-grid {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
          gap: 15px;
      }
      .info-item {
          display: flex;
          align-items: center;
          padding: 10px;
          background: white;
          border-radius: 8px;
      }
      .info-item strong {
          min-width: 80px;
          color: #333;
      }
      .form-section { padding: 30px; }
      .form-row {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 20px;
          margin-bottom: 20px;
      }
      .form-group { margin-bottom: 20px; }
      .form-group.full-width { grid-column: 1 / -1; }
      .form-group label {
          display: block;
          margin-bottom: 8px;
          font-weight: bold;
          color: #333;
      }
      .required { color: #DC143C; }
      input[type="text"], input[type="tel"], input[type="email"], input[type="date"], select, textarea {
          width: 100%;
          padding: 12px 15px;
          border: 2px solid #ddd;
          border-radius: 8px;
          font-size: 14px;
          transition: border-color 0.3s;
      }
      input:focus, select:focus, textarea:focus {
          outline: none;
          border-color: #FF6B35;
          box-shadow: 0 0 5px rgba(255,107,53,0.3);
      }
      .radio-group, .checkbox-group {
          display: flex;
          gap: 15px;
          flex-wrap: wrap;
      }
      .radio-item, .checkbox-item {
          display: flex;
          align-items: center;
          gap: 5px;
      }
      textarea { min-height: 80px; resize: vertical; }
      .registration-status {
          background: linear-gradient(135deg, #e3f2fd, #bbdefb);
          padding: 20px;
          margin: 20px;
          border-radius: 10px;
          text-align: center;
      }
      .status-full {
          background: linear-gradient(135deg, #ffebee, #ffcdd2);
          color: #c62828;
      }
      .status-available {
          background: linear-gradient(135deg, #e8f5e8, #c8e6c9);
          color: #2e7d32;
      }
      .submit-btn {
          background: linear-gradient(135deg, #FF6B35, #F7931E);
          color: white;
          padding: 15px 40px;
          border: none;
          border-radius: 10px;
          font-size: 1.2em;
          font-weight: bold;
          cursor: pointer;
          width: 100%;
          transition: all 0.3s;
          margin-top: 20px;
      }
      .submit-btn:hover {
          transform: translateY(-2px);
          box-shadow: 0 5px 15px rgba(255,107,53,0.4);
      }
      .submit-btn:disabled {
          background: #ccc;
          cursor: not-allowed;
          transform: none;
      }
      .modal {
          display: none;
          position: fixed;
          top: 0; left: 0; width: 100%; height: 100%;
          background: rgba(0,0,0,0.5);
          z-index: 1000;
      }
      .modal-content {
          position: absolute;
          top: 50%; left: 50%;
          transform: translate(-50%, -50%);
          background: white;
          padding: 30px;
          border-radius: 15px;
          text-align: center;
          max-width: 500px; width: 90%;
      }
      .success-icon { font-size: 3em; margin-bottom: 20px; }
      .confirmed { color: #28a745; }
      .waitlist { color: #ffc107; }
      .modal-btn {
          margin-top: 20px;
          padding: 12px 30px;
          background: #FF6B35;
          color: white;
          border: none;
          border-radius: 8px;
          cursor: pointer;
          font-size: 1.1em;
      }
      .loading {
          display: inline-block;
          width: 20px; height: 20px;
          border: 3px solid rgba(255, 255, 255, .3);
          border-radius: 50%;
          border-top-color: #fff;
          animation: spin 1s ease-in-out infinite;
          margin-left: 10px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (max-width: 768px) {
          .form-row { grid-template-columns: 1fr; }
          .radio-group, .checkbox-group { flex-direction: column; }
          .info-grid { grid-template-columns: 1fr; }
      }
  </style>
</head>
<body>
  <div class="container">
      <div class="event-header">
          <h1>🏊‍♂️ 三鐵飛翔好活動</h1>
          <p>游泳 1.5km + 自行車 40km + 路跑 10km</p>
      </div>

      <div class="event-info">
          <h3>📋 活動資訊</h3>
          <div class="info-grid">
              <div class="info-item">
                  <strong>📅 日期：</strong>
                  <span>2025年9月15日</span>
              </div>
              <div class="info-item">
                  <strong>📍 地點：</strong>
                  <span>台北大佳河濱公園</span>
              </div>
              <div class="info-item">
                  <strong>💰 費用：</strong>
                  <span>NT$ 1,500</span>
              </div>
              <div class="info-item">
                  <strong>👥 名額：</strong>
                  <span>限額 50 人</span>
              </div>
          </div>
      </div>

      <div id="liffStatus" class="status-info">
          <div>🔄 正在初始化...</div>
      </div>

      <div id="registrationStatus" class="registration-status" style="display: none;">
          <h3 id="statusTitle">報名狀態</h3>
          <p id="statusMessage">載入中...</p>
      </div>

      <div class="form-section">
          <form id="registrationForm">
              <div class="form-row">
                  <div class="form-group">
                      <label for="name">姓名 <span class="required">*</span></label>
                      <input type="text" id="name" name="name" required>
                  </div>
                  <div class="form-group">
                      <label for="gender">性別 <span class="required">*</span></label>
                      <select id="gender" name="gender" required>
                          <option value="">請選擇</option>
                          <option value="男">男</option>
                          <option value="女">女</option>
                      </select>
                  </div>
              </div>

              <div class="form-row">
                  <div class="form-group">
                      <label for="phone">手機號碼</label>
                      <input type="tel" id="phone" name="phone" pattern="09\d{8}" required>
                  </div>
                  <div class="form-group">
                      <label for="email">Email </label>
                      <input type="email" id="email" name="email" required>
                  </div>
              </div>

              <div class="form-row">
                  <div class="form-group">
                      <label for="emergencyContact">緊急聯絡人 </label>
                      <input type="text" id="emergencyContact" name="emergencyContact" required>
                  </div>
                  <div class="form-group">
                      <label for="emergencyPhone">緊急聯絡電話 </label>
                      <input type="tel" id="emergencyPhone" name="emergencyPhone" required>
                  </div>
              </div>

              <div class="form-row">
                  <div class="form-group">
                      <label for="idNumber">身分證字號 </label>
                      <input type="text" id="idNumber" name="idNumber" pattern="[A-Z][12]\d{8}" required>
                  </div>
                  <div class="form-group">
                      <label for="birthday">生日 </label>
                      <input type="date" id="birthday" name="birthday" required>
                  </div>
              </div>

              <div class="form-row">
                  <div class="form-group">
                      <label for="tshirtSize">T恤尺寸 <span class="required">*</span></label>
                      <select id="tshirtSize" name="tshirtSize" >
                          <option value="">請選擇</option>
                          <option value="XS">XS</option>
                          <option value="S">S</option>
                          <option value="M">M</option>
                          <option value="L">L</option>
                          <option value="XL">XL</option>
                          <option value="2XL">2XL</option>
                          <option value="3XL">3XL</option>
                      </select>
                  </div>
                  <div class="form-group">
                      <label for="dietaryRequirements">飲食需求</label>
                      <select id="dietaryRequirements" name="dietaryRequirements">
                          <option value="">無特殊需求</option>
                          <option value="素食">素食</option>
                          <option value="蛋奶素">蛋奶素</option>
                          <option value="清真">清真</option>
                          <option value="其他">其他（請在備註說明）</option>
                      </select>
                  </div>
              </div>

              <div class="form-group full-width">
                  <label for="remarks">備註</label>
                  <textarea id="remarks" name="remarks" placeholder="如有特殊需求或其他事項，請在此說明..."></textarea>
              </div>

              <button type="button" class="submit-btn" id="submitBtn" onclick="validateAndSubmit()">
                  🏃‍♂️ 確認報名
              </button>
          </form>
      </div>
  </div>

  <!-- 成功/候補訊息彈窗 -->
  <div id="resultModal" class="modal">
      <div class="modal-content">
          <div id="resultIcon" class="success-icon">🎉</div>
          <h3 id="resultTitle">報名成功！</h3>
          <p id="resultMessage">恭喜您成功報名三鐵飛翔好活動！</p>
          <p id="resultDetails"></p>
          <button class="modal-btn" onclick="closeModal('resultModal')">確定</button>
      </div>
  </div>

  <!-- LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
      let liffReady = false;
      let userProfile = null;
      let isSubmitting = false;

      document.addEventListener('DOMContentLoaded', function() {
          const liffId = "2007905012-o1yDNa92";
          
          // LIFF 初始化
          liff.init({ liffId })
              .then(() => {
                  liffReady = true;
                  updateStatus('✅ LIFF 初始化成功', 'success');
                  
                  if (liff.isLoggedIn()) {
                      return liff.getProfile();
                  } else {
                      liff.login();
                      return null;
                  }
              })
              .then((profile) => {
                  if (profile) {
                      userProfile = profile;
                      updateStatus(`✅ 使用者：${profile.displayName}`, 'success');
                  }
                  
                  // 載入報名狀態
                  loadRegistrationStatus();
                  restoreFormData();
              })
              .catch((err) => {
                  console.error('LIFF 初始化失敗:', err);
                  updateStatus('❌ LIFF 初始化失敗: ' + err.message, 'error');
              });

          // 表單自動儲存
          const formInputs = document.querySelectorAll('#registrationForm input, #registrationForm select, #registrationForm textarea');
          formInputs.forEach(input => {
              input.addEventListener('change', autoSaveForm);
          });
      });

      // 載入報名狀態
      async function loadRegistrationStatus() {
          try {
              const gasUrl = 'https://script.google.com/macros/s/AKfycbz_xcHRzItn5pktHR9XeuzP7GGHTv07_UWBFn-9Us1NlDSWDHGHowZYTPcbTNkS7RuM/exec';
              const response = await fetch(gasUrl);
              const data = await response.json();
              
              const statusDiv = document.getElementById('registrationStatus');
              const titleEl = document.getElementById('statusTitle');
              const messageEl = document.getElementById('statusMessage');
              
              const availableSpots = Math.max(0, data.maxParticipants - data.currentRegistrations);
              
              if (availableSpots > 0) {
                  statusDiv.className = 'registration-status status-available';
                  titleEl.textContent = '✅ 開放報名中';
                  messageEl.textContent = `還有 ${availableSpots} 個名額，請把握機會！`;
              } else {
                  statusDiv.className = 'registration-status status-full';
                  titleEl.textContent = '❌ 報名已滿';
                  messageEl.textContent = `目前有 ${data.waitlistCount} 人候補中，仍可報名候補`;
              }
              
              statusDiv.style.display = 'block';
              
          } catch (error) {
              console.error('載入報名狀態失敗:', error);
          }
      }

      // 表單驗證與提交
      async function validateAndSubmit() {
          if (isSubmitting) return;
          
          // 驗證必要欄位
          // const requiredFields = ['name', 'gender', 'phone', 'email', 'emergencyContact', 'emergencyPhone', 'idNumber', 'birthday', 'tshirtSize'];
          const requiredFields = ['name', 'gender'];

          for (const field of requiredFields) {
              const element = document.getElementById(field);
              if (!element.value.trim()) {
                  alert(`請填寫 ${element.previousElementSibling.textContent.replace(' *', '')}`);
                  element.focus();
                  return;
              }
          }
          
          // 驗證手機格式
          const phone = document.getElementById('phone').value;
          if (!/^09\d{8}$/.test(phone)) {
              alert('請輸入正確的手機號碼格式（09xxxxxxxx）');
              return;
          }
          
          // 驗證身分證格式
          const idNumber = document.getElementById('idNumber').value.toUpperCase();
          if (!/^[A-Z][12]\d{8}$/.test(idNumber)) {
              alert('請輸入正確的身分證字號格式');
              return;
          }
          
          // 驗證Email格式
          const email = document.getElementById('email').value;
          if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
              alert('請輸入正確的Email格式');
              return;
          }
          
          await submitRegistration();
      }

      // 提交報名
      async function submitRegistration() {
          isSubmitting = true;
          const submitBtn = document.getElementById('submitBtn');
          const originalText = submitBtn.textContent;
          
          submitBtn.disabled = true;
          submitBtn.innerHTML = '報名中... <span class="loading"></span>';
          
          try {
              const formData = {
                  name: document.getElementById('name').value.trim(),
                  gender: document.getElementById('gender').value,
                  phone: document.getElementById('phone').value.trim(),
                  email: document.getElementById('email').value.trim(),
                  emergencyContact: document.getElementById('emergencyContact').value.trim(),
                  emergencyPhone: document.getElementById('emergencyPhone').value.trim(),
                  idNumber: document.getElementById('idNumber').value.trim().toUpperCase(),
                  birthday: document.getElementById('birthday').value,
                  tshirtSize: document.getElementById('tshirtSize').value,
                  dietaryRequirements: document.getElementById('dietaryRequirements').value,
                  remarks: document.getElementById('remarks').value.trim(),
                  liffUserId: userProfile?.userId || '',
                  liffDisplayName: userProfile?.displayName || '',
                  source: 'liff_form'
              };

              const gasUrl = 'https://script.google.com/macros/s/AKfycbyPt0DcY_FYjAbtiGFu33LZGMLeiaxAmTw-cdAlyE2Y7aZBb5kucAM7xm6UMP0qbKC8/exec';
              
              const response = await fetch(gasUrl, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify(formData),
                  mode: 'no-cors'
              });

              // 由於 no-cors 模式，假設成功並顯示結果
              showSuccessModal('confirmed', 1);
              clearSavedFormData();
              resetForm();
              
          } catch (error) {
              console.error('報名失敗:', error);
              alert('報名提交失敗，請稍後再試或聯繫主辦單位');
          } finally {
              isSubmitting = false;
              submitBtn.disabled = false;
              submitBtn.textContent = originalText;
          }
      }

      // 顯示結果彈窗
      function showSuccessModal(status, position) {
          const modal = document.getElementById('resultModal');
          const icon = document.getElementById('resultIcon');
          const title = document.getElementById('resultTitle');
          const message = document.getElementById('resultMessage');
          const details = document.getElementById('resultDetails');
          
          if (status === 'confirmed') {
              icon.textContent = '🎉';
              icon.className = 'success-icon confirmed';
              title.textContent = '報名成功！';
              message.textContent = '恭喜您成功報名三鐵飛翔好活動！';
              details.textContent = `您是第 ${position} 位報名者，請準時參加活動。`;
          } else {
              icon.textContent = '⏳';
              icon.className = 'success-icon waitlist';
              title.textContent = '已加入候補名單';
              message.textContent = '目前報名已滿，您已成功加入候補名單。';
              details.textContent = `候補順位第 ${position} 位，如有名額釋出將依序通知您。`;
          }
          
          modal.style.display = 'block';
      }

      // 輔助函數
      function updateStatus(message, type = 'info') {
          const statusDiv = document.getElementById('liffStatus');
          statusDiv.className = `status-info status-${type}`;
          statusDiv.innerHTML = `<div>${message}</div>`;
      }

      function autoSaveForm() {
          try {
              const formData = {};
              const inputs = document.querySelectorAll('#registrationForm input, #registrationForm select, #registrationForm textarea');
              inputs.forEach(input => {
                  formData[input.name] = input.value;
              });
              formData.timestamp = new Date().toISOString();
              localStorage.setItem('triathlonFormData', JSON.stringify(formData));
          } catch (error) {
              console.error('自動儲存失敗:', error);
          }
      }

      function restoreFormData() {
          try {
              const savedData = localStorage.getItem('triathlonFormData');
              if (savedData) {
                  const formData = JSON.parse(savedData);
                  const savedTime = new Date(formData.timestamp);
                  const currentTime = new Date();
                  const hoursDiff = (currentTime - savedTime) / (1000 * 60 * 60);
                  
                  if (hoursDiff < 24) {
                      Object.keys(formData).forEach(key => {
                          if (key !== 'timestamp') {
                              const element = document.getElementById(key);
                              if (element) element.value = formData[key];
                          }
                      });
                  } else {
                      clearSavedFormData();
                  }
              }
          } catch (error) {
              console.error('恢復表單資料失敗:', error);
          }
      }

      function clearSavedFormData() {
          try {
              localStorage.removeItem('triathlonFormData');
          } catch (error) {
              console.error('清除儲存資料失敗:', error);
          }
      }

      function resetForm() {
          document.getElementById('registrationForm').reset();
      }

      function closeModal(modalId) {
          document.getElementById(modalId).style.display = 'none';
      }

      // 點擊彈窗外部關閉
      window.onclick = function(event) {
          const modals = document.getElementsByClassName('modal');
          for (let i = 0; i < modals.length; i++) {
              if (event.target == modals[i]) {
                  modals[i].style.display = 'none';
              }
          }
      };
  </script>
</body>
</html>
