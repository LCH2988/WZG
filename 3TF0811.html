
// ============================ index.html ============================
// 檔名：index (HTML 檔)
/*
  說明：
  1. 將 LIFF_ID 替換為你的 LIFF ID
  2. PUBLIC_API_KEY 自 Script Properties 注入
*/
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>活動報名系統</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body { font-family:"Helvetica Neue",Arial,sans-serif; margin:0; background:#f5f7fa; color:#222; }
    header { background:#0d47a1; color:#fff; padding:14px 20px; font-size:18px; font-weight:600; }
    .container { max-width:980px; margin:0 auto; padding:16px; }
    .grid { display:grid; gap:16px; grid-template-columns: repeat(auto-fill,minmax(250px,1fr)); }
    .card { background:#fff; border-radius:12px; padding:16px; position:relative; box-shadow:0 4px 12px rgba(0,0,0,.08); border:1px solid #e0e0e0; display:flex; flex-direction:column; }
    .card h3 { margin:0 0 8px; font-size:18px; color:#0d47a1; }
    .tag-row { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:6px; }
    .tag { background:#e3f2fd; color:#0d47a1; font-size:11px; padding:2px 6px; border-radius:6px; }
    .meta { font-size:13px; line-height:1.4; margin-bottom:8px; }
    .desc { font-size:13px; color:#555; flex:1; margin-bottom:12px; }
    .btn-row { display:flex; gap:8px; flex-wrap:wrap; }
    a.btn, button.btn { background:#1976d2; color:#fff; padding:8px 14px; border-radius:8px; text-decoration:none; font-size:14px; border:none; cursor:pointer; transition:.2s; }
    a.btn.outline { background:#fff; color:#1976d2; border:1px solid #1976d2; }
    a.btn:hover, button.btn:hover { opacity:.9; transform:translateY(-2px); }
    .form-section { background:#fff; padding:18px 20px 24px; border-radius:12px; box-shadow:0 4px 12px rgba(0,0,0,.08); border:1px solid #e0e0e0; margin-bottom:20px; }
    .form-section h2 { margin:0 0 14px; font-size:20px; color:#0d47a1; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
    .badge { background:#ffecb3; color:#795548; padding:2px 6px; font-size:11px; border-radius:6px; }
    label { display:block; font-size:13px; font-weight:600; margin:14px 0 4px; }
    .radio-group { display:flex; flex-wrap:wrap; gap:14px; }
    input[type=text] { width:100%; padding:10px 12px; font-size:14px; border:1px solid #cfd8dc; border-radius:8px; background:#fafafa; }
    input[type=text]:focus { outline:none; border-color:#1976d2; box-shadow:0 0 0 2px rgba(25,118,210,.2); background:#fff; }
    .name-fields { display:flex; flex-direction:column; gap:10px; margin-top:8px; }
    .status-box { background:#e3f2fd; border:1px solid #bbdefb; padding:12px 14px; border-radius:10px; font-size:13px; line-height:1.6; margin-top:16px; white-space:pre-line; display:none; }
    .group-stat { font-size:12px; background:#f1f8e9; padding:4px 6px; border-radius:6px; margin:2px 4px 2px 0; color:#33691e; }
    .table-section { background:#fff; padding:16px; border-radius:12px; box-shadow:0 4px 12px rgba(0,0,0,.06); border:1px solid #e0e0e0; margin-bottom:20px; }
    .table-section h3 { margin:0 0 10px; font-size:16px; color:#0d47a1; }
    .list-block { background:#fafafa; border:1px solid #e0e0e0; padding:10px 12px; font-size:13px; line-height:1.6; white-space:pre-line; border-radius:8px; }
    .loader { text-align:center; padding:40px 0; color:#607d8b; }
    .footer { text-align:center; font-size:12px; color:#78909c; margin:40px 0 20px; }
    .cancel-box { margin-top:24px; border-top:1px dashed #ccc; padding-top:16px; }
    .inline { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .notice-deadline { color:#d32f2f; font-size:12px; }
  </style>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
  <header>活動報名系統</header>
  <div class="container" id="app">載入中...</div>
  <div class="footer">&copy; 2025 活動報名系統</div>
  <script>
    const PAGE_MODE = '<?= page ?>';
    const EVENT_ID = '<?= eventId ?>';
    const API_BASE = '<?= ScriptApp.getService().getUrl() ?>';
    const API_KEY = '<?= publicKey ?>';
    const LIFF_ID = '2007905012-o1yDNa92';
    const GROUPS = ['登山組','單車組','跑步組','水上組'];
    let liffProfile = null;

    function q(sel){ return document.querySelector(sel); }
    function qs(sel){ return Array.from(document.querySelectorAll(sel)); }
    function j(url,opt){ return fetch(url,opt).then(r=>r.json()); }

    async function initLIFF(){
      if (typeof liff === 'undefined') return;
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) { liff.login(); return; }
        liffProfile = await liff.getProfile();
      } catch(e){
        console.warn('LIFF 初始化失敗', e);
      }
    }

    function renderEventCard(ev){
      const desc = (ev.Description||'').slice(0,60);
      const regUrl = `${API_BASE}?page=register&eventId=${encodeURIComponent(ev.EventID)}`;
      const statsUrl = `${API_BASE}?page=stats&eventId=${encodeURIComponent(ev.EventID)}`;
      const deadlineInfo = ev.Deadline ? `<span class="tag" style="background:#ffebee;color:#c62828;">截止:${ev.Deadline}</span>` : '';
      return `
        <div class="card">
          <h3>${ev.Title}</h3>
          <div class="tag-row">
            <span class="tag">${ev.EventID}</span>
            <span class="tag">${ev.Date}</span>
            ${deadlineInfo}
          </div>
          <div class="meta">
            時間: ${ev.StartTime||''} - ${ev.EndTime||''}<br>
            地點: ${ev.Location||''}
          </div>
          <div class="desc">${desc}${(ev.Description||'').length>60?'...':''}</div>
          <div class="btn-row">
            <a class="btn" href="${regUrl}">我要報名</a>
            <a class="btn outline" href="${statsUrl}">查看名單</a>
          </div>
        </div>
      `;
    }

    async function renderEventsPage(){
      const root = q('#app');
      root.innerHTML = '<div class="loader">載入活動中...</div>';
      try {
        const data = await j(`${API_BASE}?action=events`);
        if (!data.success) {
          root.innerHTML = '<p>無法取得活動</p>'; return;
        }
        if (!data.events.length) {
          root.innerHTML = '<p>目前沒有開放中的活動。</p>'; return;
        }
        root.innerHTML = `<div class="grid">${data.events.map(renderEventCard).join('')}</div>`;
      } catch(e){
        console.error(e);
        root.innerHTML = '<p>載入錯誤</p>';
      }
    }

    // 相容舊名稱
    function loadActivities(){ return renderEventsPage(); }

    async function renderRegisterPage(eventId){
      const root = q('#app');
      if (!eventId){ root.innerHTML='<p>未指定活動ID</p>'; return; }
      root.innerHTML = '<div class="loader">載入活動資料...</div>';
      const data = await j(`${API_BASE}?action=event&eventId=${encodeURIComponent(eventId)}`);
      if (!data.success){ root.innerHTML='<p>活動不存在</p>'; return; }
      const ev = data.event;
      const radios = GROUPS.map(g=>`<label><input type="radio" name="groupType" value="${g}"> ${g} (名額:${ev.Capacities[g]||0})</label>`).join('');
      const deadlineNote = ev.Deadline ? `<div class="notice-deadline">報名截止：${ev.Deadline}</div>` : '';
      root.innerHTML = `
        <div class="form-section">
          <h2>${ev.Title} <span class="badge">${ev.EventID}</span></h2>
          <div style="font-size:13px;line-height:1.6;margin-bottom:12px;">
            日期:${ev.Date}<br>
            時間:${ev.StartTime||''}-${ev.EndTime||''}<br>
            地點:${ev.Location||''}<br>
            ${deadlineNote}
            <small style="color:#555;">${ev.Description||''}</small>
          </div>
          <label>選擇組別</label>
          <div class="radio-group">${radios}</div>
          <label>報名模式</label>
          <div class="radio-group">
            <label><input type="radio" name="mode" value="single" checked> 個人</label>
            <label><input type="radio" name="mode" value="multi"> 多人(最多3人)</label>
          </div>
          <div id="nameFields" class="name-fields">
            <div>
              <label>姓名(1)</label>
              <input type="text" name="name1" placeholder="請輸入姓名">
            </div>
          </div>
          <div class="inline">
            <button class="btn outline" onclick="addNameField()">新增姓名欄位</button>
            <button class="btn" onclick="submitRegistration('${ev.EventID}')">送出報名</button>
          </div>
          <small style="color:#666;">多人報名：最多 3 位，請勿重複填寫。</small>
          <div id="statusBox" class="status-box"></div>
          <div class="cancel-box">
            <h3 style="margin:0 0 8px;font-size:15px;color:#0d47a1;">取消報名 / 遞補</h3>
            <div class="inline" style="gap:6px;">
              <input type="text" id="cancelName" placeholder="輸入要取消的姓名" style="max-width:180px;">
              <button class="btn outline" onclick="cancelReg('${ev.EventID}')">取消該姓名</button>
            </div>
            <small style="color:#666;">取消後若有人候補，系統自動遞補。</small>
          </div>
        </div>
      `;
      qs('input[name=mode]').forEach(r=>{
        r.addEventListener('change', ()=>{
          const mode = q('input[name=mode]:checked').value;
          const nf = q('#nameFields');
          nf.innerHTML = `
            <div>
              <label>姓名(1)</label>
              <input type="text" name="name1" placeholder="請輸入姓名">
            </div>
          `;
        });
      });
    }

    function addNameField(){
      const mode = q('input[name=mode]:checked')?.value;
      if (mode!=='multi') return;
      const nf = q('#nameFields');
      const count = nf.querySelectorAll('input[type=text]').length;
      if (count >=3) { alert('最多三位'); return; }
      const idx = count + 1;
      const div = document.createElement('div');
      div.innerHTML = `
        <label>姓名(${idx})</label>
        <input type="text" name="name${idx}" placeholder="請輸入姓名">
      `;
      nf.appendChild(div);
    }

    async function submitRegistration(eventId){
      const groupType = q('input[name=groupType]:checked')?.value;
      if (!groupType){ alert('請選擇組別'); return; }
      const mode = q('input[name=mode]:checked').value;
      const names = Array.from(q('#nameFields').querySelectorAll('input[type=text]'))
        .map(i=>i.value.trim()).filter(v=>v);
      if (!names.length){ alert('請輸入姓名'); return; }
      if (mode==='single' && names.length!==1){ alert('個人模式僅能一人'); return; }
      if (mode==='multi' && names.length>3){ alert('最多三人'); return; }
      const statusBox = q('#statusBox');
      statusBox.style.display='block';
      statusBox.textContent='送出中...';
      const payload = {
        apiKey: API_KEY,
        eventId,
        groupType,
        names,
        primaryUserLineId: liffProfile ? liffProfile.userId : '',
        primaryUserDisplayName: liffProfile ? liffProfile.displayName : ''
      };
      try {
        const res = await fetch(`${API_BASE}?action=register`, {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify(payload)
        }).then(r=>r.json());
        if (!res.success){
          statusBox.textContent='報名失敗：'+res.message;
          return;
        }
        let msg='報名成功！\\n';
        res.results.forEach(r=>{
          msg += `${r.name} => ${r.status==='CONFIRMED'?'正選 #'+r.sequenceNumber:'候補 #'+r.waitlistNumber}\\n`;
        });
        statusBox.textContent = msg;
        if (window.liff && liff.isInClient()){
          try {
            await liff.sendMessages([{
              type:'text',
              text:`[報名成功]\\n活動:${eventId}\\n組別:${groupType}\\n` +
                res.results.map(r=>`${r.name}:${r.status==='CONFIRMED'?'正選#'+r.sequenceNumber:'候補#'+r.waitlistNumber}`).join(' / ')
            }]);
          } catch(e){ console.warn('sendMessages 失敗', e); }
        }
        alert('已完成');
      } catch(e){
        console.error(e);
        statusBox.textContent='系統錯誤';
      }
    }

    async function cancelReg(eventId){
      const groupType = q('input[name=groupType]:checked')?.value;
      if (!groupType){ alert('請先選擇組別以便取消'); return; }
      const name = q('#cancelName').value.trim();
      if (!name){ alert('請輸入要取消的姓名'); return; }
      const statusBox = q('#statusBox');
      statusBox.style.display='block';
      statusBox.textContent='取消中...';
      const payload = {
        apiKey: API_KEY,
        eventId,
        groupType,
        name,
        primaryUserLineId: liffProfile ? liffProfile.userId : ''
      };
      try {
        const res = await fetch(`${API_BASE}?action=cancel`, {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify(payload)
        }).then(r=>r.json());
        if (!res.success){
          statusBox.textContent='取消失敗：'+res.message;
          return;
        }
        statusBox.textContent = '取消成功' + (res.promoted ? '\\n已遞補一位候補。' : '');
        alert('已取消。重新整理名單可看到變化。');
      } catch(e){
        console.error(e);
        statusBox.textContent='系統錯誤';
      }
    }

    async function renderStatsPage(eventId){
      const root = q('#app');
      if (!eventId){ root.innerHTML='<p>未指定活動ID</p>'; return; }
      root.innerHTML='<div class="loader">載入統計...</div>';
      const data = await j(`${API_BASE}?action=stats&eventId=${encodeURIComponent(eventId)}`);
      if (!data.success){ root.innerHTML='<p>無法取得名單</p>'; return; }
      const ev = data.event;
      const stats = data.stats;
      let html = `
        <div class="form-section">
          <h2>${ev.Title} <span class="badge">${ev.EventID}</span></h2>
          <div style="font-size:13px;line-height:1.6;margin-bottom:10px;">
            日期:${ev.Date} 時間:${ev.StartTime||''}-${ev.EndTime||''}<br>
            地點:${ev.Location||''}<br>
            ${ev.Deadline ? '<span class="notice-deadline">截止:'+ev.Deadline+'</span><br>' : ''}
            <small style="color:#555;">${ev.Description||''}</small>
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:8px;">
            ${
              GROUPS.map(g=>{
                const gs = stats.groups[g];
                return `<div class="group-stat">${g} 正選:${gs.confirmed} 候補:${gs.waitlist}</div>`;
              }).join('')
            }
          </div>
        </div>
      `;
      GROUPS.forEach(g=>{
        const gstat = stats.groups[g];
        html += `
          <div class="table-section">
            <h3>${g} 正選名單</h3>
            <div class="list-block">
              ${
                gstat.confirmedList.length
                  ? gstat.confirmedList.map(x=>`${x.sequence}. ${x.name}`).join('\\n')
                  : '(無)'
              }
            </div>
          </div>
          <div class="table-section">
            <h3>${g} 候補名單</h3>
            <div class="list-block">
              ${
                gstat.waitlistList.length
                  ? gstat.waitlistList.map(x=>`${x.sequence}. ${x.name}`).join('\\n')
                  : '(無)'
              }
            </div>
          </div>
        `;
      });
      root.innerHTML = html;
    }

    async function main(){
      await initLIFF();
      switch (PAGE_MODE) {
        case 'events': renderEventsPage(); break;
        case 'register': renderRegisterPage(EVENT_ID); break;
        case 'stats': renderStatsPage(EVENT_ID); break;
        default: renderEventsPage();
      }
    }
    document.addEventListener('DOMContentLoaded', main);
  </script>
</body>
</html>
