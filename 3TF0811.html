
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>多活動報名（單列單類別）</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body { font-family:'Microsoft JhengHei', Arial; background:#eef3f7; margin:0; padding:20px;}
  .wrap { max-width:860px; margin:0 auto; background:#fff; padding:32px 34px 66px; border-radius:22px; box-shadow:0 10px 30px rgba(0,0,0,.12);}
  h1 { margin:0 0 8px; font-size:1.85rem; color:#0d47a1;}
  .status { padding:12px 16px; background:#e3f2fd; border-left:6px solid #1976d2; border-radius:10px; font-size:.92rem; }
  .row { margin-top:24px; }
  label { display:block; font-weight:bold; margin-bottom:8px; }
  select, input, textarea {
    width:100%; padding:14px 14px; border:2px solid #cfd8dc; background:#fafafa;
    border-radius:12px; font-size:1rem; transition:.25s;
  }
  select:focus, input:focus, textarea:focus { outline:none; border-color:#1976d2; background:#fff; box-shadow:0 0 0 3px rgba(25,118,210,.18);}
  .event-card-list { display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); margin-top:14px;}
  .ecard {
    background:#f7f9fa; border:2px solid #d0d7dd; border-radius:14px; padding:16px 14px;
    cursor:pointer; position:relative; min-height:140px; display:flex; flex-direction:column; justify-content:flex-start;
    transition:.3s;
  }
  .ecard.active { background:#1976d2; border-color:#1976d2; color:#fff; box-shadow:0 6px 22px rgba(25,118,210,.45);}
  .ecard h3 { margin:0 0 4px; font-size:1.05rem; line-height:1.3; }
  .badge-cat { display:inline-block; background:#0d47a1; color:#fff; font-size:.65rem; padding:2px 8px; border-radius:30px; margin-right:6px;}
  .small { font-size:.75rem; line-height:1.35; opacity:.85;}
  .remain { margin-top:auto; font-size:.8rem; font-weight:bold;}
  .submit-btn {
    margin-top:40px; width:100%; padding:20px 10px; font-size:1.3rem; font-weight:bold;
    background:linear-gradient(90deg,#1976d2,#26a69a); color:#fff; border:none; border-radius:18px;
    cursor:pointer; letter-spacing:.08em; box-shadow:0 10px 26px rgba(0,0,0,.22); transition:.35s;
  }
  .submit-btn:hover { transform:translateY(-4px); box-shadow:0 16px 34px rgba(0,0,0,.30); }
  .result { margin-top:34px; padding:18px 20px; background:#f1f8e9; border:2px solid #c5e1a5; color:#33691e; border-radius:14px; display:none; white-space:pre-wrap; font-size:.85rem;}
  textarea { min-height:150px; resize:vertical; }
  .toggle-batch { margin-top:22px; display:flex; align-items:center; gap:10px; font-size:.9rem;}
  @media (max-width:760px){
    .wrap { padding:26px 22px 60px; }
    h1 { font-size:1.55rem; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>多活動報名</h1>
    <div id="status" class="status">初始化中...</div>

    <div class="row">
      <label>選擇活動（每列即一個類別報名單位）</label>
      <div id="eventCards" class="event-card-list"></div>
    </div>

    <div class="row">
      <div class="toggle-batch">
        <input type="checkbox" id="batchMode" onchange="toggleBatch()"> 批次報名（每行 1 人）
      </div>
    </div>

    <div id="singleArea" class="row">
      <label>姓名 *</label>
      <input type="text" id="name" placeholder="輸入姓名">
    </div>

    <div id="batchArea" style="display:none;">
      <div class="row">
        <label>批次姓名清單 *</label>
        <textarea id="namesBatch" placeholder="每行 1 人&#10;王小明&#10;李小華&#10;張三"></textarea>
      </div>
    </div>

    <div class="row">
      <label>備註</label>
      <textarea id="remarks" placeholder="可填寫隊名 / 特殊需求..."></textarea>
    </div>

    <button class="submit-btn" onclick="submitForm()">送出報名</button>

    <div id="resultBox" class="result"></div>
  </div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
const liffId = "2007905012-o1yDNa92";
const API_BASE = "https://script.google.com/macros/s/AKfycbyC5mDSmfJ_xVGttaJxA2T6tu7yT5Yz2CxSv6ibQb2WQJfGgfRd70s-_jyztaBV8fP3/exec";
let events = [];
let selectedEventId = "";
let userProfile = null;

document.addEventListener("DOMContentLoaded", init);

async function init(){
  updateStatus("初始化 LIFF...");
  try{
    await liff.init({liffId});
    if(!liff.isLoggedIn()){ liff.login(); return; }
    userProfile = await liff.getProfile();
    updateStatus("歡迎，" + userProfile.displayName);
  }catch(e){
    updateStatus("LIFF 初始化失敗：" + e.message, true);
  }
  await loadEvents();
}

function updateStatus(msg, err=false){
  const s = document.getElementById('status');
  s.textContent = msg;
  s.style.background = err ? "#ffebee" : "#e3f2fd";
  s.style.borderLeftColor = err ? "#c62828" : "#1976d2";
}

async function loadEvents(){
  try{
    const res = await fetch(API_BASE + "?action=getEvents");
    const data = await res.json();
    events = data.events || [];
    renderEventCards();
    if(events.length===0){
      updateStatus("尚無啟用活動");
    }
  }catch(e){
    updateStatus("載入活動失敗：" + e.message, true);
  }
}

function renderEventCards(){
  const wrap = document.getElementById('eventCards');
  wrap.innerHTML = "";
  events.forEach(ev=>{
    const div = document.createElement('div');
    div.className = "ecard";
    div.dataset.id = ev.eventId;
    div.innerHTML = `
      <h3><span class="badge-cat">${ev.category}</span>${ev.name}</h3>
      <div class="small">${ev.date||""}</div>
      <div class="small">${ev.location||""}</div>
      <div class="small">${ev.description||""}</div>
      <div class="remain">剩餘：${ev.remain} / ${ev.capacity}</div>
    `;
    div.onclick = () => selectEvent(ev.eventId, div);
    wrap.appendChild(div);
  });
}

function selectEvent(id, el){
  document.querySelectorAll('.ecard').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  selectedEventId = id;
}

function toggleBatch(){
  const batch = document.getElementById('batchMode').checked;
  document.getElementById('singleArea').style.display = batch ? 'none':'block';
  document.getElementById('batchArea').style.display = batch ? 'block':'none';
}

async function submitForm(){
  if(!selectedEventId){ alert("請先選擇活動"); return; }
  const batch = document.getElementById('batchMode').checked;
  let payload;
  if(batch){
    const namesText = document.getElementById('namesBatch').value.trim();
    if(!namesText){ alert("請輸入批次姓名"); return; }
    payload = {
      action:"batchRegister",
      eventId:selectedEventId,
      namesText,
      remarks: document.getElementById('remarks').value.trim(),
      source:"liff_form",
      liffUserId: userProfile?.userId || "",
      liffDisplayName: userProfile?.displayName || ""
    };
  }else{
    const name = document.getElementById('name').value.trim();
    if(!name){ alert("請輸入姓名"); return; }
    payload = {
      action:"singleRegister",
      eventId:selectedEventId,
      name,
      remarks: document.getElementById('remarks').value.trim(),
      source:"liff_form",
      liffUserId: userProfile?.userId || "",
      liffDisplayName: userProfile?.displayName || ""
    };
  }
  updateStatus("送出中...");
  try{
    const res = await fetch(API_BASE,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload)
    });
    const data = await res.json();
    if(!data.success){
      updateStatus("失敗："+data.message, true);
      return;
    }
    showResult(data);
    updateStatus("完成");
    if(liff.isInClient()){
      try{
        await liff.sendMessages([{
          type:'text',
          text: batch
            ? `✅ 批次報名完成\n活動:${data.eventName}\n類別:${data.category}\n狀態:${data.status}\n筆數:${data.totalEntries}`
            : `✅ 報名完成\n活動:${data.eventName}\n類別:${data.category}\n姓名:${payload.name}\n狀態:${data.status}`
        }]);
      }catch(e){}
    }
    // 重載活動剩餘
    await loadEvents();
    // 保持選取
    if(selectedEventId){
      const targetCard = document.querySelector('.ecard[data-id="'+selectedEventId+'"]');
      if(targetCard) targetCard.classList.add('active');
    }
  }catch(e){
    updateStatus("錯誤："+e.message, true);
  }
}

function showResult(data){
  const box = document.getElementById('resultBox');
  box.style.display = 'block';
  box.textContent = JSON.stringify(data, null, 2);
}
</script>
</body>
</html>
