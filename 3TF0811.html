<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>登山活動報名系統</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body { font-family:'Microsoft JhengHei',Arial,sans-serif; background:linear-gradient(135deg,#667eea,#764ba2); margin:0; color:#333; }
    a { color:#667eea; }
    /* 公用 */
    .container { max-width:1200px; margin:0 auto; padding:20px; }
    .card { background:#fff; border-radius:16px; padding:1.6rem; box-shadow:0 6px 24px rgba(0,0,0,.08); margin-bottom:20px; }
    .btn { padding:9px 16px; border:none; border-radius:8px; cursor:pointer; font-size:.85rem; font-weight:600; background:#eee; }
    .btn-primary { background:#667eea; color:#fff; }
    .btn-primary:hover { background:#566cd6; }
    .btn-danger { background:#e74c3c; color:#fff; }
    .btn-danger:hover { background:#c0392b; }
    .btn-outline { background:#fff; border:2px solid #667eea; color:#667eea; }
    .btn-outline:hover { background:#667eea; color:#fff; }
    .alert { padding:12px 14px; border-radius:10px; font-size:.8rem; margin-bottom:12px; }
    .alert-success { background:#d4edda; color:#155724; }
    .alert-error { background:#f8d7da; color:#721c24; }
    .alert-info { background:#e3f2fd; color:#0d47a1; }
    .flex { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .hidden { display:none !important; }

    /* Header */
    .header { background:#fff; border-radius:16px; padding:2rem; text-align:center; box-shadow:0 6px 25px rgba(0,0,0,.12); }
    .header h1 { margin:0 0 .5rem; font-size:2.2rem; }

    /* Tabs (前台) */
    .nav-tabs { display:flex; gap:8px; background:rgba(255,255,255,.9); padding:6px; border-radius:12px; box-shadow:0 4px 16px rgba(0,0,0,.08); flex-wrap:wrap;}
    .nav-tab { flex:1; padding:12px 10px; background:transparent; border:none; cursor:pointer; font-weight:600; border-radius:10px; transition:.25s; font-size:.85rem; }
    .nav-tab.active { background:#667eea; color:#fff; }

    .tab-content { display:none; background:#fff; border-radius:16px; margin-top:18px; padding:1.6rem; box-shadow:0 6px 24px rgba(0,0,0,.08); }
    .tab-content.active { display:block; }

    /* 活動 */
    .activity-grid { display:grid; gap:1.2rem; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); margin-top:1rem; }
    .activity-card { background:#fff; border-radius:14px; padding:1rem 1.1rem 1.35rem; box-shadow:0 4px 16px rgba(0,0,0,.08); border-left:5px solid #667eea; display:flex; flex-direction:column; gap:.5rem; }
    .activity-card:hover { box-shadow:0 8px 22px rgba(0,0,0,.15); transform:translateY(-3px); }
    .activity-level { padding:4px 11px; border-radius:20px; font-size:.65rem; font-weight:600; background:#eef; letter-spacing:.5px; }
    .status { padding:4px 12px; border-radius:16px; font-size:.65rem; font-weight:600; }
    .status-open { background:#d4edda; color:#155724; }
    .status-closed { background:#f8d7da; color:#721c24; }
    .status-full { background:#fff3cd; color:#856404; }
    .status-pending { background:#e1e8ff; color:#2c4d9e; }
    .meta { font-size:.75rem; color:#555; display:flex; flex-direction:column; gap:2px; }

    /* 表單 */
    .form-group { margin-bottom:1rem; }
    .form-group label { display:block; font-size:.7rem; font-weight:600; margin-bottom:.3rem; letter-spacing:.5px; }
    .form-group input, .form-group select { width:100%; padding:10px; border:2px solid #e2e6ef; border-radius:8px; font-size:.85rem; background:#fafbfc; }
    .form-group input:focus, .form-group select:focus { outline:none; border-color:#667eea; background:#fff; }

    /* Modal */
    .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:999; padding:25px; overflow:auto; }
    .modal-content { background:#fff; max-width:600px; margin:40px auto; padding:1.6rem 1.7rem 2rem; border-radius:18px; position:relative; box-shadow:0 10px 35px rgba(0,0,0,.25); }
    .close { position:absolute; top:10px; right:15px; font-size:26px; cursor:pointer; color:#888; }
    .close:hover { color:#333; }

    /* 後台 */
    #admin-app header { background:#4a56d6; color:#fff; padding:1rem 1.4rem; display:flex; justify-content:space-between; align-items:center; border-radius:12px; }
    .admin-tabs { display:flex; gap:8px; margin:16px 0 10px; flex-wrap:wrap;}
    .admin-tab { padding:10px 14px; background:#ffffff; border-radius:10px; cursor:pointer; font-weight:600; font-size:.75rem; box-shadow:0 4px 14px rgba(0,0,0,.06); transition:.25s; }
    .admin-tab.active { background:#4a56d6; color:#fff; }
    .panel { display:none; background:#fff; border-radius:14px; padding:1.2rem 1.3rem 1.4rem; box-shadow:0 6px 18px rgba(0,0,0,.06); }
    .panel.active { display:block; }
    table { border-collapse:collapse; width:100%; font-size:.72rem; }
    th, td { padding:6px 8px; border:1px solid #e1e6ef; text-align:left; }
    th { background:#f5f7fb; }
    tr:hover { background:#fafcff; }
    .grid { display:grid; gap:14px; }
    .two-col { grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); }
    .section-title { margin:0 0 .8rem; font-size:.9rem; display:flex; align-items:center; gap:6px; }

    @media(max-width:768px){
      .activity-grid { grid-template-columns:1fr; }
      .header h1 { font-size:1.8rem; }
    }
  </style>
</head>
<body>
  <!-- 前台 APP -->
  <div id="public-app">
    <div class="container">
      <div class="header">
        <h1>🏔️ 登山活動報名系統</h1>
        <p style="margin:0;">探索山林，挑戰自我</p>
      </div>

      <div class="nav-tabs">
        <button class="nav-tab active" onclick="switchTab('activities', this)">活動列表</button>
        <button class="nav-tab" onclick="switchTab('my-registrations', this)">我的報名</button>
        <button class="nav-tab" onclick="switchTab('member-register', this)">會員註冊</button>
        <button class="nav-tab" onclick="openAdminLogin()">後台登入</button>
      </div>

      <div id="activities-tab" class="tab-content active">
        <h2 style="margin-top:0;">🎯 活動列表</h2>
        <div id="activities-container">載入中...</div>
      </div>

      <div id="my-registrations-tab" class="tab-content">
        <h2 style="margin-top:0;">📋 我的報名</h2>
        <div class="form-group" style="max-width:420px;">
          <label>Email 查詢：</label>
          <input type="email" id="user-email" placeholder="you@example.com" />
          <div style="margin-top:8px; display:flex; gap:8px;">
            <button class="btn btn-primary" onclick="loadUserRegistrations()">查詢</button>
            <button class="btn" onclick="clearUserReg()">清除</button>
          </div>
        </div>
        <div id="user-registrations-container"></div>
      </div>

      <div id="member-register-tab" class="tab-content">
        <h2 style="margin-top:0;">🧾 會員註冊</h2>
        <form id="member-register-form" onsubmit="registerMemberFront(event)" style="max-width:480px;">
          <div id="member-register-alert"></div>
          <div class="form-group"><label>姓名 *</label><input type="text" id="m-name" ></div>
          <div class="form-group"><label>Email *</label><input type="email" id="m-email" ></div>
          <div class="form-group"><label>密碼 *</label><input type="password" id="m-pw"  minlength="6"></div>
          <div class="form-group"><label>電話</label><input type="text" id="m-phone" required></div>
          <div class="form-group"><label>緊急聯絡人</label><input type="text" id="m-emg"></div>
          <div class="form-group"><label>緊急聯絡人電話</label><input type="text" id="m-emg-phone"></div>
          <button type="submit" class="btn btn-primary">建立會員</button>
        </form>
      </div>
    </div>
  </div>

  <!-- 後台登入 Modal -->
  <div class="modal" id="admin-login-modal">
    <div class="modal-content" style="max-width:420px;">
      <span class="close" onclick="closeModal('admin-login-modal')">&times;</span>
      <h2 style="margin-top:0;">後台登入</h2>
      <div id="login-alert"></div>
      <form onsubmit="adminLogin(event)">
        <div class="form-group"><label>Email</label><input type="email" id="admin-email" required></div>
        <div class="form-group"><label>密碼</label><input type="password" id="admin-password" required></div>
        <button type="submit" class="btn btn-primary" style="width:100%;">登入</button>
      </form>
    </div>
  </div>

  <!-- 報名 Modal -->
  <div class="modal" id="registration-modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal('registration-modal')">&times;</span>
      <h2 style="margin-top:0;">📝 報名</h2>
      <div id="registration-form-container"></div>
    </div>
  </div>

  <!-- 活動詳情 Modal -->
  <div class="modal" id="activity-detail-modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal('activity-detail-modal')">&times;</span>
      <div id="activity-detail-container"></div>
    </div>
  </div>

  <!-- 後台 APP -->
  <div id="admin-app" class="hidden">
    <div class="container">
      <header>
        <h2 style="margin:0;font-size:1.1rem;">後台管理</h2>
        <div class="flex">
          <span id="admin-user" style="font-size:.7rem;"></span>
          <button class="btn btn-outline" onclick="logoutAdmin()">登出</button>
          <button class="btn" onclick="backToPublic()">前台</button>
        </div>
      </header>

      <div class="admin-tabs">
        <div class="admin-tab active" data-panel="activities-panel" onclick="switchPanel(this)">活動管理</div>
        <div class="admin-tab" data-panel="registrations-panel" onclick="switchPanel(this)">報名清單</div>
        <div class="admin-tab" data-panel="members-panel" onclick="switchPanel(this)">會員管理</div>
      </div>

      <!-- 活動管理 -->
      <div id="activities-panel" class="panel active">
        <h3 class="section-title">活動管理</h3>
          <div class="grid two-col" id="activity-form-wrapper">
          <div style="background:#fafbff; padding:14px 16px; border-radius:12px;">
            <h4 style="margin-top:0;">新增 / 編輯活動</h4>
            <div id="act-form-alert"></div>
            <form id="act-form" onsubmit="saveActivity(event)">
              <input type="hidden" id="act-id">
              <div class="form-group"><label>名稱 *</label><input id="act-name" required></div>
              <div class="form-group"><label>等級</label><input id="act-level"></div>
              <div class="form-group"><label>出發日期 (YYYY-MM-DD)</label><input id="act-depart"></div>
              <div class="form-group"><label>報名開始</label><input id="act-signup-start"></div>
              <div class="form-group"><label>報名截止</label><input id="act-signup-end"></div>
              <div class="form-group"><label>人數限制</label><input id="act-limit" type="number" min="0"></div>
              <div class="form-group"><label>描述</label><input id="act-desc"></div>
              <div class="flex">
                <button type="submit" class="btn btn-primary">儲存</button>
                <button type="button" class="btn" onclick="resetActivityForm()">清空</button>
              </div>
            </form>
          </div>
          <div style="overflow:auto;">
            <h4 style="margin-top:0;">活動列表</h4>
            <div id="admin-activities-table">載入中...</div>
          </div>
        </div>
      </div>

      <!-- 報名清單 -->
      <div id="registrations-panel" class="panel">
        <h3 class="section-title">報名清單</h3>
        <div class="form-group" style="max-width:340px;">
          <label>選擇活動</label>
          <select id="reg-activity-select" onchange="loadActivityRegistrations()"></select>
        </div>
        <div style="margin:8px 0;">
          <button class="btn" onclick="loadActivityRegistrations()">重新載入</button>
          <button class="btn btn-primary" onclick="exportCSV()">匯出 CSV</button>
        </div>
        <div id="activity-registrations-table"></div>
      </div>

      <!-- 會員管理 -->
      <div id="members-panel" class="panel">
        <h3 class="section-title">會員管理</h3>
        <div style="margin-bottom:10px;">
          <button class="btn" onclick="loadMembers()">重新載入</button>
        </div>
        <div id="members-table">載入中...</div>
        <div style="margin-top:20px; max-width:420px;">
          <h4 style="margin-top:0;">重設會員密碼</h4>
          <div id="reset-pw-alert"></div>
          <form onsubmit="resetMemberPassword(event)">
            <div class="form-group"><label>會員ID</label><input id="reset-member-id" required></div>
            <div class="form-group"><label>新密碼</label><input id="reset-member-pw" required minlength="6"></div>
            <button type="submit" class="btn btn-primary">重設密碼</button>
          </form>
        </div>
      </div>

    </div>
  </div>

  <script>
    // ========== 前台 ==========
    let activities = [];
    let currentActivity = null;
    let submitting = false;

    document.addEventListener('DOMContentLoaded', () => {
      loadActivities();
      autoResumeAdmin();
    });

    function switchTab(tab, btn) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));
      document.getElementById(tab + '-tab').classList.add('active');
      if (btn) btn.classList.add('active');
    }

    function loadActivities() {
      const container = document.getElementById('activities-container');
      container.textContent = '載入中...';
      google.script.run
        .withSuccessHandler(data => { activities = data || []; renderActivities(); })
        .withFailureHandler(err => { container.innerHTML='<div class="alert alert-error">載入失敗</div>'; })
        .getActivities();
    }

    function renderActivities() {
      const container = document.getElementById('activities-container');
      if (!activities.length) {
        container.innerHTML = '<div>目前沒有活動</div>';
        return;
      }
      let html = '<div class="activity-grid">';
      activities.forEach(a => {
        const canReg = canRegisterActivity(a);
        html += `
          <div class="activity-card">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <span class="activity-level">${a['活動等級']||''}</span>
              <span class="status ${statusClass(a['狀態'])}">${a['狀態']}</span>
            </div>
            <div style="font-weight:700; font-size:.95rem;">${a['活動名稱']}</div>
            <div class="meta">
              <div>📅 出發：${fmtDate(a['出發日期'])}</div>
              <div>📝 報名：${fmtDate(a['報名開始'])} ~ ${fmtDate(a['報名截止'])}</div>
              <div>👥 人數：${a['已報名人數']}/${a['人數限制']}</div>
            </div>
            <div style="display:flex; gap:8px; margin-top:.5rem;">
              <button class="btn btn-primary" onclick="showActivityDetail('${a['活動ID']}')">詳情</button>
              <button class="btn btn-primary" onclick="openRegistrationForm('${a['活動ID']}')" ${!canReg?'disabled':''}>${canReg?'報名':'無法報名'}</button>
            </div>
          </div>`;
      });
      html += '</div>';
      container.innerHTML = html;
    }

    function statusClass(s) {
      switch (s) {
        case '報名中': return 'status-open';
        case '報名截止': return 'status-closed';
        case '已滿額': return 'status-full';
        case '未開始': return 'status-pending';
        default: return 'status-closed';
      }
    }
    function canRegisterActivity(a) {
      if (a['狀態'] !== '報名中') return false;
      const c = Number(a['已報名人數'])||0;
      const l = Number(a['人數限制'])||0;
      if (l>0 && c>=l) return false;
      const now = new Date();
      const start = new Date(a['報名開始']);
      const end = new Date(a['報名截止']);
      return now>=start && now<=end;
    }
    function fmtDate(d) {
      if (!d) return '';
      const dt = new Date(d);
      if (isNaN(dt)) return d;
      return dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate());
    }
    function pad(n){return n<10?'0'+n:n;}
    function fmtDateTime(s) {
      if (!s) return '';
      const d = new Date(s);
      if (isNaN(d)) return s;
      return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes());
    }

    function showActivityDetail(id) {
      const act = activities.find(a => a['活動ID']===id);
      if (!act) return;
      currentActivity = act;
      const container = document.getElementById('activity-detail-container');
      container.innerHTML = `
        <h2 style="margin-top:0;">${act['活動名稱']}</h2>
        <p><strong>等級：</strong>${act['活動等級']||''} | <strong>狀態：</strong>${act['狀態']}</p>
        <p><strong>出發日期：</strong>${fmtDate(act['出發日期'])}</p>
        <p><strong>報名期間：</strong>${fmtDate(act['報名開始'])} ~ ${fmtDate(act['報名截止'])}</p>
        <p><strong>人數：</strong>${act['已報名人數']}/${act['人數限制']}</p>
        <p><strong>描述：</strong>${act['描述']||'無'}</p>
        <div style="margin-top:1rem;">
          <button class="btn btn-primary" onclick="closeModal('activity-detail-modal');openRegistrationForm('${act['活動ID']}')" ${!canRegisterActivity(act)?'disabled':''}>立即報名</button>
        </div>
      `;
      openModal('activity-detail-modal');
    }

    function openRegistrationForm(id) {
      const act = activities.find(a => a['活動ID']===id);
      if (!act) return;
      currentActivity = act;
      const div = document.getElementById('registration-form-container');
      div.innerHTML = `
        <div id="reg-alert"></div>
        <h3 style="margin-top:0;">${act['活動名稱']} - 報名</h3>
        <form onsubmit="submitRegistrationFront(event)">
          <div class="form-group"><label>姓名 *</label><input required id="reg-name"></div>
          <div class="form-group"><label>電話 *</label><input  id="reg-phone"></div>
          <div class="form-group"><label>Email *</label><input type="email"  id="reg-email"></div>
          <div class="form-group"><label>緊急聯絡人 *</label><input  id="reg-emg"></div>
          <div class="form-group"><label>緊急聯絡人電話 *</label><input  id="reg-emg-phone"></div>
          <div style="text-align:right; margin-top:1rem;">
            <button type="button" class="btn" onclick="closeModal('registration-modal')">取消</button>
            <button type="submit" class="btn btn-primary" id="reg-submit-btn">送出</button>
          </div>
        </form>
      `;
      openModal('registration-modal');
    }

    function submitRegistrationFront(e) {
      e.preventDefault();
      if (submitting) return;
      submitting = true;
      const btn = document.getElementById('reg-submit-btn');
      btn.disabled = true; btn.textContent='處理中...';
      const alertDiv = document.getElementById('reg-alert');
      alertDiv.innerHTML = '<div class="alert alert-info">送出中...</div>';
      const data = {
        activityId: currentActivity['活動ID'],
        name: document.getElementById('reg-name').value.trim(),
        phone: document.getElementById('reg-phone').value.trim(),
        email: document.getElementById('reg-email').value.trim(),
        emergencyContact: document.getElementById('reg-emg').value.trim(),
        emergencyPhone: document.getElementById('reg-emg-phone').value.trim()
      };
      google.script.run
        .withSuccessHandler(res => {
          if (res.success) {
            alertDiv.innerHTML = '<div class="alert alert-success">'+res.message+'<br>報名編號：'+res.registrationId+'</div>';
            setTimeout(()=> {
              closeModal('registration-modal');
              loadActivities();
            },1600);
          } else {
            alertDiv.innerHTML = '<div class="alert alert-error">'+res.message+'</div>';
          }
        })
        .withFailureHandler(err => {
          alertDiv.innerHTML = '<div class="alert alert-error">系統錯誤</div>';
        })
        .submitRegistration(data);
      setTimeout(()=> {
        submitting = false;
        btn.disabled=false;
        btn.textContent='送出';
      },2200);
    }

    function loadUserRegistrations() {
      const email = document.getElementById('user-email').value.trim();
      if (!email) { alert('請輸入 Email'); return; }
      const box = document.getElementById('user-registrations-container');
      box.innerHTML = '<div class="alert alert-info">載入中...</div>';
      google.script.run
        .withSuccessHandler(list => {
          if (!list || !list.length) {
            box.innerHTML = '<div>無報名紀錄</div>';
            return;
          }
          let html='';
          list.forEach(r => {
            const act = r.activityInfo;
            let canCancel = false;
            if (act) {
              const end = new Date(act['報名截止']);
              canCancel = act['狀態']==='報名中' && new Date() <= end;
            }
            html += `
              <div style="border:1px solid #eee; padding:10px 12px; border-radius:10px; margin-bottom:10px; background:#fff;">
                <div style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px;">
                  <div>
                    <strong>${act?act['活動名稱']:'(活動已刪除)'}</strong><br>
                    編號：${r['報名ID']}<br>
                    時間：${fmtDateTime(r['報名時間'])}
                  </div>
                  <div>
                    ${canCancel? `<button class="btn btn-danger" onclick="cancelUserRegistration('${r['報名ID']}','${r['Email']}')">取消</button>`:'<span class="status status-closed">無法取消</span>'}
                  </div>
                </div>
                ${act? `<div style="margin-top:6px; font-size:.65rem;">出發：${fmtDate(act['出發日期'])} | 人數：${act['已報名人數']}/${act['人數限制']}</div>`:''}
              </div>`;
          });
          box.innerHTML = html;
        })
        .withFailureHandler(err => box.innerHTML='<div class="alert alert-error">載入失敗</div>')
        .getUserRegistrations(email);
    }

    function cancelUserRegistration(id, email) {
      if (!confirm('確定取消？')) return;
      google.script.run
        .withSuccessHandler(res => {
          alert(res.message);
          loadUserRegistrations();
          loadActivities();
        })
        .withFailureHandler(err => alert('錯誤'))
        .cancelRegistration(id, email);
    }

    function clearUserReg() {
      document.getElementById('user-email').value='';
      document.getElementById('user-registrations-container').innerHTML='';
    }

    function registerMemberFront(e) {
      e.preventDefault();
      const alertBox = document.getElementById('member-register-alert');
      alertBox.innerHTML='';
      const data = {
        name: document.getElementById('m-name').value.trim(),
        email: document.getElementById('m-email').value.trim(),
        password: document.getElementById('m-pw').value,
        phone: document.getElementById('m-phone').value.trim(),
        emergencyContact: document.getElementById('m-emg').value.trim(),
        emergencyPhone: document.getElementById('m-emg-phone').value.trim()
      };
      alertBox.innerHTML = '<div class="alert alert-info">送出中...</div>';
      google.script.run
        .withSuccessHandler(res => {
          if (res.success) {
            alertBox.innerHTML = '<div class="alert alert-success">註冊成功！</div>';
            document.getElementById('member-register-form').reset();
          } else {
            alertBox.innerHTML = '<div class="alert alert-error">'+res.message+'</div>';
          }
        })
        .withFailureHandler(err => {
          alertBox.innerHTML = '<div class="alert alert-error">系統錯誤</div>';
        })
        .registerMember(data);
    }

    // ===== Modal 控制 =====
    function openModal(id){ document.getElementById(id).style.display='block'; }
    function closeModal(id){ document.getElementById(id).style.display='none'; if (id==='registration-modal') currentActivity=null; }
    window.onclick = function(e){
      ['registration-modal','activity-detail-modal','admin-login-modal'].forEach(mid=>{
        const m = document.getElementById(mid);
        if (e.target===m) closeModal(mid);
      });
    }

    function openAdminLogin() {
      openModal('admin-login-modal');
    }

    // ========== 後台登入與顯示 ==========
    let adminToken = null;
    let adminEmail = null;

    function autoResumeAdmin() {
      const t = localStorage.getItem('admin_token');
      const mail = localStorage.getItem('admin_email');
      if (t && mail) {
        // 嘗試顯示後台（不重新驗證角色；若需嚴謹可新增後端驗證函式）
        adminToken = t;
        adminEmail = mail;
        showAdmin();
        loadAllAdminData();
      }
    }

    function adminLogin(e) {
      e.preventDefault();
      const email = document.getElementById('admin-email').value.trim();
      const pw = document.getElementById('admin-password').value;
      const alertBox = document.getElementById('login-alert');
      alertBox.innerHTML = '<div class="alert alert-info">登入中...</div>';
      google.script.run
        .withSuccessHandler(res => {
          if (res.success) {
            if (res.role !== 'admin') {
              alertBox.innerHTML = '<div class="alert alert-error">此帳號無管理員權限</div>';
              return;
            }
            adminToken = res.token;
            adminEmail = res.email;
            localStorage.setItem('admin_token', adminToken);
            localStorage.setItem('admin_email', adminEmail);
            alertBox.innerHTML = '<div class="alert alert-success">登入成功</div>';
            setTimeout(()=>{
              closeModal('admin-login-modal');
              showAdmin();
              loadAllAdminData();
            },500);
          } else {
            alertBox.innerHTML = '<div class="alert alert-error">'+res.message+'</div>';
          }
        })
        .withFailureHandler(err => {
          alertBox.innerHTML = '<div class="alert alert-error">系統錯誤</div>';
        })
        .userLogin(email, pw);
    }

    function showAdmin() {
      document.getElementById('public-app').classList.add('hidden');
      document.getElementById('admin-app').classList.remove('hidden');
      document.getElementById('admin-user').textContent = adminEmail || '';
    }

    function backToPublic() {
      document.getElementById('admin-app').classList.add('hidden');
      document.getElementById('public-app').classList.remove('hidden');
    }

    function logoutAdmin() {
      localStorage.removeItem('admin_token');
      localStorage.removeItem('admin_email');
      adminToken = null;
      adminEmail = null;
      backToPublic();
    }

    // ===== 後台 Tabs =====
    function switchPanel(el) {
      document.querySelectorAll('.admin-tab').forEach(t=>t.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
      el.classList.add('active');
      document.getElementById(el.dataset.panel).classList.add('active');
    }

    // ===== 載入全部後台資料 =====
    function loadAllAdminData() {
      loadAdminActivities();
      loadMembers();
    }

    // ===== 活動（後台） =====
    function loadAdminActivities() {
      const wrap = document.getElementById('admin-activities-table');
      wrap.textContent='載入中...';
      google.script.run
        .withSuccessHandler(data => {
          const acts = data || [];
          let html = '<table><thead><tr><th>ID</th><th>名稱</th><th>日期</th><th>報名期間</th><th>限制</th><th>人數</th><th>狀態</th><th>操作</th></tr></thead><tbody>';
          acts.forEach(a => {
            html += `<tr>
              <td>${a['活動ID']}</td>
              <td>${a['活動名稱']}</td>
              <td>${a['出發日期']}</td>
              <td>${a['報名開始']}<br>${a['報名截止']}</td>
              <td>${a['人數限制']}</td>
              <td>${a['已報名人數']}</td>
              <td>${a['狀態']}</td>
              <td>
                <button class="btn btn-primary" onclick="editActivity('${a['活動ID']}')">編輯</button>
                <button class="btn btn-danger" onclick="deleteActivity('${a['活動ID']}')">刪</button>
                <div style="margin-top:4px;">
                  <select onchange="forceStatus('${a['活動ID']}', this.value)">
                    <option value="">狀態操作</option>
                    <option value="未開始">未開始</option>
                    <option value="報名中">報名中</option>
                    <option value="報名截止">報名截止</option>
                    <option value="已滿額">已滿額</option>
                  </select>
                </div>
              </td>
            </tr>`;
          });
          html+='</tbody></table>';
          wrap.innerHTML = html;
          // 更新報名清單下拉
          const sel = document.getElementById('reg-activity-select');
          sel.innerHTML = '<option value="">--選擇活動--</option>' + acts.map(a=> `<option value="${a['活動ID']}">${a['活動ID']} - ${a['活動名稱']}</option>`).join('');
        })
        .withFailureHandler(err => wrap.innerHTML='<div class="alert alert-error">載入失敗</div>')
        .getActivities();
    }

    function resetActivityForm() {
      document.getElementById('act-id').value='';
      document.getElementById('act-form').reset();
      document.getElementById('act-form-alert').innerHTML='';
    }

    function editActivity(id) {
      google.script.run
        .withSuccessHandler(a => {
          if (!a) { alert('找不到活動'); return; }
          document.getElementById('act-id').value = a['活動ID'];
          document.getElementById('act-name').value = a['活動名稱'];
          document.getElementById('act-level').value = a['活動等級']||'';
          document.getElementById('act-depart').value = a['出發日期'];
          document.getElementById('act-signup-start').value = a['報名開始'];
          document.getElementById('act-signup-end').value = a['報名截止'];
          document.getElementById('act-limit').value = a['人數限制'];
          document.getElementById('act-desc').value = a['描述'] || '';
        })
        .getActivityDetails(id);
    }

    function saveActivity(e) {
      e.preventDefault();
      if (!adminToken) return alert('未登入');
      const alertBox = document.getElementById('act-form-alert');
      alertBox.innerHTML = '<div class="alert alert-info">處理中...</div>';
      const data = {
        id: document.getElementById('act-id').value.trim(),
        name: document.getElementById('act-name').value.trim(),
        level: document.getElementById('act-level').value.trim(),
        departDate: document.getElementById('act-depart').value.trim(),
        signupStart: document.getElementById('act-signup-start').value.trim(),
        signupEnd: document.getElementById('act-signup-end').value.trim(),
        limit: document.getElementById('act-limit').value.trim(),
        desc: document.getElementById('act-desc').value.trim()
      };
      google.script.run
        .withSuccessHandler(res => {
          if (res.success) {
            alertBox.innerHTML = '<div class="alert alert-success">'+res.message+'</div>';
            loadAdminActivities();
            resetActivityForm();
          } else {
            alertBox.innerHTML = '<div class="alert alert-error">'+res.message+'</div>';
          }
        })
        .withFailureHandler(err => alertBox.innerHTML='<div class="alert alert-error">系統錯誤</div>')
        .adminSaveActivity(adminToken, data);
    }

    function deleteActivity(id) {
      if (!confirm('確定刪除活動 '+id+'？')) return;
      google.script.run
        .withSuccessHandler(res => {
          alert(res.message);
          loadAdminActivities();
        })
        .withFailureHandler(err => alert('刪除失敗'))
        .adminDeleteActivity(adminToken, id);
    }

    function forceStatus(id, st) {
      if (!st) return;
      google.script.run
        .withSuccessHandler(res => {
          alert(res.message);
          loadAdminActivities();
        })
        .withFailureHandler(err => alert('操作失敗'))
        .adminForceStatus(adminToken, id, st);
    }

    // ===== 報名清單（後台） =====
    function loadActivityRegistrations() {
      const actId = document.getElementById('reg-activity-select').value;
      const wrap = document.getElementById('activity-registrations-table');
      if (!actId) { wrap.innerHTML='請選擇活動'; return; }
      wrap.innerHTML='載入中...';
      google.script.run
        .withSuccessHandler(list => {
          if (list.error) {
            wrap.innerHTML = '<div class="alert alert-error">'+list.message+'</div>';
            return;
          }
          if (!list.length) {
            wrap.innerHTML = '<div>尚無報名</div>';
            return;
          }
          let html = '<table><thead><tr>';
          const header = Object.keys(list[0]);
          html += header.map(h=> '<th>'+h+'</th>').join('');
          html += '</tr></thead><tbody>';
          list.forEach(r => {
            html += '<tr>'+ header.map(h=> '<td>'+(r[h]||'')+'</td>').join('') +'</tr>';
          });
          html += '</tbody></table>';
          wrap.innerHTML = html;
        })
        .withFailureHandler(err => wrap.innerHTML='<div class="alert alert-error">載入錯誤</div>')
        .adminGetRegistrationsByActivity(adminToken, actId);
    }

    function exportCSV() {
      const actId = document.getElementById('reg-activity-select').value;
      if (!actId) { alert('請先選擇活動'); return; }
      google.script.run
        .withSuccessHandler(csv => {
          if (typeof csv === 'object' && csv.error) {
            alert(csv.message || '匯出失敗');
            return;
          }
          const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = actId + '_registrations.csv';
          a.click();
          URL.revokeObjectURL(url);
        })
        .adminExportRegistrationsCSV(adminToken, actId);
    }

    // ===== 會員管理（後台） =====
    function loadMembers() {
      const wrap = document.getElementById('members-table');
      wrap.textContent='載入中...';
      google.script.run
        .withSuccessHandler(list => {
          if (list.error) {
            wrap.innerHTML = '<div class="alert alert-error">'+list.message+'</div>';
            return;
          }
          if (!list.length) {
            wrap.innerHTML = '<div>尚無會員</div>';
            return;
          }
          let html = '<table><thead><tr><th>ID</th><th>姓名</th><th>Email</th><th>電話</th><th>緊急聯絡</th><th>角色</th><th>狀態</th><th>狀態操作</th><th>角色操作</th></tr></thead><tbody>';
          list.forEach(m => {
            html += `<tr>
              <td>${m['會員ID']}</td>
              <td>${m['姓名']}</td>
              <td>${m['Email']}</td>
              <td>${m['電話']}</td>
              <td>${m['緊急聯絡人']}/${m['緊急聯絡電話']}</td>
              <td>${m['角色']}</td>
              <td>${m['狀態']}</td>
              <td>
                <select onchange="updateMemberStatus('${m['會員ID']}', this.value)">
                  <option value="">狀態</option>
                  <option value="active">active</option>
                  <option value="inactive">inactive</option>
                </select>
              </td>
              <td>
                <select onchange="updateMemberRole('${m['會員ID']}', this.value)">
                  <option value="">角色</option>
                  <option value="member">member</option>
                  <option value="staff">staff</option>
                  <option value="admin">admin</option>
                </select>
              </td>
            </tr>`;
          });
          html += '</tbody></table>';
          wrap.innerHTML = html;
        })
        .withFailureHandler(err => wrap.innerHTML='<div class="alert alert-error">載入失敗</div>')
        .adminGetMembers(adminToken);
    }

    function updateMemberStatus(id, st) {
      if (!st) return;
      google.script.run
        .withSuccessHandler(res => {
          alert(res.message);
          loadMembers();
        })
        .withFailureHandler(err => alert('更新失敗'))
        .adminUpdateMemberStatus(adminToken, id, st);
    }

    function updateMemberRole(id, role) {
      if (!role) return;
      google.script.run
        .withSuccessHandler(res => {
          alert(res.message);
          loadMembers();
        })
        .withFailureHandler(err => alert('更新角色失敗'))
        .adminUpdateMemberRole(adminToken, id, role);
    }

    function resetMemberPassword(e) {
      e.preventDefault();
      const alertBox = document.getElementById('reset-pw-alert');
      alertBox.innerHTML = '<div class="alert alert-info">處理中...</div>';
      const memberId = document.getElementById('reset-member-id').value.trim();
      const pw = document.getElementById('reset-member-pw').value;
      google.script.run
        .withSuccessHandler(res => {
          if (res.success) {
            alertBox.innerHTML = '<div class="alert alert-success">'+res.message+'</div>';
            e.target.reset();
          } else {
            alertBox.innerHTML = '<div class="alert alert-error">'+res.message+'</div>';
          }
        })
        .withFailureHandler(err => {
          alertBox.innerHTML = '<div class="alert alert-error">系統錯誤</div>';
        })
        .adminResetMemberPassword(adminToken, memberId, pw);
    }
  </script>
</body>
</html>
