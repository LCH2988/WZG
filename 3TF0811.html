<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>活動報名表單</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft JhengHei",Arial,sans-serif;}
  body{
    background:linear-gradient(135deg,#4e54c8,#8f94fb);
    min-height:100vh;
    padding:16px;
    color:#222;
  }
  .container{
    max-width:640px;
    margin:0 auto;
    background:#fff;
    border-radius:18px;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
    overflow:hidden;
  }
  header{
    padding:28px 24px;
    background:linear-gradient(135deg,#4e54c8,#8f94fb);
    color:#fff;
  }
  header h1{font-size:1.6rem;margin-bottom:6px;display:flex;align-items:center;gap:8px;}
  header p{opacity:.95;font-size:.9rem;}
  main{padding:24px;}
  .event-box{
    background:linear-gradient(135deg,#f8f9fa,#eef1f6);
    border-left:5px solid #4e54c8;
    padding:16px;
    border-radius:12px;
    margin-bottom:22px;
  }
  .event-box h2{font-size:1.1rem;margin-bottom:6px;display:flex;align-items:center;gap:6px;}
  .event-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:10px;}
  .meta-item{background:#fff;padding:8px 10px;border-radius:8px;font-size:.75rem;line-height:1.3;}
  .meta-item b{display:block;color:#4e54c8;margin-bottom:2px;font-size:.7rem;letter-spacing:1px;}
  .section-title{font-size:1rem;margin:12px 0 8px;font-weight:600;display:flex;align-items:center;gap:6px;}
  .form-group{margin-bottom:16px;}
  .form-group label{font-weight:600;font-size:.9rem;margin-bottom:6px;display:block;}
  .form-group input[type=text], .form-group input[type=tel], .form-group input[type=email], textarea, select{
    width:100%;padding:12px;border:2px solid #dde2ec;border-radius:10px;font-size:.9rem;transition:border .25s,box-shadow .25s;background:#fff;
  }
  .form-group input:focus, textarea:focus, select:focus{
    outline:none;border-color:#4e54c8;box-shadow:0 0 0 3px rgba(78,84,200,.2);
  }
  .participants-grid{display:grid;gap:12px;}
  .participant-card{
    background:#f7f9fc;border:1px solid #e2e6ef;border-radius:12px;padding:14px;position:relative;
  }
  .participant-card h3{font-size:.85rem;margin-bottom:8px;color:#4e54c8;letter-spacing:1px;font-weight:700;}
  .required{color:#e74c3c;margin-left:4px;}
  #submitBtn{
    width:100%;padding:16px;font-size:1.05rem;font-weight:700;
    background:linear-gradient(135deg,#4e54c8,#8f94fb);color:#fff;border:none;border-radius:12px;
    cursor:pointer;transition:all .3s;letter-spacing:1px;
  }
  #submitBtn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 12px 24px -6px rgba(78,84,200,.55);}
  #submitBtn:disabled{background:#bbb;cursor:not-allowed;}
  .message{padding:14px 16px;border-radius:10px;font-size:.85rem;line-height:1.5;margin-bottom:14px;display:none;white-space:pre-line;}
  .message.error{background:#fdecea;color:#c0392b;border:1px solid #f5c2c0;}
  .message.success{background:#e8f8f2;color:#1d6f42;border:1px solid #c6efe0;}
  .message.info{background:#f1f5ff;color:#31508a;border:1px solid #d2e1ff;}
  .badge-online,.badge-offline{
    position:fixed;top:10px;right:10px;padding:6px 12px;border-radius:20px;font-size:.65rem;font-weight:600;
    letter-spacing:1px;z-index:999;box-shadow:0 4px 12px -4px rgba(0,0,0,.3);
  }
  .badge-online{background:#23c483;color:#fff;}
  .badge-offline{background:#e74c3c;color:#fff;}
  footer{padding:18px 0;text-align:center;font-size:.7rem;color:#888;}
  .hint{font-size:.7rem;color:#777;margin-top:4px;font-style:italic;}
  @media (max-width:480px){
    header h1{font-size:1.25rem;}
    .participant-card{padding:12px;}
  }
</style>
</head>
<body>
<div id="netStatus" class="badge-offline">檢查連線...</div>
<div class="container">
  <header>
    <h1 id="headerTitle">🎯 活動報名</h1>
    <p id="headerSubtitle">請填寫下方資料（可一次 1~5 位）</p>
  </header>
  <main>
    <div id="msgInfo" class="message info"></div>
    <div id="msgError" class="message error"></div>
    <div id="msgSuccess" class="message success"></div>

    <div class="event-box" id="eventBox" style="display:none;">
      <h2><span id="eventIcon">🎯</span><span id="eventName">活動名稱</span></h2>
      <p id="eventDesc" style="font-size:.85rem;line-height:1.5;margin-top:6px;"></p>
      <div class="event-meta" id="eventMeta"></div>
    </div>

    <h3 class="section-title">👥 參加者資料 (第1位必填，其餘選填)</h3>
    <div class="participants-grid" id="participants"></div>
    <div class="form-group">
      <label>登記人備註</label>
      <textarea id="note" rows="3" placeholder="例如：希望一起編組 / 飲食注意等 (選填)"></textarea>
    </div>
    <div class="form-group">
      <label>聯絡手機 <span class="required">*</span></label>
      <input type="tel" id="contactPhone" placeholder="09xxxxxxxx" />
      <div class="hint">主要聯絡人手機（僅第一位需要）</div>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="contactEmail" placeholder="your@email.com" />
    </div>

    <button id="submitBtn">提交報名</button>
  </main>
  <footer>Powered by LIFF / Apps Script</footer>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
/* ===== 可調變數 ===== */
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwYrReQ2Y3VCh6M_mONU6gozFw0vCDyUwS8RghpvMdPNUbtUzBixoFq25BkV2J1Eupohw/exec'; // 例如 https://script.google.com/macros/s/XXXXX/exec
const FALLBACK_LIFF_ID = '2007905012-o1yDNa92';

/* ===== 狀態 ===== */
let liffId = FALLBACK_LIFF_ID;
let userId = '';
let userProfile = null;
let category = 'hiking';
let eventConfig = null;
let online = false;

/* ===== 元素參考 ===== */
const el = id => document.getElementById(id);
const netStatus = el('netStatus');
const msgInfo = el('msgInfo');
const msgError = el('msgError');
const msgSuccess = el('msgSuccess');
const participantsContainer = el('participants');
const submitBtn = el('submitBtn');

function showMessage(box, text){
  [msgInfo,msgError,msgSuccess].forEach(m=>{ m.style.display='none'; });
  if(!text){ return; }
  box.textContent = text;
  box.style.display='block';
  box.scrollIntoView({behavior:'smooth', block:'center'});
}
function showError(t){ showMessage(msgError, t); }
function showInfo(t){ showMessage(msgInfo, t); }
function showSuccess(t){ showMessage(msgSuccess, t); }

function setOnlineStatus(state){
  online = state;
  if(online){
    netStatus.className='badge-online';
    netStatus.textContent='ONLINE';
  }else{
    netStatus.className='badge-offline';
    netStatus.textContent='OFFLINE';
  }
}

/* ===== 初始化參加者欄位 ===== */
function renderParticipants(){
  let html='';
  for(let i=1;i<=5;i++){
    html+= `
      <div class="participant-card">
        <h3>參加者 ${i}${i===1?'<span class="required">*</span>':''}</h3>
        <div class="form-group" style="margin-bottom:10px;">
          <label>姓名 ${i===1?'<span class="required">*</span>':''}</label>
          <input type="text" id="p_name_${i}" placeholder="請輸入姓名${i===1?'（必填）':'（選填）'}" />
        </div>
      </div>
    `;
  }
  participantsContainer.innerHTML = html;
}

/* ===== 收集資料 ===== */
function collectParticipants(){
  const arr=[];
  for(let i=1;i<=5;i++){
    const v = (el('p_name_'+i).value||'').trim();
    if(i===1 && !v) throw new Error('請至少填寫參加者1姓名');
    if(v) arr.push(v);
  }
  if(arr.length>5) throw new Error('最多 5 位參加者');
  return arr;
}
function validatePhone(phone){
  return /^09\d{8}$/.test(phone.replace(/\D/g,''));
}

/* ===== 載入活動資訊 ===== */
async function loadEvent(category){
  try{
    const r = await fetch(`${GAS_URL}?action=getEventInfo&category=${encodeURIComponent(category)}&t=${Date.now()}`, {cache:'no-cache'});
    if(!r.ok) throw new Error('活動資訊讀取失敗');
    const data = await r.json();
    if(!data.success) throw new Error(data.error||'讀取失敗');
    eventConfig = data.config;
    renderEvent();
  }catch(e){
    showInfo('⚠️ 無法載入活動資訊，使用預設模式。');
    eventConfig = {
      title:'預設活動', icon:'🎯', description:'無法載入活動設定',
      eventDate:'待定', startTime:'待定', meetingPoint:'待定',
      duration:'待定', difficulty:'—', equipment:'—', maxParticipants:50
    };
    renderEvent();
  }
}

function safeText(s){ return (s||'').toString(); }

function renderEvent(){
  if(!eventConfig) return;
  el('eventBox').style.display='block';
  el('eventIcon').textContent = eventConfig.icon || '🎯';
  el('eventName').textContent = eventConfig.title || '活動';
  el('eventDesc').textContent = safeText(eventConfig.description||'');
  el('headerTitle').textContent = `${eventConfig.icon || '🎯'} ${eventConfig.title} 報名`;
  const meta = [
    {k:'日期', v:eventConfig.eventDate},
    {k:'集合', v:eventConfig.meetingPoint},
    {k:'時間', v:eventConfig.startTime},
    {k:'時長', v:eventConfig.duration},
    {k:'難度', v:eventConfig.difficulty},
    {k:'攜帶', v:eventConfig.equipment}
  ];
  const metaBox = el('eventMeta');
  metaBox.innerHTML='';
  meta.forEach(m=>{
    if(m.v && m.v!=='待定'){
      const div = document.createElement('div');
      div.className='meta-item';
      div.innerHTML = `<b>${m.k}</b><span>${safeText(m.v)}</span>`;
      metaBox.appendChild(div);
    }
  });
}

/* ===== 提交 ===== */
async function submitRegistration(){
  hideAllMessages();
  try{
    submitBtn.disabled = true;
    submitBtn.textContent = '提交中...';

    const names = collectParticipants();
    if(!names.length) throw new Error('請至少填寫一位參加者');
    const phone = el('contactPhone').value.trim();
    if(!validatePhone(phone)) throw new Error('請輸入有效的手機號碼 (09xxxxxxxx)');
    const email = el('contactEmail').value.trim();
    const note = el('note').value.trim();

    // 儲存本地
    localStorage.setItem('last_phone', phone);
    localStorage.setItem('last_email', email);

    const payload = new URLSearchParams();
    payload.append('action','submitGroupRegistration');
    payload.append('userId', userId);
    payload.append('userDisplayName', userProfile ? userProfile.displayName : '未知用戶');
    payload.append('category', category);
    payload.append('names', JSON.stringify(names));
    payload.append('contactPhone', phone);
    payload.append('contactEmail', email);
    payload.append('note', note);

    let resData;
    if(online){
      const res = await fetch(GAS_URL, {
        method:'POST',
        body: payload,
      });
      if(!res.ok) throw new Error('伺服器回應失敗');
      resData = await res.json();
    }else{
      // 離線存快取
      const backup = { ts:Date.now(), names, phone, email, category };
      localStorage.setItem('offline_backup_'+Date.now(), JSON.stringify(backup));
      resData = { success:true, offline:true, groupId:'OFFLINE-'+Date.now(), results:names.map((n,i)=>({name:n,status:'已確認',seq:'LOCAL-'+(i+1)})) };
    }

    if(resData.success){
      const confirmed = resData.results.filter(r=>r.status==='已確認');
      const waitlist = resData.results.filter(r=>r.status!=='已確認');
      let msg = `🎉 報名成功\n群組ID：${resData.groupId}\n`;
      if(resData.offline) msg += '（離線模式暫存，請稍後重新開啟網路確認）\n';
      msg += '\n【正選】\n';
      confirmed.forEach((r,i)=> msg+= `${i+1}. ${r.name} (${r.seq})\n`);
      if(waitlist.length){
        msg+=' \n【候補】\n';
        waitlist.forEach((r,i)=> msg+= `${i+1}. ${r.name} (${r.seq})\n`);
      }
      showSuccess(msg);
      submitBtn.textContent='已完成';
      submitBtn.disabled=true;

      // 嘗試自動關閉
      setTimeout(()=> { if(window.liff && liff.closeWindow) liff.closeWindow(); }, 5000);
    }else{
      throw new Error(resData.error || '未知錯誤');
    }

  }catch(e){
    showError(e.message);
    submitBtn.disabled=false;
    submitBtn.textContent='提交報名';
  }
}

function hideAllMessages(){
  [msgInfo,msgError,msgSuccess].forEach(m=> m.style.display='none');
}

/* ===== 檢查連線 ===== */
async function testConnection(){
  try{
    const r = await fetch(`${GAS_URL}?action=testConnection&t=${Date.now()}`,{cache:'no-store'});
    if(!r.ok) throw new Error();
    const data = await r.json();
    if(data.success) {
      setOnlineStatus(true);
      return true;
    }
    setOnlineStatus(false);
    return false;
  }catch(e){
    setOnlineStatus(false);
    return false;
  }
}

/* ===== 初始化 LIFF ===== */
async function init(){
  renderParticipants();
  // URL 參數
  const params = new URLSearchParams(location.search);
  category = params.get('category') || 'hiking';
  liffId = params.get('liffId') || FALLBACK_LIFF_ID;

  await testConnection();
  if(window.liff){
    try{
      await liff.init({ liffId });
      if(!liff.isLoggedIn()){
        liff.login();
        return;
      }
      userProfile = await liff.getProfile();
      userId = userProfile.userId;
    }catch(e){
      showInfo('⚠️ 無法初始化 LIFF，轉為測試模式。');
      userId = 'TEST_'+Date.now();
      userProfile = { displayName:'測試用戶' };
    }
  }else{
    showInfo('⚠️ LIFF SDK 未載入，測試模式。');
    userId='TEST_'+Date.now();
    userProfile={ displayName:'測試用戶' };
  }

  // 自動帶入手機/Email
  const lastPhone = localStorage.getItem('last_phone');
  if(lastPhone) el('contactPhone').value = lastPhone;
  const lastEmail = localStorage.getItem('last_email');
  if(lastEmail) el('contactEmail').value = lastEmail;

  await loadEvent(category);
}

document.addEventListener('DOMContentLoaded', ()=>{
  init();
  submitBtn.addEventListener('click', ()=> submitRegistration());
});

/* ===== 網路事件 ===== */
window.addEventListener('online', ()=> testConnection());
window.addEventListener('offline', ()=> setOnlineStatus(false));
</script>
</body>
</html>
