<!-- 
=========================
前端 LIFF 頁面（HTML）
========================= -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>三鐵飛翔好 - 活動報名</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body { font-family: 'Microsoft JhengHei', Arial, sans-serif; background: linear-gradient(135deg,#0d47a1,#26a69a); margin:0; padding:20px; }
    .container { max-width:880px; margin:0 auto; background:#fff; border-radius:18px; box-shadow:0 10px 30px rgba(0,0,0,.25); overflow:hidden; }
    h1 { text-align:center; background:#1565c0; color:#fff; padding:25px 15px; margin:0; font-size:1.8rem; letter-spacing:.05em; }
    .status { padding:15px 20px; background:#e3f2fd; border-left:6px solid #1976d2; font-size:.95rem; }
    form { padding:40px 45px 55px; }
    label { font-weight:bold; display:block; margin:25px 0 10px; }
    input, select, textarea {
      width:100%; padding:16px 18px; font-size:1.05rem;
      border:2px solid #cfd8dc; border-radius:12px; transition:.25s;
      background:#fafafa;
    }
    input:focus, select:focus, textarea:focus { outline:none; border-color:#1976d2; box-shadow:0 0 0 4px rgba(25,118,210,.15); background:#fff; }
    .grid { display:grid; gap:22px; grid-template-columns: repeat(auto-fit,minmax(230px,1fr)); margin-top:10px; }
    .group-card {
      background:linear-gradient(135deg,#ffffff,#f5f5f5);
      border:2px solid #ddd; border-radius:14px; padding:15px 18px; cursor:pointer;
      transition:.3s; position:relative; min-height:115px; display:flex; flex-direction:column; justify-content:center;
    }
    .group-card.active { border-color:#1976d2; background:linear-gradient(135deg,#1976d2,#42a5f5); color:#fff; box-shadow:0 6px 18px rgba(25,118,210,.35); }
    .group-card span { font-size:.85rem; opacity:.85; margin-top:6px; }
    .people-box { display:flex; gap:10px; align-items:center; margin-top:10px; }
    .people-box button {
      width:48px; height:48px; border:none; background:#1976d2; color:#fff;
      border-radius:12px; font-size:1.4rem; cursor:pointer; transition:.25s;
    }
    .people-box button:active { transform:scale(.92); }
    .people-display {
      flex:1; background:#eceff1; border-radius:12px; text-align:center;
      font-size:1.4rem; padding:10px 0; font-weight:bold; letter-spacing:.05em;
    }
    .submit-btn {
      margin-top:45px; width:100%; background:linear-gradient(90deg,#1976d2,#26a69a);
      border:none; color:#fff; padding:22px 10px; font-size:1.4rem; border-radius:16px;
      cursor:pointer; font-weight:bold; letter-spacing:.1em; box-shadow:0 8px 24px rgba(0,0,0,.25); transition:.35s;
    }
    .submit-btn:hover { transform:translateY(-4px); box-shadow:0 14px 32px rgba(0,0,0,.35); }
    .submit-btn:active { transform:translateY(0); }
    textarea { min-height:130px; resize:vertical; }
    .footer-note { margin-top:40px; font-size:.82rem; color:#607d8b; text-align:center; line-height:1.5; }
    .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:1000; }
    .modal-content {
      background:#fff; width:92%; max-width:520px; border-radius:20px; padding:40px 35px;
      position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
      box-shadow:0 18px 44px rgba(0,0,0,.35);
    }
    .modal-content h2 { margin:0 0 20px; font-size:1.5rem; text-align:center; }
    .preview-box {
      background:#f5f5f5; padding:18px 20px; border-radius:14px; font-size:.95rem; white-space:pre-wrap; line-height:1.55;
      max-height:320px; overflow:auto; border:1px solid #e0e0e0;
    }
    .modal-actions { margin-top:25px; display:flex; gap:15px; }
    .modal-actions button {
      flex:1; padding:15px 10px; font-size:1.05rem; border:none; border-radius:12px; cursor:pointer; font-weight:bold;
    }
    .btn-cancel { background:#b0bec5; color:#fff; }
    .btn-confirm { background:#1976d2; color:#fff; }
    .success-icon { font-size:3rem; text-align:center; margin-bottom:15px; }
    @media (max-width:720px) {
      form { padding:32px 28px 45px; }
      h1 { font-size:1.5rem; padding:20px 10px; }
      .group-card { min-height:105px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>三鐵飛翔好 活動報名</h1>
    <div id="status" class="status">正在初始化 LIFF...</div>
    <form id="regForm" autocomplete="off">
      <label>姓名 *</label>
      <input type="text" id="name" required placeholder="請輸入您的姓名">

      <label>手機（聯絡用） *</label>
      <input type="tel" id="phone" pattern="09\\d{8}" required placeholder="例：09xxxxxxxx">

      <label>選擇活動組別 *</label>
      <div class="grid" id="groupGrid">
        <!-- 組別卡片（JS動態建立） -->
      </div>
      <input type="hidden" id="group" required>

      <label>報名人數 *</label>
      <div class="people-box">
        <button type="button" onclick="adjPeople(-1)">-</button>
          <div class="people-display" id="peopleDisplay">1</div>
        <button type="button" onclick="adjPeople(1)">+</button>
      </div>
      <input type="hidden" id="people" value="1">

      <label>備註（選填）</label>
      <textarea id="remarks" placeholder="可填寫隊名 / 特殊需求 / 衣服尺寸等"></textarea>

      <button type="button" class="submit-btn" onclick="openPreview()">送出報名</button>
      <div class="footer-note">
        資料送出後系統將同步通知管理員。<br>
        若需修改請使用指令：改名 / 改人數 或 聯繫主辦。<br>
        主辦單位：三鐵飛翔好
      </div>
    </form>
  </div>

  <!-- 預覽 Modal -->
  <div class="modal" id="previewModal">
    <div class="modal-content">
      <h2>確認報名資料</h2>
      <div class="preview-box" id="previewBox"></div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal('previewModal')">返回修改</button>
        <button class="btn-confirm" id="confirmBtn" onclick="submitForm()">確認送出</button>
      </div>
    </div>
  </div>

  <!-- 成功 Modal -->
  <div class="modal" id="successModal">
    <div class="modal-content">
      <div class="success-icon">✅</div>
      <h2>報名成功</h2>
      <p style="text-align:center; line-height:1.6" id="successMsg">您的資料已提交。</p>
      <div class="modal-actions">
        <button class="btn-confirm" onclick="closeModal('successModal')">完成</button>
      </div>
    </div>
  </div>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    const liffId = "2007905012-o1yDNa92";
    let userProfile = null;
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzQ_mwjwU5hUC7fbqMiOeZZCttXvNBWlMdsKhyz5xd1uYi0xXNXTpqv44sZlsBv8HmA/exec"; // 需替換
    const groupDefinitions = [
      { code: "體驗組", title: "體驗組", desc: "入門友善 / 輕鬆交流" },
      { code: "挑戰組", title: "挑戰組", desc: "標準距離 / 訓練檢驗" },
      { code: "菁英組", title: "菁英組", desc: "進階要求 / 競速挑戰" },
      { code: "接力組", title: "接力組", desc: "2-3人分工 / 團隊合作" },
      { code: "親子樂活", title: "親子樂活", desc: "家庭同樂 / 氣氛休閒" }
    ];

    document.addEventListener('DOMContentLoaded', init);

    async function init() {
      renderGroups();
      updateStatus("初始化 LIFF 中...");
      try {
        await liff.init({ liffId });
        updateStatus("LIFF 初始化成功");
        if (!liff.isLoggedIn()) {
          updateStatus("導向登入...");
          liff.login();
          return;
        }
        userProfile = await liff.getProfile();
        updateStatus("您好，" + userProfile.displayName);
      } catch (e) {
        updateStatus("LIFF 初始化失敗：" + e.message, true);
      }
    }

    function renderGroups() {
      const grid = document.getElementById('groupGrid');
      grid.innerHTML = '';
      groupDefinitions.forEach(g => {
        const div = document.createElement('div');
          div.className = 'group-card';
          div.dataset.code = g.code;
          div.innerHTML = `<strong>${g.title}</strong><span>${g.desc}</span>`;
          div.onclick = () => selectGroup(div, g.code);
          grid.appendChild(div);
      });
    }
    function selectGroup(el, code) {
      document.querySelectorAll('.group-card').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      document.getElementById('group').value = code;
    }
    function adjPeople(delta) {
      const hidden = document.getElementById('people');
      let val = parseInt(hidden.value) || 1;
      val += delta;
      if (val < 1) val = 1;
      if (val > 99) val = 99;
      hidden.value = val;
      document.getElementById('peopleDisplay').textContent = val;
    }
    function updateStatus(msg, error=false) {
      const s = document.getElementById('status');
      s.textContent = msg;
      s.style.background = error ? '#ffebee' : '#e3f2fd';
      s.style.borderLeftColor = error ? '#c62828' : '#1976d2';
    }
    function openPreview() {
      const name = v('name'), phone = v('phone'), group = v('group'), people = v('people');
      if (!name || !phone || !group || !people) return alert("請完整填寫必填欄位");
      if (!/^09\\d{8}$/.test(phone)) return alert("手機格式錯誤");
      const remarks = v('remarks');
      const preview =
          `三鐵飛翔好 活動報名確認
          姓名：${name}
          手機：${phone}
          組別：${group}
          人數：${people}
          ${remarks ? "備註：" + remarks : ""}`;
          qs('#previewBox').textContent = preview;
          openModal('previewModal');
    }
    function v(id){ return document.getElementById(id).value.trim(); }
    function qs(sel){ return document.querySelector(sel); }
    function openModal(id){ document.getElementById(id).style.display='block'; }
    function closeModal(id){ document.getElementById(id).style.display='none'; }

    async function submitForm() {
      const btn = document.getElementById('confirmBtn');
      btn.disabled = true;
      btn.textContent = '傳送中...';
      const payload = {
        source: 'liff_form',
        name: v('name'),
        phone: v('phone'),
        group: v('group'),
        people: parseInt(v('people')),
        remarks: v('remarks'),
        timestamp: new Date().toLocaleString('zh-TW'),
        liffUserId: userProfile?.userId || '',
        liffDisplayName: userProfile?.displayName || '',
        sendMethod: 'line_send'
      };
      try {
        await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        closeModal('previewModal');
        qs('#successMsg').textContent = '報名已成功提交，謝謝參與！';
        openModal('successModal');
        resetForm();
        // 回傳一則訊息到聊天（可選）
        if (liff.isInClient()) {
          const msg = 
            `✅ 已完成報名\n${payload.name} - ${payload.group} (${payload.people}人)`;
          try { await liff.sendMessages([{ type:'text', text: msg }]); } catch(e){}
        }
      } catch (e) {
        alert('提交失敗：' + e.message);
      } finally {
        btn.disabled = false;
        btn.textContent = '確認送出';
      }
    }

    function resetForm() {
      ['name','phone','group','people','remarks'].forEach(id => {
        if (id === 'people') {
          document.getElementById('people').value = '1';
          document.getElementById('peopleDisplay').textContent = '1';
        } else {
          document.getElementById(id).value = '';
        }
      });
      document.querySelectorAll('.group-card').forEach(c=>c.classList.remove('active'));
    }

    window.onclick = function(e){
      if (e.target.classList.contains('modal')) e.target.style.display='none';
    };
  </script>
</body>
</html>
<!-- 
=========================
使用與設定說明
=========================
1. 在試算表 #A1_主檔設定 中維持原本第 3~22 欄位配置，第 11 筆 (index 10) 為 LINE 群組 ID。  
2. 將 REGISTRATION_SHEET_NAME 改為你想要的報名表名稱亦可（需同步前端文案）。  
3. 將前端 HTML 中的：
   - liffId 換成實際 LIFF ID  
   - GAS_URL 換成部署後的 Web App URL（需設定 Anyone, even anonymous 或對應權限）  
4. 若要保留「指令報名」：於群組輸入例：報+王小明+挑戰組+2  
5. 權限控制：若需限制修改功能，可在 PDpass 表中放入允許 userId，並於函式加驗證（此範例已簡化，若需要再加）。  
6. 若想新增欄位（Email / 緊急聯絡人）：  
   - (1) 試算表增加欄  
   - (2) 伺服端：initRegistrationSheet() 標題列 & saveRegistrationToSheet() appendRow  
   - (3) 前端：表單欄位 + payload  
7. 若要推播卡片樣式，可擴充 sendRegistrationNotification 成 Flex Message。  

=========================
後續可擴充方向
=========================
- 報到（check-in）欄：增加「報到時間 / 是否報到」  
- 多梯次：增加欄位「場次 / 日期」  
- 限制名額：報名前先讀取總人數判斷是否額滿  
- 匯出報名 PDF 或自動寄信確認  
- LINE Flex 名單分頁顯示  

若您需要上述任何進階功能，隨時再告訴我，我可在此基礎快速擴充。祝開發順利！ -->
