
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>三鐵活動報名系統</title>
  <meta name="description" content="三鐵活動多分類報名系統 - 登山組、單車組、慢跑組、水上組">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏃‍♂️</text></svg>'>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    /* (省略：保持你原本 CSS，未修改) */
    /* 為節省篇幅，此處請直接沿用你原始貼文中的 <style> 內容 */
  </style>
</head>
<body>
  <!-- 保持你原本的 body 結構與 HTML 標記 (header / nav / container / footer / modal) -->
  <!-- 以下 body 與原始版本完全一致，僅 JS 有修正 API 呼叫邏輯 -->
  <header>
    <div class="header-content">
      <h1 id="pageTitle">🏃‍♂️ 三鐵活動報名</h1>
      <div id="liffStatus" class="liff-status disconnected">
        <span id="liffStatusIcon">❌</span>
        <span id="liffStatusText">LIFF 未連接</span>
      </div>
      <div id="userInfo" class="user-info" style="display:none;">
        <img id="userAvatar" class="user-avatar" src="" alt="使用者頭像" style="display:none;">
        <div class="user-details">
          <div id="userName" class="user-name">未登入</div>
          <div id="userId" class="user-id"></div>
        </div>
        <button id="authBtn" class="login-btn" onclick="handleAuth()">LINE 登入</button>
      </div>
    </div>
    <nav id="mainNav">
      <a href="#" onclick="showPage('home')" class="nav-active">🏠 活動列表</a>
      <a href="#" onclick="showPage('batch')">📝 批次報名</a>
      <a href="#" onclick="showPage('admin')">⚙️ 管理後台</a>
    </nav>
  </header>
  <div class="container">
    <div id="mainContent"></div>
  </div>
  <div id="modalBackdrop" class="modal-backdrop">
    <div class="modal" id="modalContent"></div>
  </div>
  <footer>
    <div class="footer-content">
      <p>© 2025 三鐵活動報名系統 v2.0 - LIFF 整合版 (修正版)</p>
    </div>
  </footer>

  <script>
    /***********************
     * 前端設定
     ***********************/
    const CONFIG = {
      API_BASE_URL: "https://script.google.com/macros/s/AKfycbzxbf7vLNsn1VvaeXvKG8wxbPFzYz_6kmvvOCoEw7_52vjoNvqiufEZ_byAO2IUMGKo/exec",
      LIFF_ID: "2007905012-o1yDNa92",
      VERSION: "2.0.1-fix"
    };

    let gProfile = { isLoggedIn:false, userId:null, displayName:null, pictureUrl:null, statusMessage:null };
    let gSystemInfo = { categories:["登山組","單車組","慢跑組","水上組"], lastRefresh:0 };
    let currentPage = 'home';
    let allEvents = [];
    let filteredEvents = [];
    let liffInitialized = false;

    /***********************
     * LIFF 初始化
     ***********************/
    async function initializeLiff() {
      updateLiffStatus('connecting','連接中...');
      try {
        if (typeof liff === 'undefined') throw new Error("LIFF SDK 未載入");
        await liff.init({ liffId: CONFIG.LIFF_ID, withLoginOnExternalBrowser:true });
        liffInitialized = true;
        if (liff.isLoggedIn()) {
          await loadUserProfile();
          updateLiffStatus('connected','已連接並登入');
        } else {
          updateLiffStatus('connected','已連接但未登入');
          showUserInfo(false);
        }
      } catch(e){
        updateLiffStatus('error',"初始化失敗: "+e.message);
        showUserInfo(false);
      }
    }
    async function loadUserProfile() {
      try {
        const p = await liff.getProfile();
          gProfile = {
            isLoggedIn: true,
            userId: p.userId,
            displayName: p.displayName,
            pictureUrl: p.pictureUrl,
            statusMessage: p.statusMessage || null
          };
        showUserInfo(true);
      } catch(e){
        showNotification("取得使用者資料失敗: "+e.message,'error');
      }
    }
    function updateLiffStatus(status,msg){
      const el = document.getElementById('liffStatus');
      const icon = document.getElementById('liffStatusIcon');
      const txt = document.getElementById('liffStatusText');
      if(!el) return;
      const map = {
        connecting:{icon:'🔄',cls:'connecting'},
        connected:{icon:'✅',cls:'connected'},
          disconnected:{icon:'❌',cls:'disconnected'},
          error:{icon:'⚠️',cls:'error'}
      };
      icon.textContent = map[status].icon;
      el.className = 'liff-status '+map[status].cls;
      txt.textContent = msg;
    }
    function showUserInfo(logged){
      const box=document.getElementById('userInfo');
      const av=document.getElementById('userAvatar');
      const name=document.getElementById('userName');
      const uid=document.getElementById('userId');
      const btn=document.getElementById('authBtn');
      if(!box) return;
      box.style.display='flex';
      if(logged){
        box.className='user-info logged-in';
        if(gProfile.pictureUrl){ av.src=gProfile.pictureUrl; av.style.display='block'; }
        else av.style.display='none';
        name.textContent=gProfile.displayName||'未知使用者';
        uid.textContent=gProfile.userId ? 'ID: '+gProfile.userId.substring(0,8)+'...' : '';
        btn.textContent='登出'; btn.className='logout-btn';
      } else {
        box.className='user-info';
        av.style.display='none';
        name.textContent='未登入';
        uid.textContent='';
        btn.textContent='LINE 登入';
        btn.className='login-btn';
      }
    }
    async function handleAuth(){
      if(!liffInitialized){ await initializeLiff(); return; }
      try{
        if(gProfile.isLoggedIn){
          liff.logout();
          gProfile={isLoggedIn:false,userId:null,displayName:null,pictureUrl:null,statusMessage:null};
          showUserInfo(false);
          updateLiffStatus('connected','已連接但未登入');
          showNotification('已登出','info');
        } else {
          liff.login({ redirectUri: location.href });
        }
      }catch(e){ showNotification('操作失敗:'+e.message,'error'); }
    }

    /***********************
     * 共用工具
     ***********************/
    function htmlEscape(s){ return (s||'').toString().replace(/[&<>"']/g,m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m])); }
    function truncateText(t,l){ if(!t) return ''; return t.length<=l?t:t.slice(0,l)+'...'; }
    function showNotification(msg,type='info',dur=3000){
      const n=document.createElement('div');
      n.className='notification '+type;
      n.innerHTML=`<span>${htmlEscape(msg)}</span><button onclick="this.parentElement.remove()" style="background:none;border:none;color:inherit;font-size:18px;cursor:pointer;margin-left:auto;">✕</button>`;
      document.body.appendChild(n);
      setTimeout(()=>n.classList.add('show'),50);
      setTimeout(()=>{ n.classList.remove('show'); setTimeout(()=>n.remove(),300);},dur);
    }
    function showLoading(container,msg='載入中...'){
      container.innerHTML=`<div class="loading-container"><div class="spinner"></div><span>${htmlEscape(msg)}</span></div>`;
    }
    function showMessage(container,message,type='info'){
      container.innerHTML=`<div class="msg ${type}">${htmlEscape(message)}</div>`;
    }
    function setButtonLoading(btn, loading){
      if(!btn) return;
      if(loading){ btn.classList.add('loading'); btn.disabled=true; }
      else { btn.classList.remove('loading'); btn.disabled=false; }
    }
    function openModal(content){
      const bd=document.getElementById('modalBackdrop');
      const m=document.getElementById('modalContent');
      m.innerHTML=content;
      bd.classList.add('show');
      const closeBtn=m.querySelector('.close-btn');
      if(closeBtn) closeBtn.onclick=closeModal;
      bd.onclick=e=>{ if(e.target===bd) closeModal(); };
    }
    function closeModal(){ document.getElementById('modalBackdrop').classList.remove('show'); }

    /***********************
     * API 包裝
     ***********************/
    async function apiRequest(method, params={}){
      const url=CONFIG.API_BASE_URL;
      let resp;
      if(method==='GET'){
        const u=new URL(url);
          Object.keys(params).forEach(k=>u.searchParams.append(k, params[k]));
        resp=await fetch(u.toString(), { method:'GET' });
      } else {
        const form=new URLSearchParams();
        Object.keys(params).forEach(k=>{
          const val=params[k];
          form.append(k, (typeof val==='object') ? JSON.stringify(val) : val);
        });
        resp=await fetch(url, {
          method:'POST',
          headers:{ 'Content-Type':'application/x-www-form-urlencoded' },
          body:form
        });
      }
      if(!resp.ok) throw new Error('HTTP '+resp.status);
      const ct=resp.headers.get('content-type')||'';
      if(!ct.includes('json')) {
        const text=await resp.text();
        throw new Error('非 JSON 回應: '+text.slice(0,120));
      }
      return await resp.json();
    }
    const apiGet = (p)=>apiRequest('GET',p);
    const apiPost=(action,data)=>apiRequest('POST',{action,...data});

    /***********************
     * 活動資料載入
     ***********************/
    async function fetchAllEvents(activeOnly=true){
      return await apiGet({ action:'getAllEvents', activeOnly:String(activeOnly) });
    }
    async function fetchEventStats(eventId){
      return await apiGet({ action:'getEventStats', eventId });
    }
    async function fetchSystemStats(){
      return await apiGet({ action:'getSystemStats' });
    }

    /***********************
     * 頁面切換
     ***********************/
    function showPage(p){
      currentPage=p;
      document.querySelectorAll('#mainNav a').forEach(a=>a.classList.remove('nav-active'));
      const idxMap={ home:0, batch:1, admin:2 };
      if(idxMap[p]!=null) document.querySelectorAll('#mainNav a')[idxMap[p]].classList.add('nav-active');
      if(p==='home') loadHomePage();
      else if(p==='batch') loadBatchPage();
      else if(p==='admin') loadAdminPage();
      else loadHomePage();
    }

    /***********************
     * 首頁
     ***********************/
    async function loadHomePage(){
      document.getElementById('pageTitle').textContent='🏃‍♂️ 三鐵活動報名';
      const html=`
        <div class="page-header">
          <div class="title-section">
            <h2>🏃‍♂️ 活動列表</h2>
            <div class="event-count">載入中...</div>
          </div>
          <div class="toolbar">
            <div class="search-box">
              <input type="text" id="eventSearch" placeholder="🔍 搜尋活動..." onkeyup="searchEvents(this.value)">
            </div>
            <button onclick="refreshEvents()" class="refresh-btn">🔄 重新載入</button>
          </div>
        </div>
        <div class="filter-section">
          <div class="filter-bar" id="categoryFilter">
            <div class="chip active" data-category="">全部活動</div>
            ${gSystemInfo.categories.map(c=>`<div class="chip" data-category="${c}">${c}</div>`).join('')}
          </div>
        </div>
        <div id="eventsContainer"></div>
        <div class="card" style="margin-top:24px;">
          <h3>📱 LINE 整合功能</h3>
          <div style="margin-top:16px;">
            <div class="msg info">登入後報名表單會自動填入姓名。</div>
            <div style="margin-top:16px;">
              <h4>🔧 狀態：</h4>
              <div style="display:grid;gap:6px;margin-top:6px;">
                <div>LIFF 連接：<span id="homeLiffStatus"></span></div>
                <div>登入狀態：<span id="homeLoginStatus"></span></div>
                <div>使用者名稱：<span id="homeUserName">未登入</span></div>
              </div>
            </div>
          </div>
        </div>`;
      document.getElementById('mainContent').innerHTML=html;
      document.querySelectorAll('#categoryFilter .chip').forEach(ch=>{
        ch.onclick=()=>filterByCategory(ch.dataset.category);
      });
      updateHomeStatus();
      await refreshEvents();
    }
    function updateHomeStatus(){
      const liffStatusEl=document.getElementById('homeLiffStatus');
      const loginStatusEl=document.getElementById('homeLoginStatus');
      const userNameEl=document.getElementById('homeUserName');
      if(liffStatusEl){ liffStatusEl.textContent=liffInitialized?'✅ 已連接':'❌ 未連接'; liffStatusEl.style.color=liffInitialized?'#2e7d32':'#c62828'; }
      if(loginStatusEl){ loginStatusEl.textContent=gProfile.isLoggedIn?'✅ 已登入':'❌ 未登入'; loginStatusEl.style.color=gProfile.isLoggedIn?'#2e7d32':'#c62828'; }
      if(userNameEl){ userNameEl.textContent=gProfile.isLoggedIn?gProfile.displayName:'未登入'; }
    }
    async function refreshEvents(){
      const container=document.getElementById('eventsContainer');
      const count=document.querySelector('.event-count');
      showLoading(container,'載入活動列表...');
      try{
        const res=await fetchAllEvents(true);
        if(!res.success) throw new Error(res.message||'載入失敗');
        allEvents=(res.events||[]).map(ev=>{
          // 後端已提供 used / remain / active
          return ev;
        });
        filteredEvents=[...allEvents];
        renderEventList();
        if(count) count.textContent=`共 ${allEvents.length} 個活動`;
      }catch(e){
        container.innerHTML=`<div class="empty-state"><p>❌ 載入失敗</p><p class="small">${htmlEscape(e.message)}</p><button onclick="refreshEvents()" style="margin-top:16px;">重試</button></div>`;
      }
    }
    function renderEventList(){
      const container=document.getElementById('eventsContainer');
      if(!filteredEvents.length){
        container.innerHTML=`<div class="empty-state"><p>📅 沒有符合條件的活動</p><p class="small">請調整篩選或關鍵字</p></div>`;
        return;
      }
      container.innerHTML=`<div class="grid cols-3">${filteredEvents.map(createEventCard).join('')}</div>`;
    }
    function createEventCard(ev){
      const remainClass = ev.remain>10?'ok':ev.remain>0?'low':'full';
      const percent = ev.capacity>0? Math.round((ev.used/ev.capacity)*100):0;
      return `
        <div class="card event-card fade-in">
          <div class="event-header">
            <div class="event-title">
              <h3>${htmlEscape(ev.name)}</h3>
              <div class="event-meta">
                <span class="badge ${htmlEscape(ev.category)}">${htmlEscape(ev.category)}</span>
                <span class="event-id">${ev.eventId}</span>
              </div>
            </div>
          </div>
          ${ev.date?`<div style="margin-bottom:8px;font-size:14px;color:#666;">📅 ${htmlEscape(ev.date)}</div>`:''}
          ${ev.location?`<div style="margin-bottom:8px;font-size:14px;color:#666;">📍 ${htmlEscape(ev.location)}</div>`:''}
          <div class="quota-info">
            <div class="quota-text">
              <span>👥 ${ev.used}/${ev.capacity}</span>
              <span class="remain ${remainClass}">剩餘 ${ev.remain}</span>
            </div>
            <div class="quota-bar"><div class="quota-fill" style="width:${percent}%"></div></div>
          </div>
          ${ev.description?`<div style="margin-bottom:12px;font-size:14px;color:#555;">${htmlEscape(truncateText(ev.description,90))}</div>`:''}
          <div class="event-actions">
            <button onclick="registerForEvent('${ev.eventId}')" ${ev.remain<=0?'class="warning"':''}>${ev.remain>0?'📝 立即報名':'📋 候補報名'}</button>
            <button class="secondary" onclick="showEventStats('${ev.eventId}')">📊 查看統計</button>
          </div>
        </div>`;
    }
    const searchEvents = (function(){
      let t; return function(q){
        clearTimeout(t);
        t=setTimeout(()=>{
          const kw=q.toLowerCase().trim();
          filteredEvents = !kw? [...allEvents] :
            allEvents.filter(e=>
              (e.name||'').toLowerCase().includes(kw) ||
              (e.eventId||'').toLowerCase().includes(kw) ||
              (e.category||'').toLowerCase().includes(kw) ||
              (e.description||'').toLowerCase().includes(kw)
            );
          renderEventList();
          const count=document.querySelector('.event-count');
          if(count) count.textContent=`顯示 ${filteredEvents.length} / ${allEvents.length} 個活動`;
        },250);
      }
    })();
    function filterByCategory(cat){
      document.querySelectorAll('#categoryFilter .chip').forEach(c=>c.classList.remove('active'));
      const target=document.querySelector(`#categoryFilter .chip[data-category="${cat}"]`);
      if(target) target.classList.add('active');
      filteredEvents = !cat? [...allEvents] : allEvents.filter(e=>e.category===cat);
      renderEventList();
      const count=document.querySelector('.event-count');
      if(count) count.textContent=`顯示 ${filteredEvents.length} / ${allEvents.length} 個活動`;
    }

    /***********************
     * 單筆報名
     ***********************/
    function registerForEvent(eventId){
      const ev=allEvents.find(e=>e.eventId===eventId);
      if(!ev){ showNotification('找不到活動','error'); return; }
      openModal(`
        <button class="close-btn">✕</button>
        <h2>📝 活動報名 - ${htmlEscape(ev.name)}</h2>
        <div class="modal-content">
          <div class="batch-info">
            <div><strong>活動ID：</strong>${ev.eventId}</div>
            <div><strong>分類：</strong>${ev.category}</div>
            <div><strong>名額：</strong>${ev.used}/${ev.capacity} 剩 ${ev.remain}</div>
          </div>
          ${gProfile.isLoggedIn?`<div class="msg success">✅ 已登入，將可自動填入姓名</div>`:
            `<div class="msg info">💡 建議先登入 LINE 取得自動填入 <button onclick="handleAuth()" style="padding:4px 8px;font-size:12px;margin-left:8px;">立即登入</button></div>`}
          <form id="registerForm">
            <input type="hidden" name="eventId" value="${ev.eventId}">
            <div class="form-group">
              <label>姓名 *</label>
              <input type="text" name="name" required placeholder="請輸入姓名" value="${gProfile.isLoggedIn?htmlEscape(gProfile.displayName):''}">
            </div>
            <div class="form-group">
              <label>電話</label>
              <input type="tel" name="phone" placeholder="請輸入聯絡電話">
            </div>
            <div class="form-group">
              <label>備註</label>
              <textarea name="note" rows="3" placeholder="其他備註"></textarea>
            </div>
            ${ev.remain<=0?'<div class="msg warning">⚠️ 名額已滿，將列候補</div>':''}
            <div class="form-actions">
              <button type="submit">送出</button>
              <button type="button" class="secondary" onclick="closeModal()">取消</button>
            </div>
          </form>
          <div id="registerMsg"></div>
        </div>
      `);
      document.getElementById('registerForm').addEventListener('submit',handleRegisterSubmit);
    }
    async function handleRegisterSubmit(e){
      e.preventDefault();
      const form=e.target;
      const btn=form.querySelector('button[type="submit"]');
      const msgDiv=document.getElementById('registerMsg');
      setButtonLoading(btn,true);
      msgDiv.innerHTML='';
      try{
        const fd=new FormData(form);
        const payload={
          eventId: fd.get('eventId'),
          name: fd.get('name').trim(),
          phone: fd.get('phone').trim(),
          note: fd.get('note').trim(),
          userId: gProfile.userId || '',
          displayName: gProfile.displayName || '',
          source:'web_liff'
        };
        if(!payload.name) throw new Error('請輸入姓名');
        const res=await apiPost('registerEvent',payload);
        if(res.success){
          showMessage(msgDiv,`✅ 報名成功！狀態：${res.status==='confirmed'?'正選':'候補'}`,'success');
          setTimeout(()=>{ closeModal(); refreshEvents(); showNotification('報名成功','success'); },1500);
        } else {
          showMessage(msgDiv,res.message||'報名失敗','error');
        }
      }catch(err){
        showMessage(msgDiv,'報名失敗：'+err.message,'error');
      }finally{
        setButtonLoading(btn,false);
      }
    }

    /***********************
     * 活動統計
     ***********************/
    async function showEventStats(eventId){
      try{
        const res=await fetchEventStats(eventId);
        if(!res.success){ showNotification('載入失敗','error'); return; }
        const st=res.stats;
        openModal(`
          <button class="close-btn">✕</button>
          <h2>📊 活動統計 - ${htmlEscape(st.eventName||eventId)}</h2>
          <div class="modal-content">
            <div class="stats-grid">
              <div class="stat-card"><div class="stat-number">${st.total||0}</div><div class="stat-label">總報名</div></div>
              <div class="stat-card success"><div class="stat-number">${st.confirmed||0}</div><div class="stat-label">正選</div></div>
              <div class="stat-card warning"><div class="stat-number">${st.waiting||0}</div><div class="stat-label">候補</div></div>
              <div class="stat-card error"><div class="stat-number">${st.cancelled||0}</div><div class="stat-label">取消</div></div>
            </div>
            ${st.registrations && st.registrations.length?`
              <div style="margin-top:20px;">
                <h4>📋 名單 (依時間)</h4>
                <div style="max-height:300px;overflow:auto;border:1px solid #eee;">
                  <table style="width:100%;border-collapse:collapse;">
                    <thead style="background:#f8f9fa;">
                      <tr>
                        <th style="padding:8px;border-bottom:1px solid #e0e0e0;">姓名</th>
                        <th style="padding:8px;border-bottom:1px solid #e0e0e0;">狀態</th>
                        <th style="padding:8px;border-bottom:1px solid #e0e0e0;">時間</th>
                      </tr>
                    </thead>
                    <tbody>
                      ${st.registrations.map(r=>`
                        <tr>
                          <td style="padding:8px;border-bottom:1px solid #f0f0f0;">${htmlEscape(r.name)}</td>
                          <td style="padding:8px;border-bottom:1px solid #f0f0f0;">${r.status==='confirmed'?'✅ 正選':r.status==='waiting'?'⏳ 候補':'❌ 取消'}</td>
                          <td style="padding:8px;border-bottom:1px solid #f0f0f0;font-size:12px;">${htmlEscape(r.registrationTime||'')}</td>
                        </tr>`).join('')}
                    </tbody>
                  </table>
                </div>
              </div>`:''}
            <div class="form-actions" style="margin-top:20px;">
              <button type="button" class="secondary" onclick="closeModal()">關閉</button>
            </div>
          </div>
        `);
      }catch(e){
        showNotification('統計載入失敗：'+e.message,'error');
      }
    }

    /***********************
     * 批次報名頁
     ***********************/
    async function loadBatchPage(){
      document.getElementById('pageTitle').textContent='📝 批次報名';
      const html=`

    async function loadBatchEventSelector(){
      const c=document.getElementById('batchEventSelector');
      showLoading(c,'載入活動...');
      if(!allEvents.length) await refreshEvents();
      const available=allEvents.filter(e=>e.remain>0);
      if(!available.length){
        c.innerHTML='<div class="empty-state"><p>目前無可報名活動</p></div>'; return;
      }
      c.innerHTML=`<div class="grid cols-3">${available.map(e=>`
        <div class="card" style="cursor:pointer;" onclick="selectBatchEvent('${e.eventId}')">

          <div style="font-size:12px;color:#666;">${e.category} | 剩 ${e.remain}</div>

        </div>`).join('')}</div>`;

    function selectBatchEvent(eventId){
      const ev=allEvents.find(e=>e.eventId===eventId);
      if(!ev) return;
      document.getElementById('batchEventId').value=ev.eventId;
      document.getElementById('selectedEventInfo').innerHTML=`
        <div class="batch-info">
          <strong>活動：</strong>${htmlEscape(ev.name)} (${ev.eventId})<br>
          <strong>分類：</strong>${ev.category}<br>
          <strong>剩餘名額：</strong>${ev.remain}
        </div>`;
      document.getElementById('batchFormContainer').style.display='block';
      document.getElementById('batchFormContainer').scrollIntoView({behavior:'smooth'});
    }
    function setupBatchForm(){
      const ta=document.getElementById('batchNameList');
      const counter=document.getElementById('nameCounter');
      ta.addEventListener('input',()=>{
        const names=parseNameList(ta.value);
        counter.textContent=names.length+' 人';
        if(names.length){
          showBatchPreview(names);
        }else{
          document.getElementById('batchPreview').style.display='none';
        }
      });
      document.getElementById('batchRegisterForm').addEventListener('submit',handleBatchSubmit);
    }
    function parseNameList(txt){
      if(!txt.trim()) return [];
      let arr= txt.includes(',') ? txt.split(',') : txt.split('\n');
      arr = arr.map(s=>s.trim()).filter(s=>s);
      return [...new Set(arr)];
    }
    function showBatchPreview(names){
      const pv=document.getElementById('batchPreview');
      const list=document.getElementById('batchPreviewList');
      list.innerHTML=names.map((n,i)=>`<div class="preview-item">${i+1}. ${htmlEscape(n)}</div>`).join('');
      pv.style.display='block';
    }
    async function handleBatchSubmit(e){
      e.preventDefault();
      const form=e.target;
      const btn=document.getElementById('batchSubmitBtn');
      const msg=document.getElementById('batchMsg');
      setButtonLoading(btn,true);
      msg.innerHTML='';
      try{
        const fd=new FormData(form);
        const names=parseNameList(fd.get('nameList'));
        if(!names.length) throw new Error('請至少輸入一個姓名');
        const payload={
          eventId: fd.get('eventId'),
          names,
          contactPhone: fd.get('contactPhone').trim(),
          note: fd.get('batchNote').trim(),
          userId: gProfile.userId || '',
          displayName: gProfile.displayName || '',
          source:'web_liff_batch'
        };
        const res=await apiPost('batchRegister',payload);
          if(res.success){
            showMessage(msg,`✅ 批次報名成功！
正選/候補狀態：${res.status}
報名總數：${names.length}`,'success');
            setTimeout(()=>{ resetBatchForm(); showPage('home'); showNotification('批次報名完成','success'); },1800);
          } else {
            showMessage(msg,res.message||'批次報名失敗','error');
          }
      }catch(err){
        showMessage(msg,'批次報名失敗：'+err.message,'error');
      }finally{
        setButtonLoading(btn,false);
      }
    }
    function resetBatchForm(){
      document.getElementById('batchRegisterForm').reset();
      document.getElementById('batchFormContainer').style.display='none';
      document.getElementById('batchPreview').style.display='none';
      document.getElementById('nameCounter').textContent='0 人';
      document.getElementById('batchMsg').innerHTML='';
    }

        if(res.success){
          showMessage(msg,'✅ 更新成功','success');
          setTimeout(()=>{ closeModal(); loadAdminEvents(); refreshEvents(); },1000);
        } else showMessage(msg,res.message||'更新失敗','error');
      }catch(err){
        showMessage(msg,'更新失敗：'+err.message,'error');
      }finally{
        setButtonLoading(btn,false);
      }
    }
    async function toggleEventStatus(eventId,newStatus){
      try{
        const res=await apiPost('toggleEventStatus',{ eventId, active:newStatus });
        if(res.success){
          showNotification('操作成功','success');
          loadAdminEvents();
          refreshEvents();
        } else {
          showNotification(res.message||'操作失敗','error');
        }
      }catch(e){
        showNotification('操作失敗：'+e.message,'error');
      }
    }
    async function changeRegistrationStatus(regId,status){
      try{
        const res=await apiPost('updateRegistrationStatus',{ registrationId:regId, status });
        if(res.success){
          showNotification('狀態已更新','success');
          loadAdminRegistrations();
          refreshEvents();
        } else showNotification(res.message||'更新失敗','error');
      }catch(e){
        showNotification('更新失敗：'+e.message,'error');
      }
    }
    function refreshStats(){ loadAdminStats(); }

    /***********************
     * 啟動
     ***********************/
    document.addEventListener('DOMContentLoaded', async () => {
      try{
        const saved=localStorage.getItem('triathlon_settings');
        if(saved){
          const s=JSON.parse(saved);
          if(s.liffId) CONFIG.LIFF_ID=s.liffId;
          if(s.apiEndpoint) CONFIG.API_BASE_URL=s.apiEndpoint;
        }
      }catch(_){}
      await initializeLiff();
      showPage('home');
    });
    window.addEventListener('error',e=>{ console.error(e); showNotification('發生錯誤','error'); });
    window.addEventListener('unhandledrejection',e=>{ console.error(e); showNotification('操作失敗','error'); });
  </script>
</body>
</html>
