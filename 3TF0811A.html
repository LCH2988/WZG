<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理員設定 - 多活動報名系統</title>
  <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
          font-family: 'Microsoft JhengHei', Arial, sans-serif;
          background: linear-gradient(135deg, #2c3e50, #3498db);
          min-height: 100vh;
          padding: 20px;
      }
      .admin-container {
          max-width: 1000px;
          margin: 0 auto;
          background: white;
          border-radius: 15px;
          box-shadow: 0 10px 30px rgba(0,0,0,0.3);
          overflow: hidden;
      }
      .admin-header {
          background: linear-gradient(135deg, #2c3e50, #3498db);
          color: white;
          padding: 30px;
          text-align: center;
      }
      .admin-header h1 { font-size: 2.2em; margin-bottom: 10px; }
      .admin-header p { font-size: 1.1em; opacity: 0.9; }
      
      .admin-nav {
          display: flex;
          background: #ecf0f1;
          border-bottom: 2px solid #bdc3c7;
      }
      .admin-nav-item {
          flex: 1;
          padding: 15px;
          text-align: center;
          cursor: pointer;
          border: none;
          background: transparent;
          font-size: 16px;
          font-weight: bold;
          transition: all 0.3s;
      }
      .admin-nav-item.active {
          background: white;
          color: #2c3e50;
          border-bottom: 3px solid #3498db;
      }
      .admin-nav-item:hover:not(.active) {
          background: #d5dbdb;
      }
      
      .admin-content {
          padding: 30px;
      }
      .admin-section {
          display: none;
      }
      .admin-section.active { display: block; }
      
      .config-card {
          background: #f8f9fa;
          border: 2px solid #e9ecef;
          border-radius: 12px;
          padding: 25px;
          margin-bottom: 20px;
          transition: all 0.3s;
      }
      .config-card:hover {
          border-color: #3498db;
          box-shadow: 0 5px 15px rgba(52, 152, 219, 0.1);
      }
      .config-card h3 {
          color: #2c3e50;
          margin-bottom: 20px;
          padding-bottom: 10px;
          border-bottom: 2px solid #e9ecef;
          display: flex;
          align-items: center;
          gap: 10px;
      }
      
      .form-grid {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
          gap: 20px;
          margin-bottom: 20px;
      }
      .form-group {
          margin-bottom: 15px;
      }
      .form-group label {
          display: block;
          margin-bottom: 8px;
          font-weight: bold;
          color: #2c3e50;
      }
      .form-group input,
      .form-group textarea,
      .form-group select {
          width: 100%;
          padding: 12px;
          border: 2px solid #bdc3c7;
          border-radius: 8px;
          font-size: 14px;
          transition: border-color 0.3s;
      }
      .form-group input:focus,
      .form-group textarea:focus,
      .form-group select:focus {
          outline: none;
          border-color: #3498db;
          box-shadow: 0 0 5px rgba(52, 152, 219, 0.3);
      }
      
      .checkbox-group {
          display: flex;
          align-items: center;
          gap: 10px;
          margin-top: 10px;
      }
      .checkbox-group input[type="checkbox"] {
          width: auto;
          transform: scale(1.2);
      }
      
      .btn-group {
          display: flex;
          gap: 10px;
          margin-top: 20px;
      }
      .btn {
          padding: 12px 24px;
          border: none;
          border-radius: 8px;
          cursor: pointer;
          font-size: 14px;
          font-weight: bold;
          transition: all 0.3s;
          display: flex;
          align-items: center;
          gap: 8px;
      }
      .btn-primary {
          background: #3498db;
          color: white;
      }
      .btn-primary:hover {
          background: #2980b9;
          transform: translateY(-2px);
      }
      .btn-success {
          background: #27ae60;
          color: white;
      }
      .btn-success:hover {
          background: #229954;
          transform: translateY(-2px);
      }
      .btn-warning {
          background: #f39c12;
          color: white;
      }
      .btn-warning:hover {
          background: #e67e22;
          transform: translateY(-2px);
      }
      .btn-danger {
          background: #e74c3c;
          color: white;
      }
      .btn-danger:hover {
          background: #c0392b;
          transform: translateY(-2px);
      }
      
      .status-indicator {
          display: inline-block;
          width: 12px;
          height: 12px;
          border-radius: 50%;
          margin-right: 8px;
      }
      .status-active { background: #27ae60; }
      .status-inactive { background: #e74c3c; }
      
      .field-builder {
          background: white;
          border: 2px solid #e9ecef;
          border-radius: 10px;
          padding: 20px;
          margin-top: 20px;
      }
      .field-list {
          max-height: 400px;
          overflow-y: auto;
          border: 2px solid #e9ecef;
          border-radius: 8px;
          margin-bottom: 20px;
      }
      .field-item {
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 15px;
          border-bottom: 1px solid #e9ecef;
          background: white;
          transition: background 0.3s;
      }
      .field-item:hover {
          background: #f8f9fa;
      }
      .field-item:last-child {
          border-bottom: none;
      }
      .field-info h4 {
          color: #2c3e50;
          margin-bottom: 5px;
      }
      .field-details {
          font-size: 0.9em;
          color: #7f8c8d;
      }
      
      .preview-section {
          background: #f8f9fa;
          border: 2px dashed #bdc3c7;
          border-radius: 10px;
          padding: 20px;
          margin-top: 20px;
      }
      .preview-form {
          background: white;
          padding: 20px;
          border-radius: 8px;
          border: 1px solid #e9ecef;
      }
      
      .stats-overview {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
          gap: 20px;
          margin-bottom: 30px;
      }
      .stats-card {
          background: white;
          border: 2px solid #e9ecef;
          border-radius: 10px;
          padding: 20px;
          text-align: center;
          transition: all 0.3s;
      }
      .stats-card:hover {
          transform: translateY(-3px);
          box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      }
      .stats-number {
          font-size: 2.5em;
          font-weight: bold;
          margin-bottom: 10px;
      }
      .stats-label {
          color: #7f8c8d;
          font-size: 1.1em;
      }
      
      @media (max-width: 768px) {
          .form-grid {
              grid-template-columns: 1fr;
          }
          .admin-nav {
              flex-direction: column;
          }
          .btn-group {
              flex-direction: column;
          }
      }
  </style>
</head>
<body>
  <div class="admin-container">
      <div class="admin-header">
          <h1>⚙️ 管理員控制台</h1>
          <p>多活動類別報名系統管理介面</p>
      </div>
      
      <div class="admin-nav">
          <button class="admin-nav-item active" onclick="switchAdminTab('overview')">📊 系統總覽</button>
          <button class="admin-nav-item" onclick="switchAdminTab('events')">🎪 活動管理</button>
          <button class="admin-nav-item" onclick="switchAdminTab('forms')">📝 表單設計</button>
          <button class="admin-nav-item" onclick="switchAdminTab('settings')">🔧 系統設定</button>
      </div>
      
      <div class="admin-content">
          <!-- 系統總覽 -->
          <div id="overview" class="admin-section active">
              <h2>📊 系統總覽</h2>
              <div class="stats-overview" id="systemStats">
                  <!-- 統計卡片將由 JavaScript 動態生成 -->
              </div>
              
              <div class="config-card">
                  <h3>🎯 快速操作</h3>
                  <div class="btn-group">
                      <button class="btn btn-primary" onclick="exportAllData()">
                          📤 匯出所有資料
                      </button>
                      <button class="btn btn-warning" onclick="backupSystem()">
                          💾 系統備份
                      </button>
                      <button class="btn btn-success" onclick="sendBroadcast()">
                          📢 發送廣播
                      </button>
                  </div>
              </div>
          </div>
          
          <!-- 活動管理 -->
          <div id="events" class="admin-section">
              <h2>🎪 活動管理</h2>
              <div id="eventManagement">
                  <!-- 活動管理卡片將由 JavaScript 動態生成 -->
              </div>
          </div>
          
          <!-- 表單設計 -->
          <div id="forms" class="admin-section">
              <h2>📝 表單設計器</h2>
              
              <div class="config-card">
                  <h3>🎯 選擇活動類別</h3>
                  <div class="form-group">
                      <select id="formDesignCategory" onchange="loadFormDesigner()">
                          <option value="">請選擇要設計的活動類別</option>
                          <option value="mountain">🏔️ 登山組</option>
                          <option value="cycling">🚴‍♂️ 單車組</option>
                          <option value="running">🏃‍♂️ 跑步組</option>
                          <option value="water">🏊‍♂️ 水上組</option>
                      </select>
                  </div>
              </div>
              
              <div id="formDesigner" style="display: none;">
                  <div class="config-card">
                      <h3>📋 目前表單欄位</h3>
                      <div id="currentFields" class="field-list">
                          <!-- 欄位列表 -->
                      </div>
                  </div>
                  
                  <div class="field-builder">
                      <h3>➕ 新增表單欄位</h3>
                      <div class="form-grid">
                          <div class="form-group">
                              <label>欄位識別碼 *</label>
                              <input type="text" id="fieldId" placeholder="例如: phone">
                          </div>
                          <div class="form-group">
                              <label>欄位標籤 *</label>
                              <input type="text" id="fieldLabel" placeholder="例如: 手機號碼">
                          </div>
                          <div class="form-group">
                              <label>欄位類型</label>
                              <select id="fieldType" onchange="toggleFieldOptions()">
                                  <option value="text">文字輸入</option>
                                  <option value="email">Email</option>
                                  <option value="tel">電話號碼</option>
                                  <option value="date">日期</option>
                                  <option value="select">下拉選單</option>
                                  <option value="textarea">多行文字</option>
                                  <option value="checkbox">核取方塊</option>
                                  <option value="radio">單選按鈕</option>
                              </select>
                          </div>
                          <div class="form-group">
                              <label>是否必填</label>
                              <select id="fieldRequired">
                                  <option value="false">否</option>
                                  <option value="true">是</option>
                              </select>
                          </div>
                      </div>
                      
                      <div class="form-group" id="fieldOptionsGroup" style="display: none;">
                          <label>選項設定（每行一個選項）</label>
                          <textarea id="fieldOptions" rows="4" placeholder="選項1&#10;選項2&#10;選項3"></textarea>
                      </div>
                      
                      <div class="form-group">
                          <label>欄位說明（選填）</label>
                          <input type="text" id="fieldPlaceholder" placeholder="輸入欄位提示文字">
                      </div>
                      
                      <div class="btn-group">
                          <button class="btn btn-primary" onclick="addFormField()">➕ 新增欄位</button>
                          <button class="btn btn-success" onclick="saveFormDesign()">💾 儲存表單</button>
                          <button class="btn btn-warning" onclick="previewForm()">👁️ 預覽表單</button>
                      </div>
                  </div>
                  
                  <div id="formPreview" class="preview-section" style="display: none;">
                      <h3>👁️ 表單預覽</h3>
                      <div id="previewContent" class="preview-form">
                          <!-- 預覽內容 -->
                      </div>
                  </div>
              </div>
          </div>
          
          <!-- 系統設定 -->
          <div id="settings" class="admin-section">
              <h2>🔧 系統設定</h2>
              
              <div class="config-card">
                  <h3>🔐 權限管理</h3>
                  <div class="form-group">
                      <label>管理員 LINE ID 列表（每行一個）</label>
                      <textarea id="adminUsers" rows="5" placeholder="輸入管理員的 LINE User ID"></textarea>
                  </div>
                  <div class="btn-group">
                      <button class="btn btn-success" onclick="saveAdminUsers()">💾 儲存權限設定</button>
                  </div>
              </div>
              
              <div class="config-card">
                  <h3>📢 通知設定</h3>
                  <div class="form-group">
                      <label>通知群組 ID</label>
                      <input type="text" id="notificationGroup" placeholder="輸入 LINE 群組 ID">
                  </div>
                  <div class="checkbox-group">
                      <input type="checkbox" id="enableNotifications">
                      <label>啟用報名通知</label>
                  </div>
                  <div class="checkbox-group">
                      <input type="checkbox" id="enableDailyReport">
                      <label>啟用每日報表</label>
                  </div>
                  <div class="btn-group">
                      <button class="btn btn-success" onclick="saveNotificationSettings()">💾 儲存通知設定</button>
                      <button class="btn btn-primary" onclick="testNotification()">📤 測試通知</button>
                  </div>
              </div>
              
              <div class="config-card">
                  <h3>🎨 介面設定</h3>
                  <div class="form-grid">
                      <div class="form-group">
                          <label>系統標題</label>
                          <input type="text" id="systemTitle" placeholder="多活動類別報名系統">
                      </div>
                      <div class="form-group">
                          <label>系統副標題</label>
                          <input type="text" id="systemSubtitle" placeholder="登山 • 單車 • 跑步 • 水上運動">
                      </div>
                  </div>
                  <div class="form-group">
                      <label>系統公告</label>
                      <textarea id="systemAnnouncement" rows="3" placeholder="輸入系統公告內容"></textarea>
                  </div>
                  <div class="btn-group">
                      <button class="btn btn-success" onclick="saveInterfaceSettings()">💾 儲存介面設定</button>
                  </div>
              </div>
              
              <div class="config-card">
                  <h3>🗄️ 資料管理</h3>
                  <div class="btn-group">
                      <button class="btn btn-primary" onclick="exportData()">📤 匯出資料</button>
                      <button class="btn btn-warning" onclick="clearOldData()">🧹 清理舊資料</button>
                      <button class="btn btn-danger" onclick="resetSystem()">🔄 重置系統</button>
                  </div>
              </div>
          </div>
      </div>
  </div>

  <script>
      // 全域變數
      let currentFormFields = [];
      let currentDesignCategory = '';
      const eventCategories = {
          mountain: { name: "登山組", icon: "🏔️", color: "#4CAF50" },
          cycling: { name: "單車組", icon: "🚴‍♂️", color: "#2196F3" },
          running: { name: "跑步組", icon: "🏃‍♂️", color: "#FF9800" },
          water: { name: "水上組", icon: "🏊‍♂️", color: "#00BCD4" }
      };
      
      const GAS_URL = 'https://script.google.com/macros/s/AKfycbyv5hojvMw42soOpImHEdxGJd422L2d__eYSxQpSEKetmrD5p3ztSxeccj6qK0EfrHz/exec';
      
      // 頁面載入時初始化
      document.addEventListener('DOMContentLoaded', function() {
          loadSystemOverview();
          loadEventManagement();
          loadSystemSettings();
      });
      
      // 切換管理員分頁
      function switchAdminTab(tabName) {
          // 隱藏所有分頁內容
          document.querySelectorAll('.admin-section').forEach(section => {
              section.classList.remove('active');
          });
          
          // 移除所有分頁按鈕的 active 狀態
          document.querySelectorAll('.admin-nav-item').forEach(item => {
              item.classList.remove('active');
          });
          
          // 顯示選中的分頁內容
          document.getElementById(tabName).classList.add('active');
          
          // 添加選中分頁按鈕的 active 狀態
          event.target.classList.add('active');
          
          // 根據分頁載入對應內容
          switch(tabName) {
              case 'overview':
                  loadSystemOverview();
                  break;
              case 'events':
                  loadEventManagement();
                  break;
              case 'forms':
                  // 表單設計頁面不需要額外載入
                  break;
              case 'settings':
                  loadSystemSettings();
                  break;
          }
      }
      
      // 載入系統總覽
      function loadSystemOverview() {
          const statsContainer = document.getElementById('systemStats');
          
          // 創建統計卡片
          let statsHtml = '';
          for (let category in eventCategories) {
              const info = eventCategories[category];
              // 模擬數據，實際應從 API 獲取
              const confirmed = Math.floor(Math.random() * 40) + 5;
              const waitlist = Math.floor(Math.random() * 10);
              
              statsHtml += `
                  <div class="stats-card" style="border-color: ${info.color};">
                      <div class="stats-number" style="color: ${info.color};">${confirmed}</div>
                      <div class="stats-label">${info.icon} ${info.name}</div>
                      <div style="font-size: 0.9em; color: #7f8c8d; margin-top: 5px;">
                          候補: ${waitlist} 人
                      </div>
                  </div>
              `;
          }
          
          // 總計卡片
          const totalConfirmed = Object.keys(eventCategories).reduce((sum, category) => 
              sum + Math.floor(Math.random() * 40) + 5, 0);
          const totalWaitlist = Object.keys(eventCategories).reduce((sum, category) => 
              sum + Math.floor(Math.random() * 10), 0);
          
          statsHtml += `
              <div class="stats-card" style="border-color: #9b59b6; background: linear-gradient(135deg, #9b59b6, #8e44ad); color: white;">
                  <div class="stats-number">${totalConfirmed}</div>
                  <div class="stats-label">📊 總報名人數</div>
                  <div style="font-size: 0.9em; margin-top: 5px; opacity: 0.9;">
                      候補: ${totalWaitlist} 人
                  </div>
              </div>
          `;
          
          statsContainer.innerHTML = statsHtml;
      }
      
      // 載入活動管理
      function loadEventManagement() {
          const managementContainer = document.getElementById('eventManagement');
          let managementHtml = '';
          
          for (let category in eventCategories) {
              const info = eventCategories[category];
              managementHtml += `
                  <div class="config-card">
                      <h3>
                          <span class="status-indicator status-active"></span>
                          ${info.icon} ${info.name}
                      </h3>
                      <div class="form-grid">
                          <div class="form-group">
                              <label>活動標題</label>
                              <input type="text" id="${category}_title" placeholder="輸入活動標題">
                          </div>
                          <div class="form-group">
                              <label>報名上限</label>
                              <input type="number" id="${category}_max" placeholder="50" min="1">
                          </div>
                      </div>
                      <div class="form-group">
                          <label>活動說明</label>
                          <textarea id="${category}_description" rows="3" placeholder="輸入活動說明"></textarea>
                      </div>
                      <div class="form-group">
                          <label>活動日期</label>
                          <input type="date" id="${category}_date">
                      </div>
                      <div class="form-group">
                          <label>活動地點</label>
                          <input type="text" id="${category}_location" placeholder="輸入活動地點">
                      </div>
                      <div class="checkbox-group">
                          <input type="checkbox" id="${category}_active">
                          <label>啟用此活動</label>
                      </div>
                      <div class="btn-group">
                          <button class="btn btn-primary" onclick="updateEventConfig('${category}')">
                              💾 更新設定
                          </button>
                          <button class="btn btn-success" onclick="viewEventStats('${category}')">
                              📊 查看統計
                          </button>
                          <button class="btn btn-warning" onclick="exportEventData('${category}')">
                              📤 匯出資料
                          </button>
                      </div>
                  </div>
              `;
          }
          
          managementContainer.innerHTML = managementHtml;
      }
      
      // 載入表單設計器
      function loadFormDesigner() {
          const category = document.getElementById('formDesignCategory').value;
          if (!category) {
              document.getElementById('formDesigner').style.display = 'none';
              return;
          }
          
          currentDesignCategory = category;
          document.getElementById('formDesigner').style.display = 'block';
          
          // 載入現有欄位（模擬數據）
          currentFormFields = [
              { id: 'name', label: '姓名', type: 'text', required: true, options: [], placeholder: '請輸入您的姓名' }
          ];
          
          renderCurrentFields();
      }
      
      // 渲染目前欄位
      function renderCurrentFields() {
          const container = document.getElementById('currentFields');
          container.innerHTML = '';
          
          currentFormFields.forEach((field, index) => {
              const fieldHtml = `
                  <div class="field-item">
                      <div class="field-info">
                          <h4>${field.label} (${field.id})</h4>
                          <div class="field-details">
                              類型: ${getFieldTypeLabel(field.type)} | 
                              必填: ${field.required ? '是' : '否'}
                              ${field.options.length > 0 ? ` | 選項: ${field.options.join(', ')}` : ''}
                          </div>
                      </div>
                      <div class="btn-group">
                          ${field.id !== 'name' ? `
                              <button class="btn btn-warning" onclick="editFormField(${index})">✏️ 編輯</button>
                              <button class="btn btn-danger" onclick="removeFormField(${index})">🗑️ 刪除</button>
                          ` : '<span style="color: #7f8c8d;">基本欄位</span>'}
                      </div>
                  </div>
              `;
              container.innerHTML += fieldHtml;
          });
      }
      
      // 切換欄位選項顯示
      function toggleFieldOptions() {
          const fieldType = document.getElementById('fieldType').value;
          const optionsGroup = document.getElementById('fieldOptionsGroup');
          
          if (['select', 'radio', 'checkbox'].includes(fieldType)) {
              optionsGroup.style.display = 'block';
          } else {
              optionsGroup.style.display = 'none';
          }
      }
      
      // 新增表單欄位
      function addFormField() {
          const id = document.getElementById('fieldId').value.trim();
          const label = document.getElementById('fieldLabel').value.trim();
          const type = document.getElementById('fieldType').value;
          const required = document.getElementById('fieldRequired').value === 'true';
          const placeholder = document.getElementById('fieldPlaceholder').value.trim();
          const options = document.getElementById('fieldOptions').value
              .split('\n')
              .map(s => s.trim())
              .filter(s => s);
          
          if (!id || !label) {
              alert('請填寫欄位識別碼和標籤');
              return;
          }
          
          // 檢查ID是否重複
          if (currentFormFields.some(field => field.id === id)) {
              alert('欄位識別碼已存在，請使用不同的識別碼');
              return;
          }
          
          currentFormFields.push({
              id: id,
              label: label,
              type: type,
              required: required,
              options: options,
              placeholder: placeholder
          });
          
          // 清空表單
          document.getElementById('fieldId').value = '';
          document.getElementById('fieldLabel').value = '';
          document.getElementById('fieldType').value = 'text';
          document.getElementById('fieldRequired').value = 'false';
          document.getElementById('fieldPlaceholder').value = '';
          document.getElementById('fieldOptions').value = '';
          toggleFieldOptions();
          
          renderCurrentFields();
      }
      
      // 移除表單欄位
      function removeFormField(index) {
          if (confirm('確定要刪除這個欄位嗎？')) {
              currentFormFields.splice(index, 1);
              renderCurrentFields();
          }
      }
      
      // 編輯表單欄位
      function editFormField(index) {
          const field = currentFormFields[index];
          
          document.getElementById('fieldId').value = field.id;
          document.getElementById('fieldLabel').value = field.label;
          document.getElementById('fieldType').value = field.type;
          document.getElementById('fieldRequired').value = field.required.toString();
          document.getElementById('fieldPlaceholder').value = field.placeholder || '';
          document.getElementById('fieldOptions').value = field.options.join('\n');
          
          toggleFieldOptions();
          
          // 移除原欄位，讓用戶重新新增
          currentFormFields.splice(index, 1);
          renderCurrentFields();
      }
      
      // 預覽表單
      function previewForm() {
          const previewSection = document.getElementById('formPreview');
          const previewContent = document.getElementById('previewContent');
          
          let formHtml = `<h4>${eventCategories[currentDesignCategory].icon} ${eventCategories[currentDesignCategory].name} 報名表單</h4>`;
          
          currentFormFields.forEach(field => {
              formHtml += `<div class="form-group">`;
              formHtml += `<label>${field.label} ${field.required ? '<span style="color: red;">*</span>' : ''}</label>`;
              
              switch (field.type) {
                  case 'textarea':
                      formHtml += `<textarea placeholder="${field.placeholder || ''}" rows="3"></textarea>`;
                      break;
                  case 'select':
                      formHtml += `<select><option value="">請選擇</option>`;
                      field.options.forEach(option => {
                          formHtml += `<option value="${option}">${option}</option>`;
                      });
                      formHtml += `</select>`;
                      break;
                  case 'radio':
                      field.options.forEach(option => {
                          formHtml += `<label style="font-weight: normal; margin-right: 15px;">
                              <input type="radio" name="${field.id}" value="${option}"> ${option}
                          </label>`;
                      });
                      break;
                  case 'checkbox':
                      field.options.forEach(option => {
                          formHtml += `<label style="font-weight: normal; margin-right: 15px;">
                              <input type="checkbox" name="${field.id}" value="${option}"> ${option}
                          </label>`;
                      });
                      break;
                  default:
                      formHtml += `<input type="${field.type}" placeholder="${field.placeholder || ''}">`;
                      break;
              }
              formHtml += `</div>`;
          });
          
          formHtml += `<button class="btn btn-primary" style="margin-top: 20px;">🎯 提交報名</button>`;
          
          previewContent.innerHTML = formHtml;
          previewSection.style.display = 'block';
      }
      
      // 儲存表單設計
      function saveFormDesign() {
          if (!currentDesignCategory) {
              alert('請先選擇活動類別');
              return;
          }
          
          // 這裡應該調用 API 儲存表單設計
          alert('✅ 表單設計已儲存！');
      }

          document.getElementById('enableDailyReport').checked = false;

      function saveNotificationSettings() {

      }
      
      function saveInterfaceSettings() {

      }

          if (confirm('⚠️ 警告：此操作將重置整個系統，所有資料將被清除！\n\n確定要繼續嗎？')) {
              if (confirm('🚨 最後確認：真的要重置系統嗎？')) {

      // 輔助函數
      function getFieldTypeLabel(type) {
          const labels = {
              text: '文字輸入',
              email: 'Email',
              tel: '電話號碼',
              date: '日期',
              select: '下拉選單',
              textarea: '多行文字',
              checkbox: '核取方塊',
              radio: '單選按鈕'
          };
          return labels[type] || type;
      }
  </script>
