<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>捐款確認</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
      * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
      }
      
      body {
          font-family: 'Arial', sans-serif;
          background: linear-gradient(135deg, #FF6B6B, #4ECDC4);
          min-height: 100vh;
          padding: 20px;
      }
      
      .container {
          max-width: 400px;
          margin: 0 auto;
          background: white;
          border-radius: 15px;
          box-shadow: 0 10px 30px rgba(0,0,0,0.2);
          overflow: hidden;
      }
      
      .header {
          background: #FF6B6B;
          color: white;
          padding: 20px;
          text-align: center;
      }
      
      .header h1 {
          font-size: 24px;
          margin-bottom: 5px;
      }
      
      .form-container {
          padding: 30px;
      }
      
      .form-group {
          margin-bottom: 20px;
      }
      
      label {
          display: block;
          margin-bottom: 8px;
          font-weight: bold;
          color: #333;
      }
      
      input[type="text"], input[type="number"] {
          width: 100%;
          padding: 12px;
          border: 2px solid #e0e0e0;
          border-radius: 8px;
          font-size: 16px;
          transition: border-color 0.3s;
      }
      
      input[type="text"]:focus, input[type="number"]:focus {
          outline: none;
          border-color: #4ECDC4;
      }
      
      .amount-display {
          background: #f8f9fa;
          padding: 15px;
          border-radius: 8px;
          text-align: center;
          font-size: 24px;
          font-weight: bold;
          color: #FF6B6B;
          margin-bottom: 20px;
      }
      
      .btn {
          width: 100%;
          padding: 15px;
          border: none;
          border-radius: 8px;
          font-size: 18px;
          font-weight: bold;
          cursor: pointer;
          transition: all 0.3s;
          margin-bottom: 10px;
      }
      
      .btn-primary {
          background: #4ECDC4;
          color: white;
      }
      
      .btn-primary:hover {
          background: #45B7B8;
          transform: translateY(-2px);
      }
      
      .btn-primary:disabled {
          background: #cccccc;
          cursor: not-allowed;
          transform: none;
      }
      
      .btn-secondary {
          background: #6c757d;
          color: white;
      }
      
      .btn-secondary:hover {
          background: #5a6268;
      }
      
      .hidden {
          display: none;
      }
      
      .error {
          color: #dc3545;
          font-size: 14px;
          margin-top: 5px;
      }
      
      .loading {
          display: none;
          text-align: center;
          padding: 20px;
      }
      
      .spinner {
          border: 4px solid #f3f3f3;
          border-top: 4px solid #4ECDC4;
          border-radius: 50%;
          width: 40px;
          height: 40px;
          animation: spin 1s linear infinite;
          margin: 0 auto 10px;
      }
      
      @keyframes spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
      }
      
      .success-message {
          background: #d4edda;
          color: #155724;
          padding: 15px;
          border-radius: 8px;
          margin-bottom: 20px;
          border: 1px solid #c3e6cb;
      }
      
      .error-message {
          background: #f8d7da;
          color: #721c24;
          padding: 15px;
          border-radius: 8px;
          margin-bottom: 20px;
          border: 1px solid #f5c6cb;
      }
  </style>
</head>
<body>
  <div class="container">
      <div class="header">
          <h1>💝 捐款確認</h1>
          <p>請填寫您的資料</p>
      </div>
      
      <div class="form-container">
          <div class="loading" id="loading">
              <div class="spinner"></div>
              <p>處理中...</p>
          </div>
          
          <div id="messageArea"></div>
          
          <form id="donationForm">
              <div class="form-group">
                  <label for="donorCode">捐款代號：</label>
                  <input type="text" id="donorCode" name="donorCode" placeholder="例：A01" required>
                  <div class="error" id="donorCodeError"></div>
              </div>
              
              <div class="form-group">
                  <label for="donorName">捐款人姓名/單位：</label>
                  <input type="text" id="donorName" name="donorName" placeholder="請輸入姓名或單位名稱" required>
                  <div class="error" id="donorNameError"></div>
              </div>
              
              <div class="form-group">
                  <label for="amount">捐款金額：</label>
                  <div class="amount-display" id="amountDisplay">NT$ 0</div>
                  <input type="number" id="customAmount" name="customAmount" placeholder="請輸入金額" min="1" class="hidden">
                  <div class="error" id="amountError"></div>
              </div>
              
              <button type="submit" class="btn btn-primary" id="submitBtn">確認捐款</button>
              <button type="button" class="btn btn-secondary" onclick="closeLiff()">取消</button>
          </form>
      </div>
  </div>

  <script>
      let currentAmount = 0;
      let isCustomAmount = false;
      let liffInitialized = false;
      let userProfile = null;

      // 初始化 LIFF
      async function initializeLiff() {
          try {
              // 從 GAS 設定取得 LIFF ID
              const liffId = await getLiffIdFromGAS();
              
              await liff.init({
                  liffId: liffId
              });
              
              liffInitialized = true;
              
              // 取得用戶資料
              if (liff.isLoggedIn()) {
                  userProfile = await liff.getProfile();
                  console.log('用戶資料:', userProfile);
              }
              
              // 獲取 URL 參數
              const urlParams = new URLSearchParams(window.location.search);
              const amount = urlParams.get('amount');
              const custom = urlParams.get('custom');
              
              if (custom === 'true') {
                  isCustomAmount = true;
                  document.getElementById('customAmount').classList.remove('hidden');
                  document.getElementById('amountDisplay').textContent = '自訂金額';
              } else if (amount) {
                  currentAmount = parseInt(amount);
                  document.getElementById('amountDisplay').textContent = `NT$ ${currentAmount.toLocaleString()}`;
              }
              
          } catch (err) {
              console.error('LIFF 初始化失敗:', err);
              showMessage('系統初始化失敗，請重新開啟', 'error');
          }
      }

      // 從 GAS 取得 LIFF ID
      async function getLiffIdFromGAS() {
          try {
              const response = await fetch(`${window.location.origin}/exec?action=getLiffId`);
              const data = await response.json();
              return data.liffId || 'YOUR_LIFF_ID'; // 備用值
          } catch (error) {
              console.error('取得 LIFF ID 失敗:', error);
              return 'YOUR_LIFF_ID'; // 備用值
          }
      }

      // 關閉 LIFF 視窗
      function closeLiff() {
          if (liffInitialized && liff.isInClient()) {
              liff.closeWindow();
          } else {
              window.close();
          }
      }

      // 顯示訊息
      function showMessage(message, type = 'info') {
          const messageArea = document.getElementById('messageArea');
          const messageClass = type === 'error' ? 'error-message' : 'success-message';
          
          messageArea.innerHTML = `<div class="${messageClass}">${message}</div>`;
          
          // 3秒後自動清除訊息
          setTimeout(() => {
              messageArea.innerHTML = '';
          }, 3000);
      }

      // 顯示/隱藏載入中
      function showLoading(show) {
          const loading = document.getElementById('loading');
          const form = document.getElementById('donationForm');
          const submitBtn = document.getElementById('submitBtn');
          
          if (show) {
              loading.style.display = 'block';
              form.style.display = 'none';
              submitBtn.disabled = true;
          } else {
              loading.style.display = 'none';
              form.style.display = 'block';
              submitBtn.disabled = false;
          }
      }

      // 表單提交處理
      document.getElementById('donationForm').addEventListener('submit', async function(e) {
          e.preventDefault();
          
          const donorCode = document.getElementById('donorCode').value.trim();
          const donorName = document.getElementById('donorName').value.trim();
          let amount = currentAmount;
          
          // 清除之前的錯誤訊息
          document.querySelectorAll('.error').forEach(el => el.textContent = '');
          
          // 驗證輸入
          let hasError = false;
          
          if (!donorCode) {
              document.getElementById('donorCodeError').textContent = '請輸入捐款代號';
              hasError = true;
          }
          
          if (!donorName) {
              document.getElementById('donorNameError').textContent = '請輸入捐款人姓名或單位';
              hasError = true;
          }
          
          if (isCustomAmount) {
              const customAmount = parseInt(document.getElementById('customAmount').value);
              if (!customAmount || customAmount <= 0) {
                  document.getElementById('amountError').textContent = '請輸入有效的捐款金額';
                  hasError = true;
              } else {
                  amount = customAmount;
              }
          } else if (!amount || amount <= 0) {
              document.getElementById('amountError').textContent = '捐款金額不能為空';
              hasError = true;
          }
          
          if (hasError) {
              return;
          }
          
          // 顯示載入中
          showLoading(true);
          
          try {
              // 準備捐款資料
              const donationData = {
                  donorCode: donorCode,
                  donorName: donorName,
                  amount: amount,
                  userId: userProfile ? userProfile.userId : 'liff_user',
                  displayName: userProfile ? userProfile.displayName : donorName
              };
              
              // 發送到 GAS 後端處理
              const result = await processDonationWithGAS(donationData);
              
              if (result.success) {
                  // 發送訊息到 LINE
                  const message = `${donorCode}${donorName}捐${amount}`;
                  
                  if (liffInitialized && liff.isInClient()) {
                      await liff.sendMessages([{
                          type: 'text',
                          text: message
                      }]);
                  }
                  
                  showMessage('捐款資訊已送出，感謝您的愛心！', 'success');
                  
                  // 2秒後關閉視窗
                  setTimeout(() => {
                      closeLiff();
                  }, 2000);
                  
              } else {
                  throw new Error(result.message || '處理失敗');
              }
              
          } catch (err) {
              console.error('處理捐款失敗:', err);
              showMessage('處理失敗，請重試：' + err.message, 'error');
          } finally {
              showLoading(false);
          }
      });

      // 透過 GAS 處理捐款
      async function processDonationWithGAS(donationData) {
          try {
              const response = await fetch(`${window.location.origin}/exec`, {
                  method: 'POST',
                  headers: {
                      'Content-Type': 'application/json',
                  },
                  body: JSON.stringify({
                      action: 'processDonation',
                      data: donationData
                  })
              });
              
              if (!response.ok) {
                  throw new Error(`HTTP error! status: ${response.status}`);
              }
              
              const result = await response.json();
              return result;
              
          } catch (error) {
              console.error('GAS 處理錯誤:', error);
              return { success: false, message: error.message };
          }
      }

      // 頁面載入完成後初始化
      window.addEventListener('load', initializeLiff);
  </script>
</body>
</html>
