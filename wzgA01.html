<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>桃園威振宮 - 行館喬遷建廟基金捐款</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
      * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
      }

      body {
          font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
          background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
          min-height: 100vh;
          padding: 20px;
      }

      .container {
          max-width: 500px;
          margin: 0 auto;
          background: white;
          border-radius: 20px;
          box-shadow: 0 20px 40px rgba(0,0,0,0.1);
          overflow: hidden;
      }

      .header {
          background: linear-gradient(135deg, #ff6b6b, #ee5a24);
          color: white;
          text-align: center;
          padding: 30px 20px;
      }

      .header h1 {
          font-size: 24px;
          margin-bottom: 10px;
          font-weight: 700;
      }

      .header p {
          opacity: 0.9;
          font-size: 16px;
      }

      .bank-info {
          background: #f8f9fa;
          padding: 20px;
          border-left: 4px solid #28a745;
          margin: 20px;
          border-radius: 8px;
      }

      .bank-info h3 {
          color: #28a745;
          margin-bottom: 15px;
          font-size: 18px;
      }

      .bank-detail {
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 10px;
          padding: 8px 0;
      }

      .bank-detail strong {
          color: #333;
          min-width: 80px;
      }

      .bank-detail span {
          color: #666;
          font-family: monospace;
          font-size: 16px;
      }

      .copy-btn {
          background: #28a745;
          color: white;
          border: none;
          padding: 4px 8px;
          border-radius: 4px;
          cursor: pointer;
          font-size: 12px;
          margin-left: 10px;
      }

      .copy-btn:hover {
          background: #218838;
      }

      .form-container {
          padding: 30px;
      }

      .form-group {
          margin-bottom: 25px;
      }

      .form-group label {
          display: block;
          margin-bottom: 8px;
          font-weight: 600;
          color: #333;
          font-size: 16px;
      }

      .required {
          color: #e74c3c;
      }

      .form-control {
          width: 100%;
          padding: 15px;
          border: 2px solid #e9ecef;
          border-radius: 10px;
          font-size: 16px;
          transition: all 0.3s ease;
          background: #f8f9fa;
      }

      .form-control:focus {
          outline: none;
          border-color: #667eea;
          background: white;
          box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }

      .amount-buttons {
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          gap: 10px;
          margin-bottom: 15px;
      }

      .amount-btn {
          padding: 12px;
          border: 2px solid #e9ecef;
          background: #f8f9fa;
          border-radius: 8px;
          cursor: pointer;
          transition: all 0.3s ease;
          font-size: 14px;
          font-weight: 600;
      }

      .amount-btn:hover {
          border-color: #667eea;
          background: #667eea;
          color: white;
      }

      .amount-btn.active {
          border-color: #667eea;
          background: #667eea;
          color: white;
      }

      .submit-btn {
          width: 100%;
          padding: 18px;
          background: linear-gradient(135deg, #667eea, #764ba2);
          color: white;
          border: none;
          border-radius: 12px;
          font-size: 18px;
          font-weight: 700;
          cursor: pointer;
          transition: all 0.3s ease;
          margin-top: 20px;
      }

      .submit-btn:hover:not(:disabled) {
          transform: translateY(-2px);
          box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
      }

      .submit-btn:disabled {
          opacity: 0.6;
          cursor: not-allowed;
      }

      .loading {
          display: inline-block;
          width: 20px;
          height: 20px;
          border: 3px solid rgba(255,255,255,.3);
          border-radius: 50%;
          border-top-color: #fff;
          animation: spin 1s ease-in-out infinite;
      }

      @keyframes spin {
          to { transform: rotate(360deg); }
      }

      .success-modal {
          display: none;
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background: rgba(0,0,0,0.5);
          z-index: 1000;
          justify-content: center;
          align-items: center;
      }

      .success-content {
          background: white;
          padding: 40px;
          border-radius: 20px;
          text-align: center;
          max-width: 400px;
          margin: 20px;
      }

      .success-icon {
          font-size: 60px;
          color: #28a745;
          margin-bottom: 20px;
      }

      .liff-info {
          background: #e3f2fd;
          padding: 15px;
          margin: 20px;
          border-radius: 8px;
          border-left: 4px solid #2196f3;
      }

      .liff-status {
          font-size: 14px;
          color: #1976d2;
          font-weight: 600;
      }

      .user-info {
          background: #f3e5f5;
          padding: 15px;
          margin: 20px;
          border-radius: 8px;
          border-left: 4px solid #9c27b0;
      }

      .error-message {
          background: #ffebee;
          color: #c62828;
          padding: 15px;
          margin: 20px;
          border-radius: 8px;
          border-left: 4px solid #f44336;
          display: none;
      }
  </style>
</head>
<body>
  <div class="container">
      <div class="header">
          <h1>🏛️ 桃園威振宮</h1>
          <p>行館喬遷建廟基金捐款</p>
      </div>

      <div class="liff-info">
          <div class="liff-status" id="liffStatus">正在初始化 LIFF...</div>
      </div>

      <div class="user-info" id="userInfo" style="display: none;">
          <div><strong>使用者：</strong><span id="userName"></span></div>
          <div><strong>群組：</strong><span id="groupName"></span></div>
      </div>

      <div class="error-message" id="errorMessage"></div>

      <div class="bank-info">
          <h3>💰 匯款資訊</h3>
          <div class="bank-detail">
              <strong>銀行：</strong>
              <span>台灣銀行 桃園分行</span>
              <button class="copy-btn" onclick="copyText('台灣銀行 桃園分行')">複製</button>
          </div>
          <div class="bank-detail">
              <strong>戶名：</strong>
              <span>桃園威振宮</span>
              <button class="copy-btn" onclick="copyText('桃園威振宮')">複製</button>
          </div>
          <div class="bank-detail">
              <strong>帳號：</strong>
              <span>123-456-789012</span>
              <button class="copy-btn" onclick="copyText('123456789012')">複製</button>
          </div>
      </div>

      <div class="form-container">
          <form id="donationForm">
              <div class="form-group">
                  <label for="name">姓名 <span class="required">*</span></label>
                  <input type="text" id="name" name="name" class="form-control" required>
              </div>

              <div class="form-group">
                  <label for="phone">聯絡電話 <span class="required">*</span></label>
                  <input type="tel" id="phone" name="phone" class="form-control" required>
              </div>

              <div class="form-group">
                  <label for="amount">捐款金額 <span class="required">*</span></label>
                  <div class="amount-buttons">
                      <button type="button" class="amount-btn" data-amount="500">$500</button>
                      <button type="button" class="amount-btn" data-amount="1000">$1,000</button>
                      <button type="button" class="amount-btn" data-amount="2000">$2,000</button>
                      <button type="button" class="amount-btn" data-amount="3000">$3,000</button>
                      <button type="button" class="amount-btn" data-amount="5000">$5,000</button>
                      <button type="button" class="amount-btn" data-amount="10000">$10,000</button>
                  </div>
                  <input type="number" id="amount" name="amount" class="form-control" placeholder="請輸入捐款金額" required min="1">
              </div>

              <div class="form-group">
                  <label for="remarks">備註</label>
                  <textarea id="remarks" name="remarks" class="form-control" rows="3" placeholder="其他備註事項（選填）"></textarea>
              </div>

              <button type="submit" class="submit-btn" id="submitBtn">
                  🙏 確認捐款
              </button>
          </form>
      </div>
  </div>

  <div class="success-modal" id="successModal">
      <div class="success-content">
          <div class="success-icon">✅</div>
          <h2>捐款登記成功！</h2>
          <p>感謝您的善心捐助<br>功德無量 🙏</p>
          <button onclick="closeSuccessModal()" style="margin-top: 20px; padding: 10px 20px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer;">確定</button>
      </div>
  </div>

  <script>
      let isSubmitting = false;
      let liffInitialized = false;
      let userProfile = null;
      let contextInfo = null;

      // LIFF 初始化
      document.addEventListener('DOMContentLoaded', function() {
          initializeLiff();
          setupEventListeners();
      });

      async function initializeLiff() {
          try {
              const liffId = '2006113324-od69VN74'; // 請替換為您的 LIFF ID
              await liff.init({ liffId: liffId });
              
              document.getElementById('liffStatus').textContent = '✅ LIFF 初始化成功';
              liffInitialized = true;

              if (liff.isLoggedIn()) {
                  // 取得使用者資訊
                  userProfile = await liff.getProfile();
                  
                  // 取得聊天室資訊
                  contextInfo = liff.getContext();
                  
                  // 顯示使用者資訊
                  displayUserInfo();
                  
                  // 自動填入使用者姓名
                  if (userProfile.displayName) {
                      document.getElementById('name').value = userProfile.displayName;
                  }
              } else {
                  liff.login();
              }
          } catch (error) {
              console.error('LIFF 初始化失敗:', error);
              document.getElementById('liffStatus').textContent = '❌ LIFF 初始化失敗';
              showError('LIFF 初始化失敗，部分功能可能無法使用');
          }
      }

      function displayUserInfo() {
          if (userProfile) {
              document.getElementById('userName').textContent = userProfile.displayName || '未知';
              
              let contextText = '個人聊天';
              if (contextInfo) {
                  if (contextInfo.type === 'group') {
                      contextText = '群組聊天';
                  } else if (contextInfo.type === 'room') {
                      contextText = '聊天室';
                  }
              }
              
              document.getElementById('groupName').textContent = contextText;
              document.getElementById('userInfo').style.display = 'block';
          }
      }

      function setupEventListeners() {
          // 金額按鈕事件
          document.querySelectorAll('.amount-btn').forEach(btn => {
              btn.addEventListener('click', function() {
                  document.querySelectorAll('.amount-btn').forEach(b => b.classList.remove('active'));
                  this.classList.add('active');
                  document.getElementById('amount').value = this.dataset.amount;
              });
          });

          // 表單提交事件
          document.getElementById('donationForm').addEventListener('submit', handleFormSubmit);
      }

      async function handleFormSubmit(e) {
          e.preventDefault();
          if (isSubmitting) return;

          const name = document.getElementById('name').value.trim();
          const phone = document.getElementById('phone').value.trim();
          const amount = document.getElementById('amount').value.trim();
          const remarks = document.getElementById('remarks').value.trim();

          // 表單驗證
          if (!name || !phone || !amount) {
              showError('請填寫所有必填欄位');
              return;
          }

          if (!/^[0-9+\-\s()]+$/.test(phone)) {
              showError('請輸入有效的電話號碼');
              return;
          }

          if (parseInt(amount) < 1) {
              showError('捐款金額必須大於 0');
              return;
          }

          isSubmitting = true;
          const submitBtn = document.getElementById('submitBtn');
          submitBtn.disabled = true;
          submitBtn.innerHTML = '提交中... <span class="loading"></span>';

          try {
              const formData = {
                  name: name,
                  phone: phone,
                  amount: amount,
                  remarks: remarks,
                  timestamp: new Date().toLocaleString('zh-TW'),
                  source: 'liff_form',
                  userId: userProfile ? userProfile.userId : null,
                  displayName: userProfile ? userProfile.displayName : null,
                  contextType: contextInfo ? contextInfo.type : null,
                  groupId: contextInfo && contextInfo.type === 'group' ? contextInfo.groupId : null,
                  roomId: contextInfo && contextInfo.type === 'room' ? contextInfo.roomId : null
              };

              console.log('提交資料:', formData);

              // 提交到 Google Apps Script
              const gasUrl = 'https://script.google.com/macros/s/AKfycbwpo7bHiigZTvamWuF0niEMLkvQ5svG9IAwdhZswIVOtMc9P9-RLhgyiryda6GbIY8f/exec'; // 請替換為您的 GAS URL
              const response = await fetch(gasUrl, {
                  method: 'POST',
                  headers: {
                      'Content-Type': 'application/json'
                  },
                  body: JSON.stringify(formData)
              });

              if (!response.ok) {
                  throw new Error(`HTTP ${response.status}: ${response.statusText}`);
              }

              const result = await response.json();
              console.log('提交結果:', result);

              if (result.result === 'success') {
                  // 發送 LINE 訊息到群組
                  await sendLineMessage(formData);
                  
                  showSuccessModal();
                  document.getElementById('donationForm').reset();
                  document.querySelectorAll('.amount-btn').forEach(b => b.classList.remove('active'));
              } else {
                  throw new Error(result.message || '提交失敗');
              }

          } catch (error) {
              console.error('提交錯誤:', error);
              showError(`提交失敗: ${error.message}`);
          } finally {
              isSubmitting = false;
              submitBtn.disabled = false;
              submitBtn.textContent = '🙏 確認捐款';
          }
      }

      async function sendLineMessage(formData) {
          if (!liffInitialized || !liff.isLoggedIn()) {
              console.log('LIFF 未初始化或未登入，跳過發送訊息');
              return;
          }

          try {
              const message = `🙏 建廟捐款登記

👤 姓名：${formData.name}
📞 電話：${formData.phone}
💰 金額：NT$ ${parseInt(formData.amount).toLocaleString()}
📝 備註：${formData.remarks || '無'}
⏰ 時間：${formData.timestamp}

感謝您的善心捐助！🙏✨`;

              // 使用 LIFF 發送訊息
              if (liff.isApiAvailable('sendMessages')) {
                  await liff.sendMessages([{
                      type: 'text',
                      text: message
                  }]);
                  console.log('✅ LINE 訊息發送成功');
              } else {
                  console.log('❌ sendMessages API 不可用');
              }
          } catch (error) {
              console.error('發送 LINE 訊息失敗:', error);
              // 不影響主要流程，只記錄錯誤
          }
      }

      function showError(message) {
          const errorDiv = document.getElementById('errorMessage');
          errorDiv.textContent = message;
          errorDiv.style.display = 'block';
          setTimeout(() => {
              errorDiv.style.display = 'none';
          }, 5000);
      }

      function showSuccessModal() {
          document.getElementById('successModal').style.display = 'flex';
      }

      function closeSuccessModal() {
          document.getElementById('successModal').style.display = 'none';
      }

      function copyText(text) {
          navigator.clipboard.writeText(text).then(() => {
              alert('已複製到剪貼簿');
          }).catch(() => {
              // 備用複製方法
              const textarea = document.createElement('textarea');
              textarea.value = text;
              document.body.appendChild(textarea);
              textarea.select();
              document.execCommand('copy');
              document.body.removeChild(textarea);
              alert('已複製到剪貼簿');
          });
      }
  </script>
</body>
</html>
