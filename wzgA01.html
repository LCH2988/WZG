<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>桃園威振宮 - 建廟基金捐款</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
      font-family: 'Microsoft JhengHei', Arial, sans-serif;
      background: linear-gradient(135deg, #8B0000, #CD853F);
      min-height: 100vh;
      padding: 20px;
      font-size: 18px;
  }
  .container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      overflow: hidden;
  }
  .header {
      background: linear-gradient(135deg, #8B0000, #CD853F);
      color: white;
      padding: 30px;
      text-align: center;
  }
  .header h1 {
      font-size: 2em;
      margin-bottom: 10px;
  }
  .status-info {
      background: #f0f8ff;
      padding: 15px;
      margin: 20px;
      border-radius: 10px;
      border-left: 5px solid #4169E1;
  }
  .status-success { border-left-color: #28a745; background: #d4edda; }
  .status-error { border-left-color: #dc3545; background: #f8d7da; }
  .form-section { padding: 30px; }
  .form-group { margin-bottom: 25px; }
  .form-group label {
      display: block;
      margin-bottom: 10px;
      font-weight: bold;
      color: #333;
      font-size: 1.1em;
  }
  .required { color: #DC143C; }
  input[type="text"], input[type="tel"], input[type="number"], textarea {
      width: 100%;
      padding: 15px;
      border: 2px solid #ddd;
      border-radius: 10px;
      font-size: 1em;
      transition: border-color 0.3s;
  }
  input:focus, textarea:focus {
      outline: none;
      border-color: #DAA520;
      box-shadow: 0 0 10px rgba(218,165,32,0.3);
  }
  .amount-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 15px;
  }
  .amount-btn {
      background: #f8f9fa;
      border: 2px solid #ddd;
      border-radius: 10px;
      padding: 15px;
      font-size: 1em;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
      text-align: center;
  }
  .amount-btn:hover {
      background: #e9ecef;
      border-color: #DAA520;
  }
  .amount-btn:active {
      background: #DAA520;
      color: white;
  }
  textarea { min-height: 100px; resize: vertical; }
  .bank-info {
      background: #f0f8ff;
      padding: 20px;
      border-radius: 10px;
      margin: 20px 0;
      border-left: 5px solid #4169E1;
  }
  .bank-info h4 {
      color: #4169E1;
      margin-bottom: 15px;
      font-size: 1.3em;
  }
  .bank-detail {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #e0e0e0;
  }
  .bank-detail:last-child { border-bottom: none; }
  .account-number {
      font-family: monospace;
      font-size: 1.2em;
      color: #DC143C;
      font-weight: bold;
  }
  .submit-btn {
      background: linear-gradient(135deg, #DAA520, #FFD700);
      color: white;
      padding: 20px 40px;
      border: none;
      border-radius: 10px;
      font-size: 1.3em;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      transition: all 0.3s;
      margin-top: 20px;
  }
  .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(218,165,32,0.4);
  }
  .submit-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
  }
  .loading {
      display: inline-block;
      width: 20px; height: 20px;
      border: 3px solid rgba(255, 255, 255, .3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 1s ease-in-out infinite;
      margin-left: 10px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  
  .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
  }
  .modal-content {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      padding: 30px;
      border-radius: 15px;
      max-width: 500px; width: 90%;
      text-align: center;
  }
  .success-icon {
      font-size: 3em;
      color: #28a745;
      margin-bottom: 20px;
  }
  .modal-btn {
      background: #28a745;
      color: white;
      border: none;
      padding: 15px 30px;
      border-radius: 10px;
      font-size: 1.1em;
      cursor: pointer;
      margin-top: 20px;
  }
  .modal-btn:hover {
      background: #218838;
  }
  
  @media (max-width: 768px) {
      body { font-size: 16px; padding: 10px; }
      .form-section { padding: 20px; }
      .amount-buttons { grid-template-columns: repeat(2, 1fr); }
      .submit-btn { font-size: 1.2em; padding: 18px 30px; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
      <h1>🙏 威振宮</h1>
      <p>行館喬遷建廟基金捐款</p>
  </div>
  
  <div id="liffStatus" class="status-info">
      <div>🔄 正在初始化...</div>
  </div>
  
  <div class="form-section">
      <form id="donationForm">
          <div class="form-group">
              <label for="name">姓名 <span class="required">*</span></label>
              <input type="text" id="name" name="name" required>
          </div>
          
          <div class="form-group">
              <label for="phone">電話 <span class="required">*</span></label>
              <input type="tel" id="phone" name="phone" required pattern="09\d{8}" placeholder="例：0912345678">
          </div>
          
          <div class="form-group">
              <label for="amount">捐款金額 <span class="required">*</span></label>
              <input type="number" id="amount" name="amount" min="100" required placeholder="請輸入捐款金額">
              <div class="amount-buttons">
                  <button type="button" class="amount-btn" data-amount="1000">1千元</button>
                  <button type="button" class="amount-btn" data-amount="2000">2千元</button>
                  <button type="button" class="amount-btn" data-amount="5000">5千元</button>
                  <button type="button" class="amount-btn" data-amount="10000">1萬元</button>
                  <button type="button" class="amount-btn" data-amount="20000">2萬元</button>
                  <button type="button" class="amount-btn" data-amount="50000">5萬元</button>
              </div>
          </div>
          
          <div class="form-group">
              <label for="remarks">備註</label>
              <textarea id="remarks" name="remarks" placeholder="如有特殊需求或祈願內容，請在此填寫..."></textarea>
          </div>
          
          <div class="bank-info">
              <h4>💰 匯款資訊</h4>
              <div class="bank-detail">
                  <strong>銀行：</strong>
                  <span>土地銀行 - 內壢分行</span>
              </div>
              <div class="bank-detail">
                  <strong>帳號：</strong>
                  <span class="account-number">145-001-007228</span>
              </div>
              <div class="bank-detail">
                  <strong>戶名：</strong>
                  <span>桃園市威振關懷慈善協會</span>
              </div>
              <p style="margin-top: 15px; color: #666; font-size: 0.9em;">
                  ※ 匯款後請填寫此表單以便核對，感謝您的善心捐助
              </p>
          </div>
          
          <button type="submit" class="submit-btn" id="submitBtn">🙏 提交捐款登記</button>
      </form>
  </div>
</div>

<!-- 成功提交模態框 -->
<div id="successModal" class="modal">
  <div class="modal-content">
      <div class="success-icon">🙏</div>
      <h3>感謝您的善心捐助！</h3>
      <p id="successMessage">您的捐款資料已成功提交</p>
      <p>廟方將儘快與您聯繫確認</p>
      <p style="color: #666; font-size: 0.9em; margin-top: 10px;">功德無量，福慧雙修</p>
      <button class="modal-btn" onclick="closeModal()">確定</button>
  </div>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
  let userProfile = null;
  let isSubmitting = false;

  document.addEventListener('DOMContentLoaded', function() {
      const liffId = "2006113324-od69VN74";
      const statusDiv = document.getElementById('liffStatus');

      // 更新狀態顯示
      function updateStatus(message, type = 'info') {
          statusDiv.className = `status-info status-${type}`;
          statusDiv.innerHTML = `<div>${message}</div>`;
      }

      // LIFF 初始化
      liff.init({ liffId })
          .then(() => {
              updateStatus('✅ LIFF 初始化成功', 'success');
              
              if (liff.isLoggedIn()) {
                  return liff.getProfile();
              } else {
                  liff.login();
                  return null;
              }
          })
          .then((profile) => {
              if (profile) {
                  userProfile = profile;
                  updateStatus(`✅ 使用者：${profile.displayName}`, 'success');
              }
          })
          .catch((err) => {
              console.error('LIFF 初始化失敗:', err);
              updateStatus('❌ LIFF 初始化失敗: ' + err.message, 'error');
          });

      // 金額按鍵事件
      document.querySelectorAll('.amount-btn').forEach(button => {
          button.addEventListener('click', function() {
              const amount = this.getAttribute('data-amount');
              document.getElementById('amount').value = amount;
              
              // 視覺回饋
              document.querySelectorAll('.amount-btn').forEach(btn => {
                  btn.style.background = '#f8f9fa';
                  btn.style.color = '#333';
              });
              
              this.style.background = '#DAA520';
              this.style.color = 'white';
              
              setTimeout(() => {
                  this.style.background = '#f8f9fa';
                  this.style.color = '#333';
              }, 300);
          });
      });

      // 手動輸入金額時重置按鈕
      document.getElementById('amount').addEventListener('input', function() {
          this.value = this.value.replace(/[^\d]/g, '');
      });

      // 表單提交
      document.getElementById('donationForm').addEventListener('submit', async function(e) {
          e.preventDefault();
          
          if (isSubmitting) return;
          
          // 驗證表單
          if (!validateForm()) return;
          
          isSubmitting = true;
          const submitBtn = document.getElementById('submitBtn');
          const originalText = submitBtn.textContent;
          submitBtn.disabled = true;
          submitBtn.innerHTML = '提交中... <span class="loading"></span>';

          try {
              // 收集表單資料
              const formData = {
                  name: document.getElementById('name').value.trim(),
                  phone: document.getElementById('phone').value.trim(),
                  amount: parseInt(document.getElementById('amount').value),
                  remarks: document.getElementById('remarks').value.trim(),
                  timestamp: new Date().toLocaleString('zh-TW'),
                  liffUserId: userProfile?.userId || '',
                  liffDisplayName: userProfile?.displayName || '',
                  source: 'liff_form'
              };

              // 提交到後端
              const response = await fetch('https://script.google.com/macros/s/AKfycbw51MgwjIyvBC7hd1x6smQX0ImaQXQubg8sllJdK4RhgVkx98di0vlaSsxfM3X3mvbu/exec', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify(formData)
              });

              const result = await response.json();
              
              if (result.success) {
                  // 顯示成功訊息
                  document.getElementById('successMessage').textContent = 
                      `您的捐款資料已成功提交，登記序號：#${result.registrationId}`;
                  document.getElementById('successModal').style.display = 'block';
                  
                  // 重置表單
                  document.getElementById('donationForm').reset();
              } else {
                  throw new Error(result.message || '提交失敗');
              }

          } catch (error) {
              console.error('提交錯誤:', error);
              alert('提交失敗：' + error.message + '\n\n請稍後再試或聯繫廟方');
          } finally {
              isSubmitting = false;
              submitBtn.disabled = false;
              submitBtn.textContent = originalText;
          }
      });

      // 表單驗證
      function validateForm() {
          const name = document.getElementById('name').value.trim();
          const phone = document.getElementById('phone').value.trim();
          const amount = document.getElementById('amount').value;

          if (!name) {
              alert('請填寫姓名');
              document.getElementById('name').focus();
              return false;
          }

          if (!phone) {
              alert('請填寫電話');
              document.getElementById('phone').focus();
              return false;
          }

          if (!/^09\d{8}$/.test(phone)) {
              alert('請輸入正確的手機號碼格式（09xxxxxxxx）');
              document.getElementById('phone').focus();
              return false;
          }

          if (!amount || amount < 100) {
              alert('請輸入有效的捐款金額（最少100元）');
              document.getElementById('amount').focus();
              return false;
          }

          return true;
      }

      // 關閉模態框
      window.closeModal = function() {
          document.getElementById('successModal').style.display = 'none';
      }

      // 點擊模態框外部關閉
      window.onclick = function(event) {
          const modal = document.getElementById('successModal');
          if (event.target === modal) {
              modal.style.display = 'none';
          }
      }
  });
</script>
</body>
</html>
